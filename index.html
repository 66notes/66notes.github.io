<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="google-site-verification" content="DUhSlZZlkWLDp04O71VciiUsekAN75p1lpoH8JjM1LA" />
    <title>66notes bubt - Student Dashboard</title>
    <meta name="description" content="66Notes BUBT student dashboard for BUBT Intake66." />
    <link rel="canonical" href="https://66notes.github.io/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <style>
        :root {
            --bg: #f4f7fc; --surface: #ffffff; --border: #eef2f6; --border-strong: #e0e5ec;
            --text: #1e2a3e; --text-secondary: #6b7280; --text-muted: #9ca3af;
            --navy: #0d2b4e; --accent: #2563eb; --accent-light: #eff6ff;
            --radius: 14px; --radius-lg: 18px; --radius-xl: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
            --shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.07);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
            min-height: 100dvh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            line-height: 1.5;
            padding: 20px;
        }

        /* Top Bar for Theme Toggle */
        .top-app-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 14px; }
        .top-app-bar__title { font-size: 1.15rem; font-weight: 700; color: var(--navy); letter-spacing: -0.3px; }
        .top-app-bar__title span { color: var(--accent); }
        .theme-toggle-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--accent); font-size: 0.85rem; cursor: pointer; transition: background var(--transition), transform 0.15s, color var(--transition); box-shadow: var(--shadow-sm); }
        .theme-toggle-btn:active { transform: scale(0.92); }

        /* Login Card */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            animation: fade-in 0.4s ease;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.4rem;
            letter-spacing: -0.5px;
        }

        .login-header h1 span { color: var(--accent); }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 700; /* Makes the numbers (66, 4, DEMO) bold */
            color: var(--text);
            background: var(--bg);
            border: 1.5px solid var(--border-strong);
            border-radius: var(--radius);
            outline: none;
            transition: border-color var(--transition), background var(--transition);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .form-control:focus {
            border-color: var(--accent);
            background: var(--surface);
        }

        /* Custom Select Arrow */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '\f107'; /* FontAwesome angle-down */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            margin-top: 1rem;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: var(--navy);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background var(--transition), transform 0.15s;
        }

        .btn-submit:active {
            transform: scale(0.98);
            background: var(--accent);
        }

        /* Dark Mode */
        :root[data-theme="dark"] {
            --bg: #0f0f10; --surface: #1a1a1c; --border: #2a2a2d; --border-strong: #3a3a3e;
            --text: #eaeaea; --text-secondary: #a0a0a3; --text-muted: #6e6e72;
            --navy: #e4e4e6; --accent: #7bb0ff; --accent-light: #242428;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
            --shadow: 0 6px 20px rgba(0,0,0,0.5);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        :root[data-theme="dark"] body { background: var(--bg); color: var(--text); }
        :root[data-theme="dark"] .login-container { background: var(--surface); border-color: var(--border); }
        :root[data-theme="dark"] .login-header h1 { color: #eaeaea; }
        :root[data-theme="dark"] .form-control { background: #161618; border-color: #333338; color: #eaeaea; }
        :root[data-theme="dark"] .form-control:focus { border-color: #7bb0ff; }
        :root[data-theme="dark"] .btn-submit { background: #2563eb; color: #fff; }
        :root[data-theme="dark"] .btn-submit:active { background: #1d4ed8; }
        :root[data-theme="dark"] .theme-toggle-btn { background: #1a1a1c; border-color: #2a2a2d; color: #fbbf24; }
    </style>
    <!-- Font Awesome for the dropdown arrow -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <header class="top-app-bar">
        <h1 class="top-app-bar__title">66<span>Notes</span></h1>
        <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Switch to dark mode">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <main class="login-container">
        <div class="login-header">
            <h1>Welcome<span>.</span></h1>
            <p>Select Section & Intake and Press "Continue" if already Selected.</p>
        </div>

        <form id="loginForm">
            <!-- Institute -->
            <div class="form-group">
                <label for="institute">Institute</label>
                <div class="select-wrapper">
                    <select class="form-control" id="institute" required>
                        <option value="DEFAULT" selected>DEFAULT</option>
                    </select>
                </div>
            </div>

            <!-- Intake -->
            <div class="form-group">
                <label for="intake">Intake</label>
                <div class="select-wrapper">
                    <select class="form-control" id="intake" required>
                        <option value="66" selected>66</option>
                    </select>
                </div>
            </div>

            <!-- Section -->
            <div class="form-group">
                <label for="section">Section</label>
                <div class="select-wrapper">
                    <select class="form-control" id="section" required>
                        <option value="4" selected>4</option>
                        <option value="DEMO">DEMO</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">Continue ></button>
        </form>
    </main>

    <script>
    (function () {
        'use strict';

        /* ═══════════════ THEME TOGGLE ═══════════════ */
        const themeBtn = document.getElementById('themeToggle');
        
        function applyTheme(dark) {
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            themeBtn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#0f0f10' : '#ffffff');
        }

        applyTheme(false); // Default light mode

        themeBtn.addEventListener('click', () => {
            applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
        });

        /* ═══════════════ PREFERENCES LOGIC ═══════════════ */
        const instSelect = document.getElementById('institute');
        const intakeSelect = document.getElementById('intake');
        const secSelect = document.getElementById('section');

        // Keys for localStorage
        const PREF_KEY = '66notes_login_prefs';

        // Load saved preferences
        try {
            const saved = JSON.parse(localStorage.getItem(PREF_KEY));
            if (saved) {
                if (saved.institute) instSelect.value = saved.institute;
                if (saved.intake) intakeSelect.value = saved.intake;
                if (saved.section) secSelect.value = saved.section;
            }
        } catch (e) {
            console.warn('Could not load preferences');
        }

        // Save preferences when form is submitted
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            // Save to localStorage
            const prefs = {
                institute: instSelect.value,
                intake: intakeSelect.value,
                section: secSelect.value
            };
            localStorage.setItem(PREF_KEY, JSON.stringify(prefs));

            // Redirect logic
            let targetUrl = 'https://66notes.github.io/4'; // Default
            
            if (prefs.section === '4') {
                targetUrl = 'https://66notes.github.io/4';
            } else if (prefs.section === 'DEMO') {
                targetUrl = 'https://66notes.github.io/demo';
            }

            window.location.href = targetUrl;
        });
    })();
    </script>
</body>
</html>
