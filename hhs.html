<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>

    <!-- Meta redirect (works even if JavaScript is disabled) -->
    <meta http-equiv="refresh" content="0; url=https://drive.google.com/drive/folders/1Qb4SWcCtIoMXOIVrdCFYP0v2OlnXLe25" />

    <style>
        /* Quick, clean loading style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f9fa;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 1rem;
        }

        .card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            transition: opacity 0.2s;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        p {
            color: #5f6368;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .manual-link {
            display: inline-block;
            padding: 0.7rem 1.8rem;
            background: #1a73e8;
            color: white;
            border-radius: 2rem;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.1s;
        }

        .manual-link:hover {
            background: #1557b0;
        }

        .manual-link:active {
            transform: scale(0.96);
        }

        .note {
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>

        <h1>Redirecting you&hellip;</h1>

        <p>
            Taking you to the Google Drive folder.
            <br />
            If nothing happens, click the button below.
        </p>

        <a
        href="https://drive.google.com/drive/folders/1Qb4SWcCtIoMXOIVrdCFYP0v2OlnXLe25"
        class="manual-link"
        >
        Open Google Drive
    </a>

    <p class="note">
        You will be redirected automatically.
    </p>
</div>

<!-- JavaScript redirect (instant, but meta tag handles it even if JS is off) -->
<script>
    (function() {
        // Instant redirect (in case meta refresh is blocked or slow)
        window.location.replace(
            'https://drive.google.com/drive/folders/1Qb4SWcCtIoMXOIVrdCFYP0v2OlnXLe25'
        );
    })();
</script>

</body>
</html>
