<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Ludo · 66Games</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Socket.IO for Online Mode -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root {
            --bg: #f4f7fc; --surface: #ffffff; --border: #eef2f6; --text: #1e2a3e; --navy: #0d2b4e;
            --accent: #123cf3; --accent-light: #eef2ff; --red: #ef4444; --red-light: #fee2e2;
            --green: #22c55e; --radius: 14px; --shadow: 0 6px 20px rgba(0,0,0,0.05);
            --p1-color: #123cf3; --p2-color: #ef4444;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        /* ══════════ TOP BAR ══════════ */
        .top-bar { 
            height: 56px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .logo-small { font-size: 1.15rem; font-weight: 700; color: var(--navy); text-decoration: none; }
        .logo-small span { color: var(--accent); }
        .brand-badge { 
            background: linear-gradient(135deg, #f97316, #ea580c); color: white; 
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; 
            box-shadow: 0 2px 8px rgba(234,88,12,0.3); 
        }
        
        /* ══════════ SCREENS ══════════ */
        .screen { max-width: 600px; margin: 0 auto; padding: 20px; display: none; flex-direction: column; align-items: center; text-align: center; min-height: calc(100vh - 56px); }
        .screen.active { display: flex; }
        .title { font-size: 1.5rem; font-weight: 700; color: var(--navy); margin-bottom: 20px; }
        
        /* ══════════ BUTTONS & INPUTS ══════════ */
        .btn { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; 
            font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; 
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; 
            justify-content: center; gap: 10px; margin-bottom: 12px; 
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(18,60,243,0.3); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-outline { background: var(--surface); border: 2px solid var(--accent); color: var(--accent); }
        
        .input-roll { 
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--border); 
            font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 10px; 
            outline: none; font-family: 'Poppins', sans-serif; background: var(--surface); 
            color: var(--text); transition: border-color var(--transition);
        }
        .input-roll:focus { border-color: var(--accent); }
        
        /* ══════════ ONLINE LIST ══════════ */
        .online-list { 
            width: 100%; background: var(--surface); border-radius: 12px; 
            border: 1px solid var(--border); max-height: 300px; overflow-y: auto; margin-bottom: 20px; 
        }
        .online-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .online-item:last-child { border-bottom: none; }
        .btn-sm { padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; width: auto; margin: 0; }
        
        /* ══════════ GAME SCREEN ══════════ */
        #game-screen { justify-content: flex-start; padding-top: 10px; }
        .game-header { display: flex; justify-content: space-between; width: 100%; max-width: 360px; margin-bottom: 20px; }
        .player-card { 
            padding: 8px 16px; border-radius: 10px; font-weight: 700; border: 2px solid transparent; 
            background: var(--surface); box-shadow: var(--shadow); transition: 0.3s; font-size: 0.9rem;
        }
        .player-card.active { border-color: var(--accent); transform: scale(1.05); }
        .p1-text { color: var(--p1-color); }
        .p2-text { color: var(--p2-color); }

        /* 5x5 Grid */
        .board { 
            width: 100%; max-width: 360px; aspect-ratio: 1; 
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); 
            gap: 4px; background: var(--surface); padding: 10px; border-radius: 20px; 
            box-shadow: var(--shadow); position: relative; 
        }
        .cell { 
            background: var(--bg); border-radius: 6px; display: flex; align-items: center; 
            justify-content: center; position: relative; border: 1px solid var(--border); 
        }
        
        /* Board Coloring */
        .cell-start-p1 { background: var(--accent-light); border-color: #bfdbfe; }
        .cell-start-p2 { background: var(--red-light); border-color: #fecaca; }
        .cell-center { background: #fef3c7; border-color: #fde68a; font-size: 1.5rem; grid-column: 3; grid-row: 3; }
        
        /* Pawns */
        .pawn { 
            width: 60%; height: 60%; border-radius: 50%; position: absolute; 
            transition: all 0.3s ease-in-out; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,0.2); 
            border: 2px solid white; display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 0.6rem; font-weight: bold; 
        }
        .pawn-p1 { background: var(--p1-color); }
        .pawn-p2 { background: var(--p2-color); }
        .pawn-base { opacity: 0.4; border: 2px dashed #9ca3af; background: #e5e7eb; color: transparent; box-shadow: none; }
        
        .controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .dice { 
            width: 60px; height: 60px; background: white; border-radius: 12px; border: 2px solid var(--border); 
            display: flex; align-items: center; justify-content: center; font-size: 2rem; 
            font-weight: 700; color: var(--navy); box-shadow: var(--shadow); 
        }
        
        /* ══════════ MODALS ══════════ */
        .modal { position: fixed; inset: 0; background: rgba(13,43,78,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .modal.active { display: flex; }
        .modal-box { background: var(--surface); padding: 24px; border-radius: 20px; width: 100%; max-width: 320px; text-align: center; }
        
        /* ══════════ DARK MODE ══════════ */
        :root[data-theme="dark"] {
            --bg: #0b0e14; --surface: #151a22; --border: #222a35; --text: #f0f4f8;
            --navy: #e2e8f0; --accent: #3b6cff; --accent-light: #1e2638; --red-light: #3f0f0f;
            --shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
        :root[data-theme="dark"] body { background: var(--bg); color: var(--text); }
        :root[data-theme="dark"] .cell { background: #0f131a; }
        :root[data-theme="dark"] .cell-center { background: #422006; border-color: #854d0e; }
        :root[data-theme="dark"] .dice { background: #1e2638; color: var(--text); }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="index.html" class="logo-small">66<span>Notes</span></a>
        <div class="brand-badge">Ludo</div>
        <div style="width: 32px;"></div>
    </div>

    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
        <h1 class="title">Select Ludo Mode</h1>
        
        <button class="btn btn-primary" onclick="startMode('ai')">
            <i class="fas fa-robot"></i> Solo vs AI
        </button>
        <button class="btn btn-outline" onclick="showScreen('split-screen')">
            <i class="fas fa-mobile-screen"></i> 1v1 Split-screen
        </button>
        <button class="btn btn-outline" onclick="showOnlineSetup()">
            <i class="fas fa-globe"></i> 1v1 Online
        </button>
        <button class="btn" onclick="window.location.href='index.html'" style="background: transparent; color: var(--text-secondary); margin-top: 20px;">
            <i class="fas fa-arrow-left"></i> Back to Hub
        </button>
    </div>

    <!-- Split Setup Screen -->
    <div id="split-screen" class="screen">
        <h1 class="title">Split-Screen Setup</h1>
        <p style="margin-bottom: 15px; color: var(--text-secondary); font-size: 0.9rem;">Enter Player 2's Roll Number</p>
        <input type="number" id="p2-roll" class="input-roll" placeholder="e.g. 015" />
        <button class="btn btn-primary" onclick="startSplit()">Start Game</button>
        <button class="btn" onclick="showScreen('setup-screen')" style="background: transparent; color: var(--text-secondary);">Cancel</button>
    </div>

    <!-- Online Setup Screen -->
    <div id="online-screen" class="screen">
        <h1 class="title">Online Players</h1>
        <p id="online-status" style="margin-bottom: 15px; color: var(--text-secondary); font-size: 0.9rem;">Connecting to server...</p>
        <div class="online-list" id="online-list-container">
            <!-- Players injected here -->
        </div>
        <button class="btn" onclick="showScreen('setup-screen')" style="background: transparent; color: var(--text-secondary);">Cancel</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="player-card p1-text" id="ui-p1">P1</div>
            <div class="player-card p2-text" id="ui-p2">P2</div>
        </div>

        <!-- 5x5 Mini Board -->
        <div class="board" id="board">
            <!-- Cells generated by JS -->
        </div>

        <div class="controls">
            <div class="dice" id="dice">-</div>
            <button class="btn btn-primary" id="roll-btn" onclick="handleRoll()" style="width: auto; padding: 10px 40px;">Roll Dice</button>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 10px; font-weight: 600;" id="turn-text">P1's Turn</p>
        </div>
    </div>

    <!-- Waiting Modal for Online -->
    <div class="modal" id="wait-modal">
        <div class="modal-box">
            <h2 style="margin-bottom: 10px;">Waiting...</h2>
            <p style="margin-bottom: 20px; color: var(--text-secondary);">Waiting for opponent to accept.</p>
            <button class="btn btn-outline" onclick="cancelWait()">Cancel</button>
        </div>
    </div>

    <script>
        /* ═══════════════════════════════════════════════════════════
           DATABASE (Must match index.html)
           ═══════════════════════════════════════════════════════════ */
        const STUDENTS = { '002': 'Orin', '004': 'Saikat', '005': 'ASHIK', '007': 'Preonti', '009': 'Nazmul', '010': 'Sumaiya Siya', '015': 'M D Emran', '017': 'Boishakhi', '019': 'Aysha', '022': 'Iftikh', '023': 'Ryan', '024': 'Shakib', '026': 'Fahim', '027': 'Shajid', '028': 'Nafi', '029': 'Polok', '030': 'Adnan', '031': 'Sumaiya', '032': 'Mahde', '033': 'Foujia', '035': 'Risal', '036': 'Tonmoy', '039': 'Alif', '040': 'Sohan', '041': 'Shuvo', '052': 'Prapti', '064': 'Rifa', '117': 'Rafa', '125': 'Nusrat', '129': 'ABIR', '137': 'Mahin', '140': 'Meghla', '145': 'Samir', '146': 'Teetun', '147': 'Faiyaz', '153': 'Wafa', '161': 'Nafis', '164': 'Sanjana', '381': 'Moon' };
        
        // 1. Enforce Login
        const currentUser = JSON.parse(localStorage.getItem('66games_user'));
        if (!currentUser) window.location.href = 'index.html';

        // 2. Apply Theme
        let wasDark = false;
        try { wasDark = localStorage.getItem('66games_theme') === 'dark'; } catch {}
        if (wasDark) document.documentElement.setAttribute('data-theme', 'dark');

        /* ═══════════════════════════════════════════════════════════
           GAME STATE
           ═══════════════════════════════════════════════════════════ */
        let mode = ''; // 'ai', 'split', 'online'
        let p1Name = currentUser.name;
        let p2Name = '';
        let turn = 1; 
        let diceValue = 0;
        let hasRolled = false;
        
        // Grid Paths (0 to 24). Center is 12.
        // 19 steps to win (index 0 to 18).
        const p1Path = [20, 21, 22, 23, 24, 19, 14, 9, 8, 7, 6, 5, 0, 1, 2, 3, 4, 13, 12];
        const p2Path = [4, 3, 2, 1, 0, 5, 10, 15, 20, 21, 22, 23, 24, 19, 14, 9, 8, 13, 12];
        const HOME_INDEX = 18; // The index in the path array where the center is

        // Pawn positions: -1 = base, 0-18 = on path
        let p1Pawns = [-1, -1];
        let p2Pawns = [-1, -1];

        // Online Variables
        let socket = null;
        let roomName = '';
        let myOnlineId = 1; 

        /* ═══════════════════════════════════════════════════════════
           UI HELPERS
           ═══════════════════════════════════════════════════════════ */
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startMode(m) {
            mode = m;
            p2Name = (m === 'ai') ? 'Computer' : p2Name;
            initGame();
        }

        function startSplit() {
            const roll = document.getElementById('p2-roll').value.padStart(3, '0');
            let name = STUDENTS[roll];
            if (roll === '138') name = 'Aion/Maria'; 
            if (!name) return alert('Roll not found in database!');
            
            p2Name = name;
            mode = 'split';
            initGame();
        }

        /* ═══════════════════════════════════════════════════════════
           ONLINE MULTIPLAYER (Enzonic)
           ═══════════════════════════════════════════════════════════ */
        function showOnlineSetup() {
            showScreen('online-screen');
            if (socket) return; 

            // Connect to your Enzonic Server
            socket = io('https://66notes.enzonic.dev'); 

            socket.on('connect', () => {
                document.getElementById('online-status').innerText = 'Connected. Finding players...';
                socket.emit('login', { roll: currentUser.roll, name: currentUser.name });
            });

            socket.on('online-list', (players) => {
                const list = document.getElementById('online-list-container');
                list.innerHTML = '';
                const others = players.filter(p => p.id !== socket.id);
                
                if (others.length === 0) {
                    list.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--text-secondary); font-size: 0.9rem;">No other players online.</div>';
                    return;
                }

                others.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'online-item';
                    div.innerHTML = `
                        <div><strong>${p.name}</strong> <span style="font-size:0.7rem; color:var(--text-secondary);">(${p.roll})</span></div>
                        <button class="btn btn-primary btn-sm" onclick="challengePlayer('${p.id}')">Challenge</button>
                    `;
                    list.appendChild(div);
                });
            });

            socket.on('challenge-received', ({ challenger, challengerId }) => {
                if (confirm(`${challenger.name} challenged you! Accept?`)) {
                    socket.emit('accept', { challengerId });
                }
            });

            socket.on('match-started', ({ room, p1, p2 }) => {
                roomName = room;
                myOnlineId = (socket.id === p1.id) ? 1 : 2;
                p1Name = p1.name;
                p2Name = p2.name;
                mode = 'online';
                document.getElementById('wait-modal').classList.remove('active');
                initGame();
            });

            socket.on('opponent-move', (data) => {
                diceValue = data.dice;
                document.getElementById('dice').innerText = diceValue;
                if (data.roll !== undefined) {
                    if (myOnlineId === 1) p2Pawns[data.pawnIdx] = data.newPos;
                    else p1Pawns[data.pawnIdx] = data.newPos;
                    renderBoard();
                    setTimeout(nextTurn, 500);
                }
            });
        }

        function challengePlayer(targetId) {
            socket.emit('challenge', { targetId });
            document.getElementById('wait-modal').classList.add('active');
        }

        function cancelWait() {
            document.getElementById('wait-modal').classList.remove('active');
        }

        /* ═══════════════════════════════════════════════════════════
           GAME LOGIC
           ═══════════════════════════════════════════════════════════ */
        function initGame() {
            p1Pawns = [-1, -1];
            p2Pawns = [-1, -1];
            turn = 1;
            hasRolled = false;
            
            document.getElementById('ui-p1').innerText = p1Name;
            document.getElementById('ui-p2').innerText = p2Name;
            
            showScreen('game-screen');
            buildGrid();
            renderBoard();
            updateTurnUI();
        }

        function buildGrid() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                
                // Color starts
                if (i === 20) cell.classList.add('cell-start-p1');
                if (i === 4) cell.classList.add('cell-start-p2');
                
                // Center home
                if (i === 12) { 
                    cell.classList.add('cell-center'); 
                    cell.innerHTML = '🏠'; 
                }
                
                board.appendChild(cell);
            }
        }

        function renderBoard() {
            document.querySelectorAll('.pawn').forEach(p => p.remove());

            const placePawn = (gridId, colorClass, pIdx) => {
                const cell = document.getElementById(`cell-${gridId}`);
                if (!cell) return;
                const p = document.createElement('div');
                p.className = `pawn ${colorClass}`;
                // Shift pawn slightly if 2 pawns on same cell
                const offset = pIdx === 0 ? '-15%' : '15%';
                p.style.transform = `translateX(${offset})`;
                cell.appendChild(p);
            };

            // P1 Pawns
            p1Pawns.forEach((pos, idx) => {
                if (pos === -1) placePawn(20, 'pawn-p1 pawn-base', idx);
                else placePawn(p1Path[pos], 'pawn-p1', idx);
            });

            // P2 Pawns
            p2Pawns.forEach((pos, idx) => {
                if (pos === -1) placePawn(4, 'pawn-p2 pawn-base', idx);
                else placePawn(p2Path[pos], 'pawn-p2', idx);
            });
        }

        function handleRoll() {
            if (hasRolled) return;
            
            // Animate dice roll
            let count = 0;
            const anim = setInterval(() => {
                document.getElementById('dice').innerText = Math.floor(Math.random() * 6) + 1;
                count++;
                if (count > 10) {
                    clearInterval(anim);
                    finishRoll();
                }
            }, 50);
        }

        function finishRoll() {
            diceValue = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice').innerText = diceValue;
            hasRolled = true;
            
            const myPawns = turn === 1 ? p1Pawns : p2Pawns;
            let moves = [];
            
            myPawns.forEach((pos, i) => {
                if (pos === -1 && diceValue === 6) moves.push(i); // Spawn requires 6
                else if (pos >= 0 && pos < HOME_INDEX) {
                    if (pos + diceValue <= HOME_INDEX) moves.push(i); // Exact roll to finish
                }
            });

            if (moves.length === 0) {
                setTimeout(nextTurn, 1000);
            } else if (moves.length === 1) {
                setTimeout(() => executeMove(moves[0]), 400);
            } else {
                // Auto-select the pawn that is closest to home for simplicity
                setTimeout(() => executeMove(moves[moves.length - 1]), 400);
            }
        }

        function executeMove(pawnIdx) {
            const myPawns = turn === 1 ? p1Pawns : p2Pawns;
            let pos = myPawns[pawnIdx];

            if (pos === -1) {
                myPawns[pawnIdx] = 0; // Move out of base to start
            } else {
                myPawns[pawnIdx] += diceValue;
                if (myPawns[pawnIdx] > HOME_INDEX) myPawns[pawnIdx] = HOME_INDEX; 
            }

            renderBoard();
            
            // Send move to server if online
            if (mode === 'online' && ((turn === 1 && myOnlineId === 1) || (turn === 2 && myOnlineId === 2))) {
                socket.emit('move', { roomName, moveData: { dice: diceValue, pawnIdx, newPos: myPawns[pawnIdx], roll: true } });
            }

            // Check Win (both pawns at home)
            if (myPawns[0] === HOME_INDEX && myPawns[1] === HOME_INDEX) {
                setTimeout(() => {
                    alert(`${turn === 1 ? p1Name : p2Name} WINS!`);
                    window.location.href = 'index.html';
                }, 400);
                return;
            }

            setTimeout(nextTurn, 600);
        }

        function nextTurn() {
            turn = turn === 1 ? 2 : 1;
            hasRolled = false;
            updateTurnUI();

            // AI Auto-roll
            if (mode === 'ai' && turn === 2) {
                setTimeout(() => {
                    document.getElementById('roll-btn').click();
                }, 800);
            }
        }

        function updateTurnUI() {
            const p1Card = document.getElementById('ui-p1');
            const p2Card = document.getElementById('ui-p2');
            p1Card.classList.toggle('active', turn === 1);
            p2Card.classList.toggle('active', turn === 2);
            
            document.getElementById('turn-text').innerText = `${turn === 1 ? p1Name : p2Name}'s Turn`;
            
            // Disable button if it's not your turn online
            const btn = document.getElementById('roll-btn');
            if (mode === 'online' && turn !== myOnlineId) {
                btn.disabled = true;
                btn.style.opacity = '0.5';
            } else {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
