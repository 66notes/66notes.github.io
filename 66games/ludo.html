<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <title>Ludo · 66Games</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root{
            --bg: #f4f7fc; --surface: #ffffff; --border: #eef2f6; --text: #1e2a3e; --navy: #0d2b4e;
            --accent: #123cf3; --accent-light: #eef2ff; 
            --blue:#2aa8ff; --green:#049a48; --yellow:#ffdc1a; --red:#ee1c25;
            --line:#c9ccd1;
            --shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); 
            min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; 
            user-select: none; -webkit-user-select: none;
        }
        
        /* TOP BAR */
        .top-bar { 
            height: 56px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .logo-small { font-size: 1.15rem; font-weight: 700; color: var(--navy); text-decoration: none; }
        .logo-small span { color: var(--accent); }
        .brand-badge { 
            background: linear-gradient(135deg, #f97316, #ea580c); color: white; 
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; 
        }
        
        /* SCREENS */
        .screen { max-width: 600px; margin: 0 auto; padding: 20px; display: none; flex-direction: column; align-items: center; text-align: center; min-height: calc(100vh - 56px); }
        .screen.active { display: flex; }
        .title { font-size: 1.5rem; font-weight: 700; color: var(--navy); margin-bottom: 20px; }
        
        .btn { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; 
            font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; 
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; 
            justify-content: center; gap: 10px; margin-bottom: 12px; 
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(18,60,243,0.3); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-outline { background: var(--surface); border: 2px solid var(--accent); color: var(--accent); }
        
        .input-roll { 
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--border); 
            font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 10px; 
            outline: none; font-family: 'Poppins', sans-serif; background: var(--surface); 
            color: var(--text); transition: border-color 0.2s;
        }
        .input-roll:focus { border-color: var(--accent); }
        
        /* ONLINE LIST */
        .online-list { width: 100%; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); max-height: 300px; overflow-y: auto; margin-bottom: 20px; }
        .online-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .online-item:last-child { border-bottom: none; }
        .btn-sm { padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; width: auto; margin: 0; }

        /* GAME BOARD */
        #game-screen { justify-content: flex-start; padding-top: 10px; }
        .board-wrapper{width:100%;max-width:400px;aspect-ratio:1;background:#fff;
          border:2px solid var(--line);border-radius:0;padding:0;position:relative; box-shadow: var(--shadow);}
        .board{width:100%;height:100%;display:grid;
          grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);gap:0;background:#fff}

        /* FIXED BASES */
        .base-blue, .base-green, .base-yellow, .base-red { position: relative; overflow: hidden; }
        .base-blue  {grid-area:1/1/7/7; background:var(--blue);}
        .base-green {grid-area:1/10/7/16; background:var(--green);}
        .base-yellow{grid-area:10/1/16/7; background:var(--yellow);}
        .base-red   {grid-area:10/10/16/16; background:var(--red);}

        .base-inner{position:absolute;inset:14%;background:#fff;border-radius:0;
          display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
          place-items:center;padding:12%;gap:0}

        /* PATH CELLS */
        .cell{background:#fff;position:relative;border:1px solid var(--line)}
        .cell.safe::after{content:'★';position:absolute;inset:0;display:flex;
          align-items:center;justify-content:center;font-size:.8rem;color:#555}
        .home-path-blue,.start-blue{background:var(--blue)}
        .home-path-green,.start-green{background:var(--green)}
        .home-path-yellow,.start-yellow{background:var(--yellow)}
        .home-path-red,.start-red{background:var(--red)}

        /* CENTER */
        .center-home{grid-area:7/7/10/10;position:relative;background:transparent}
        .center-home .triangle{position:absolute;inset:0;width:100%;height:100%}
        .t-top   {background:var(--green);clip-path:polygon(0 0,100% 0,50% 50%)}
        .t-right {background:var(--red);  clip-path:polygon(100% 0,100% 100%,50% 50%)}
        .t-bottom{background:var(--yellow);clip-path:polygon(0 100%,100% 100%,50% 50%)}
        .t-left  {background:var(--blue); clip-path:polygon(0 0,0 100%,50% 50%)}

        /* FIXED PAWNS */
        .pawn{position:absolute;inset:0;margin:auto;width:70%;height:70%;z-index:10;
          transition:all .3s ease-in-out;background:none;border:none;box-shadow:none}
        .pawn::before{ /* ring */
          content:'';position:absolute;left:10%;right:10%;bottom:0;height:45%;
          border-radius:50%;border:3px solid #7a1f1f;background:var(--pawn-color)}
        .pawn::after{ /* pin */
          content:'';position:absolute;left:18%;top:-30%;width:64%;aspect-ratio:1;
          background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--pawn-color) 13% 55%,#222 100%);
          border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
          box-shadow:0 3px 5px rgba(0,0,0,.45)}
        .pawn-p1{--pawn-color:var(--red)}
        .pawn-p2{--pawn-color:var(--blue)}
        
        /* Lock base pawns into the grid so they don't stack */
        .pawn-base {
            position: relative !important;
            inset: auto !important;
            margin: 0 !important;
            width: 80% !important;
            height: 80% !important;
        }
        
        .pawn-selectable{animation:pulse 1s infinite;cursor:pointer}
        @keyframes pulse{50%{transform:scale(1.15)}}

        /* PLAYER INFO & DICE */
        .player-info-row { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            width: 100%; max-width: 400px; margin-top: 15px; padding: 0 10px;
        }
        .player-side { display: flex; flex-direction: column; align-items: center; width: 45%; gap: 5px; }
        .p-name { font-weight: 700; font-size: 1rem; color: var(--text); margin-bottom: 5px; }
        .p1-text { color: var(--red); }
        .p2-text { color: var(--blue); }

        .dice-container { width: 60px; height: 60px; perspective: 600px; cursor: pointer; transition: opacity 0.3s; }
        .dice-container.disabled { opacity: 0.3; pointer-events: none; }
        .dice-cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s ease-out; transform: translateZ(-30px); }
        .dice-face {
            position: absolute; width: 60px; height: 60px; background: white; border-radius: 8px;
            border: 2px solid #e2e8f0; box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 6px;
        }
        .dot { background: #1e293b; border-radius: 50%; width: 100%; height: 100%; }
        
        .f1 .dot { grid-area: 2 / 2; }
        .f2 .dot:nth-child(1) { grid-area: 1 / 1; } .f2 .dot:nth-child(2) { grid-area: 3 / 3; }
        .f3 .dot:nth-child(1) { grid-area: 1 / 1; } .f3 .dot:nth-child(2) { grid-area: 2 / 2; } .f3 .dot:nth-child(3) { grid-area: 3 / 3; }
        .f4 .dot:nth-child(1) { grid-area: 1 / 1; } .f4 .dot:nth-child(2) { grid-area: 1 / 3; } .f4 .dot:nth-child(3) { grid-area: 3 / 1; } .f4 .dot:nth-child(4) { grid-area: 3 / 3; }
        .f5 .dot:nth-child(1) { grid-area: 1 / 1; } .f5 .dot:nth-child(2) { grid-area: 1 / 3; } .f5 .dot:nth-child(3) { grid-area: 2 / 2; } .f5 .dot:nth-child(4) { grid-area: 3 / 1; } .f5 .dot:nth-child(5) { grid-area: 3 / 3; }
        .f6 .dot:nth-child(1) { grid-area: 1 / 1; } .f6 .dot:nth-child(2) { grid-area: 1 / 3; } .f6 .dot:nth-child(3) { grid-area: 2 / 1; } .f6 .dot:nth-child(4) { grid-area: 2 / 3; } .f6 .dot:nth-child(5) { grid-area: 3 / 1; } .f6 .dot:nth-child(6) { grid-area: 3 / 3; }

        .f1 { transform: rotateY(0deg) translateZ(30px); }
        .f6 { transform: rotateY(180deg) translateZ(30px); }
        .f3 { transform: rotateY(90deg) translateZ(30px); }
        .f4 { transform: rotateY(-90deg) translateZ(30px); }
        .f5 { transform: rotateX(90deg) translateZ(30px); }
        .f2 { transform: rotateX(-90deg) translateZ(30px); }

        /* TRACKERS */
        .trackers-row { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-top: 15px; padding: 0 15px; }
        .tracker-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 6px 12px; font-size: 0.85rem; font-weight: 600; display: flex; gap: 10px; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tracker-box i { font-size: 1rem; }
        .t-red i { color: var(--red); }
        .t-blue i { color: var(--blue); }
        .t-gold i { color: #fbbf24; }

        .status-text { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); text-align: center; margin-top: 15px; }
        
        /* WIN OVERLAY */
        .win-overlay {
            position: fixed; inset: 0; background: rgba(13,43,78,0.95); z-index: 1000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; padding: 20px;
        }
        .win-overlay.active { display: flex; }
        .win-crown { font-size: 5rem; color: #fbbf24; animation: bounce 1s infinite alternate; margin-bottom: 20px; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
        
        .modal { position: fixed; inset: 0; background: rgba(13,43,78,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .modal.active { display: flex; }
        .modal-box { background: var(--surface); padding: 24px; border-radius: 20px; width: 100%; max-width: 320px; text-align: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="logo-small">66<span>Notes</span></a>
        <div class="brand-badge">Ludo</div>
        <div style="width: 32px;"></div>
    </div>

    <div id="setup-screen" class="screen active">
        <h1 class="title">Select Ludo Mode</h1>
        <button class="btn btn-primary" onclick="startMode('ai')"><i class="fas fa-robot"></i> Solo vs AI</button>
        <button class="btn btn-outline" onclick="showScreen('split-screen')"><i class="fas fa-mobile-screen"></i> 1v1 Split-screen</button>
        <button class="btn btn-outline" onclick="showOnlineSetup()"><i class="fas fa-globe"></i> 1v1 Online</button>
        <button class="btn" onclick="window.location.href='index.html'" style="background: transparent; color: var(--text-secondary); margin-top: 20px;"><i class="fas fa-arrow-left"></i> Back to Hub</button>
    </div>

    <div id="split-screen" class="screen">
        <h1 class="title">Split-Screen Setup</h1>
        <p style="margin-bottom: 15px; color: var(--text-secondary);">Enter Player 2's Roll Number</p>
        <input type="number" id="p2-roll" class="input-roll" placeholder="e.g. 015" />
        <button class="btn btn-primary" onclick="startSplit()">Start Game</button>
        <button class="btn" onclick="showScreen('setup-screen')" style="background: transparent; color: var(--text-secondary);">Cancel</button>
    </div>

    <div id="online-screen" class="screen">
        <h1 class="title">Online Players</h1>
        <p id="online-status" style="margin-bottom: 15px; color: var(--text-secondary); font-weight: 500;">Connecting...</p>
        <div class="online-list" id="online-list-container"></div>
        <button class="btn" onclick="showScreen('setup-screen')" style="background: transparent; color: var(--text-secondary);">Cancel</button>
    </div>

    <div id="game-screen" class="screen">
        
        <!-- BOARD HTML -->
        <div class="board-wrapper">
            <div class="board" id="board">
              <div class="base-blue"><div class="base-inner" id="base-p2"></div></div>
              <div class="base-green"><div class="base-inner"></div></div>
              <div class="base-yellow"><div class="base-inner"></div></div>
              <div class="base-red"><div class="base-inner" id="base-p1"></div></div>
              <div class="center-home">
                 <div class="triangle t-top"></div><div class="triangle t-right"></div>
                 <div class="triangle t-bottom"></div><div class="triangle t-left"></div>
              </div>
            </div>
        </div>

        <div class="player-info-row">
            <div class="player-side">
                <span class="p-name p1-text" id="ui-p1">Opponent</span>
                <div class="dice-container disabled" id="dice-wrap-1" onclick="handleDiceClick(1)">
                    <div class="dice-cube" id="dice-cube-1">
                        <div class="dice-face f1"><div class="dot"></div></div>
                        <div class="dice-face f2"><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face f3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face f4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face f5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face f6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                </div>
            </div>
            
            <div class="player-side">
                <span class="p-name p2-text" id="ui-p2">My Name</span>
                <div class="dice-container" id="dice-wrap-2" onclick="handleDiceClick(2)">
                    <div class="dice-cube" id="dice-cube-2">
                        <div class="dice-face f1"><div class="dot"></div></div>
                        <div class="dice-face f2"><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face f3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face f4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face f5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face f6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="trackers-row">
            <div class="tracker-box t-red">
                <span><i class="fas fa-chess-pawn"></i> <span id="track-p1-play">0</span>/2</span>
                <span class="t-gold"><i class="fas fa-crown"></i> <span id="track-p1-home">0</span>/2</span>
            </div>
            <div class="tracker-box t-blue">
                <span><i class="fas fa-chess-pawn"></i> <span id="track-p2-play">0</span>/2</span>
                <span class="t-gold"><i class="fas fa-crown"></i> <span id="track-p2-home">0</span>/2</span>
            </div>
        </div>
        
        <p class="status-text" id="turn-text">Waiting to start...</p>
    </div>

    <div class="win-overlay" id="win-overlay">
        <i class="fas fa-crown win-crown"></i>
        <h1 style="font-size: 2rem; margin-bottom: 10px;" id="win-text">Player Wins!</h1>
        <p style="color: #cbd5e1;">Returning to dashboard...</p>
    </div>

    <div class="modal" id="wait-modal">
        <div class="modal-box">
            <h2 style="margin-bottom: 10px;">Waiting...</h2>
            <p style="margin-bottom: 20px; color: var(--text-secondary);">Waiting for opponent to accept.</p>
            <button class="btn btn-outline" onclick="document.getElementById('wait-modal').classList.remove('active')">Cancel</button>
        </div>
    </div>

    <script>
        const STUDENTS = { '002': 'Orin', '004': 'Saikat', '005': 'ASHIK', '007': 'Preonti', '009': 'Nazmul', '010': 'Sumaiya Siya', '015': 'M D Emran', '017': 'Boishakhi', '019': 'Aysha', '022': 'Iftikh', '023': 'Ryan', '024': 'Shakib', '026': 'Fahim', '027': 'Shajid', '028': 'Nafi', '029': 'Polok', '030': 'Adnan', '031': 'Sumaiya', '032': 'Mahde', '033': 'Foujia', '035': 'Risal', '036': 'Tonmoy', '039': 'Alif', '040': 'Sohan', '041': 'Shuvo', '052': 'Prapti', '064': 'Rifa', '117': 'Rafa', '125': 'Nusrat', '129': 'ABIR', '137': 'Mahin', '140': 'Meghla', '145': 'Samir', '146': 'Teetun', '147': 'Faiyaz', '153': 'Wafa', '161': 'Nafis', '164': 'Sanjana', '381': 'Moon' };
        
        const currentUser = JSON.parse(localStorage.getItem('66games_user'));
        if (!currentUser) window.location.href = 'index.html';

        let mode = ''; let p1Name = currentUser.name; let p2Name = '';
        let turn = 1; let isRolling = false; let hasRolled = false; let isSelecting = false;
        
        const LOOP = [
            {r:6,c:1},{r:6,c:2},{r:6,c:3},{r:6,c:4},{r:6,c:5},
            {r:5,c:6},{r:4,c:6},{r:3,c:6},{r:2,c:6},{r:1,c:6},{r:0,c:6},
            {r:0,c:7},{r:0,c:8},
            {r:1,c:8},{r:2,c:8},{r:3,c:8},{r:4,c:8},{r:5,c:8},
            {r:6,c:9},{r:6,c:10},{r:6,c:11},{r:6,c:12},{r:6,c:13},{r:6,c:14},
            {r:7,c:14},{r:8,c:14},
            {r:8,c:13},{r:8,c:12},{r:8,c:11},{r:8,c:10},{r:8,c:9},
            {r:9,c:8},{r:10,c:8},{r:11,c:8},{r:12,c:8},{r:13,c:8},{r:14,c:8},
            {r:14,c:7},{r:14,c:6},
            {r:13,c:6},{r:12,c:6},{r:11,c:6},{r:10,c:6},{r:9,c:6},
            {r:8,c:5},{r:8,c:4},{r:8,c:3},{r:8,c:2},{r:8,c:1},{r:8,c:0},
            {r:7,c:0},{r:6,c:0}
        ];

        const RED_HOME = [{r:7,c:13},{r:7,c:12},{r:7,c:11},{r:7,c:10},{r:7,c:9},{r:7,c:8},{r:7,c:7}];
        const BLUE_HOME = [{r:7,c:1},{r:7,c:2},{r:7,c:3},{r:7,c:4},{r:7,c:5},{r:7,c:6},{r:7,c:7}];

        const P1_PATH = [...LOOP.slice(26), ...LOOP.slice(0, 26), ...RED_HOME]; 
        const P2_PATH = [...LOOP, ...BLUE_HOME];
        const HOME_INDEX = 58;
        const SAFE_SPOTS = [0, 8, 13, 21, 26, 34, 39, 47];

        let p1Pawns = [-1, -1];
        let p2Pawns = [-1, -1];
        let socket = null, roomName = '', myOnlineId = 1;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startMode(m) {
            mode = m; p2Name = (m === 'ai') ? 'Computer' : p2Name; initGame();
        }

        function startSplit() {
            const roll = document.getElementById('p2-roll').value.padStart(3, '0');
            let name = STUDENTS[roll];
            if (roll === '138') name = 'Aion/Maria'; 
            if (!name) return alert('Roll not found!');
            p2Name = name; mode = 'split'; initGame();
        }

        /* ONLINE MULTIPLAYER */
        function showOnlineSetup() {
            showScreen('online-screen');
            const statusTxt = document.getElementById('online-status');
            
            if (socket && socket.connected) return;

            statusTxt.innerHTML = 'Connecting...';

            // Connect to Enzonic Subdomain
            socket = io('https://66notes-game.enzonic.dev', {
                transports: ['websocket', 'polling'], 
                secure: true,
                reconnection: true,
                reconnectionAttempts: 3
            }); 

            socket.on('connect', () => {
                statusTxt.innerHTML = 'Connected. Finding players...';
                socket.emit('login', { roll: currentUser.roll, name: currentUser.name });
            });

            socket.on('connect_error', (err) => {
                statusTxt.innerHTML = `<span style="color:red"><i class="fas fa-exclamation-triangle"></i> Connection failed.</span><br>
                <span style="font-size:0.75rem; color:var(--text-secondary)">Ensure Enzonic is Running.</span><br>
                <button onclick="retryConnection()" class="btn btn-primary" style="margin-top:10px; width:auto; padding:6px 20px; font-size:0.8rem;">Reconnect</button>`;
            });

            socket.on('online-list', (players) => {
                const list = document.getElementById('online-list-container');
                list.innerHTML = '';
                const others = players.filter(p => p.id !== socket.id);
                if (!others.length) return list.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--text-secondary); font-size: 0.9rem;">No other players online.</div>';
                
                others.forEach(p => {
                    const div = document.createElement('div'); div.className = 'online-item';
                    div.innerHTML = `<div><strong>${p.name}</strong> <span style="font-size:0.7rem; color:var(--text-secondary);">(${p.roll})</span></div><button class="btn btn-primary btn-sm" onclick="challengePlayer('${p.id}')">Challenge</button>`;
                    list.appendChild(div);
                });
            });

            socket.on('challenge-received', ({ challenger, challengerId }) => {
                if (confirm(`${challenger.name} challenged you! Accept?`)) socket.emit('accept', { challengerId });
            });

            socket.on('match-started', ({ room, p1, p2 }) => {
                roomName = room; myOnlineId = (socket.id === p1.id) ? 1 : 2;
                p1Name = p1.name; p2Name = p2.name;
                mode = 'online';
                document.getElementById('wait-modal').classList.remove('active');
                initGame();
            });

            socket.on('opponent-move', (data) => {
                if (myOnlineId === 1) p2Pawns = data.pawns; else p1Pawns = data.pawns;
                renderBoard();
                
                if (data.extraTurn) {
                    hasRolled = false;
                    updateTurnUI();
                } else {
                    setTimeout(nextTurn, 300);
                }
            });
        }

        function retryConnection() {
            if(socket) socket.disconnect();
            socket = null;
            showOnlineSetup();
        }

        function challengePlayer(targetId) {
            socket.emit('challenge', { targetId });
            document.getElementById('wait-modal').classList.add('active');
        }

        function initGame() {
            p1Pawns = [-1, -1]; p2Pawns = [-1, -1];
            turn = 1; hasRolled = false; isRolling = false; isSelecting = false;
            
            document.getElementById('ui-p1').innerText = p1Name;
            document.getElementById('ui-p2').innerText = p2Name;
            
            showScreen('game-screen');
            buildGrid();
            updateTurnUI();
        }

        function buildGrid() {
            const board = document.getElementById('board');
            document.querySelectorAll('.cell').forEach(c => c.remove());
            
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if (r < 6 && c < 6) continue;
                    if (r < 6 && c > 8) continue;
                    if (r > 8 && c < 6) continue;
                    if (r > 8 && c > 8) continue;
                    if (r >= 6 && r <= 8 && c >= 6 && c <= 8) continue;

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    cell.style.gridArea = `${r+1} / ${c+1}`;

                    if (r === 6 && c === 1) cell.classList.add('start-blue');
                    if (r === 7 && c > 0 && c < 7) cell.classList.add('home-path-blue');
                    
                    if (r === 8 && c === 13) cell.classList.add('start-red');
                    if (r === 7 && c > 7 && c < 14) cell.classList.add('home-path-red');
                    
                    if ((r === 8 && c === 2) || (r === 6 && c === 12) || (r === 13 && c === 6) || (r === 1 && c === 8)) {
                        cell.classList.add('safe');
                    }
                    board.appendChild(cell);
                }
            }
            renderBoard();
        }

        function renderBoard() {
            document.querySelectorAll('.pawn').forEach(p => p.remove());
            document.querySelectorAll('.base-inner').forEach(b => b.innerHTML = '');

            const placePawn = (pathIndex, colorClass, pIdx) => {
                const p = document.createElement('div');
                p.className = `pawn ${colorClass}`;
                p.id = `pawn-${colorClass.includes('p1') ? 'p1' : 'p2'}-${pIdx}`;
                
                if (pathIndex === -1) {
                    p.classList.add('pawn-base');
                    const baseId = colorClass.includes('p1') ? 'base-p1' : 'base-p2';
                    const baseInner = document.getElementById(baseId);
                    baseInner.appendChild(p);
                    return;
                }

                const path = colorClass.includes('p1') ? P1_PATH : P2_PATH;
                const {r, c} = path[pathIndex];
                const cell = document.getElementById(`cell-${r}-${c}`);
                
                if (cell) {
                    const otherPawn = cell.querySelector('.pawn');
                    if (otherPawn) {
                        p.style.transform = 'translate(20%, 20%) scale(0.7)';
                        otherPawn.style.transform = 'translate(-20%, -20%) scale(0.7)';
                    } else if (pathIndex === HOME_INDEX) {
                         p.style.transform = 'scale(0.6)';
                         p.style.top = pIdx === 0 ? '5%' : '35%';
                    }
                    cell.appendChild(p);
                }
            };

            p1Pawns.forEach((pos, idx) => placePawn(pos, 'pawn-p1', idx));
            p2Pawns.forEach((pos, idx) => placePawn(pos, 'pawn-p2', idx));

            const p1Out = p1Pawns.filter(p => p >= 0 && p < HOME_INDEX).length;
            const p1Home = p1Pawns.filter(p => p === HOME_INDEX).length;
            const p2Out = p2Pawns.filter(p => p >= 0 && p < HOME_INDEX).length;
            const p2Home = p2Pawns.filter(p => p === HOME_INDEX).length;

            document.getElementById('track-p1-play').innerText = p1Out;
            document.getElementById('track-p1-home').innerText = p1Home;
            document.getElementById('track-p2-play').innerText = p2Out;
            document.getElementById('track-p2-home').innerText = p2Home;
        }

        let currentX1 = 0, currentY1 = 0;
        let currentX2 = 0, currentY2 = 0;

        function handleDiceClick(player) {
            if (isRolling || hasRolled || isSelecting) return;
            
            if (mode === 'online') {
                if (myOnlineId === 1 && player === 2) return;
                if (myOnlineId === 2 && player === 1) return;
            } else {
                if (turn === 1 && player === 2) return;
                if (turn === 2 && player === 1) return;
            }
            
            isRolling = true;
            const diceValue = Math.floor(Math.random() * 6) + 1;
            
            const cubeId = player === 1 ? 'dice-cube-1' : 'dice-cube-2';
            const cube = document.getElementById(cubeId);
            
            const faceMap = {
                1: {x: 0, y: 0}, 2: {x: 90, y: 0}, 3: {x: 0, y: -90},
                4: {x: 0, y: 90}, 5: {x: -90, y: 0}, 6: {x: 0, y: 180}
            };
            
            const spins = 4 + Math.floor(Math.random() * 3);
            if (player === 1) {
                currentX1 = spins * 360 + faceMap[diceValue].x;
                currentY1 = spins * 360 + faceMap[diceValue].y;
                cube.style.transform = `rotateX(${currentX1}deg) rotateY(${currentY1}deg)`;
            } else {
                currentX2 = spins * 360 + faceMap[diceValue].x;
                currentY2 = spins * 360 + faceMap[diceValue].y;
                cube.style.transform = `rotateX(${currentX2}deg) rotateY(${currentY2}deg)`;
            }

            setTimeout(() => {
                isRolling = false;
                hasRolled = true;
                processMove(diceValue);
            }, 800);
        }

        function processMove(dice) {
            const myPawns = turn === 1 ? p1Pawns : p2Pawns;
            let validMoves = [];

            myPawns.forEach((pos, i) => {
                if (pos === -1 && dice === 6) {
                    validMoves.push(i);
                } else if (pos >= 0 && pos < HOME_INDEX) {
                    if (pos + dice <= HOME_INDEX) {
                        validMoves.push(i);
                    }
                }
            });

            if (validMoves.length === 0) {
                if (mode === 'online') socket.emit('move', { roomName, moveData: { pawns: myPawns, extraTurn: false } });
                setTimeout(nextTurn, 600);
            } else if (validMoves.length === 1) {
                setTimeout(() => executeMove(validMoves[0], dice), 300);
            } else {
                if (mode === 'ai' && turn === 2) {
                    setTimeout(() => executeMove(validMoves[validMoves.length - 1], dice), 400);
                    return;
                }
                
                isSelecting = true;
                document.getElementById('turn-text').innerText = "Select a glowing pawn to move!";
                
                validMoves.forEach(idx => {
                    const p = document.getElementById(`pawn-${turn === 1 ? 'p1' : 'p2'}-${idx}`);
                    if(p) {
                        p.classList.add('pawn-selectable');
                        p.onclick = () => {
                            document.querySelectorAll('.pawn-selectable').forEach(el => {
                                el.classList.remove('pawn-selectable');
                                el.onclick = null;
                            });
                            isSelecting = false;
                            executeMove(idx, dice);
                        };
                    }
                });
            }
        }

        function executeMove(pawnIdx, dice) {
            const myPawns = turn === 1 ? p1Pawns : p2Pawns;
            const oppPawns = turn === 1 ? p2Pawns : p1Pawns;
            const myPath = turn === 1 ? P1_PATH : P2_PATH;
            const oppPath = turn === 1 ? P2_PATH : P1_PATH;

            let pos = myPawns[pawnIdx];
            myPawns[pawnIdx] = (pos === -1) ? 0 : pos + dice;

            let hitOpponent = false;
            if (myPawns[pawnIdx] < HOME_INDEX && !SAFE_SPOTS.includes(myPawns[pawnIdx])) {
                const currentCoord = myPath[myPawns[pawnIdx]];
                oppPawns.forEach((oppPos, i) => {
                    if (oppPos >= 0 && oppPos < HOME_INDEX) {
                        const oppCoord = oppPath[oppPos];
                        if (currentCoord.r === oppCoord.r && currentCoord.c === oppCoord.c) {
                            oppPawns[i] = -1;
                            hitOpponent = true;
                        }
                    }
                });
            }

            renderBoard();

            if (myPawns[0] === HOME_INDEX && myPawns[1] === HOME_INDEX) {
                triggerWin(turn === 1 ? p1Name : p2Name);
                return;
            }

            const extraTurn = (dice === 6 || hitOpponent);

            if (mode === 'online') {
                socket.emit('move', { roomName, moveData: { pawns: myPawns, extraTurn } });
            }

            if (extraTurn) {
                hasRolled = false;
                updateTurnUI();
            } else {
                setTimeout(nextTurn, 600);
            }
        }

        function nextTurn() {
            turn = turn === 1 ? 2 : 1;
            hasRolled = false;
            isSelecting = false;
            updateTurnUI();

            if (mode === 'ai' && turn === 2) {
                setTimeout(() => handleDiceClick(2), 800);
            }
        }

        function updateTurnUI() {
            document.getElementById('ui-p1').classList.toggle('active', turn === 1);
            document.getElementById('ui-p2').classList.toggle('active', turn === 2);
            
            const text = turn === 1 ? `${p1Name} is playing...` : `${p2Name} is playing...`;
            document.getElementById('turn-text').innerText = text;
            
            const wrap1 = document.getElementById('dice-wrap-1');
            const wrap2 = document.getElementById('dice-wrap-2');

            if (turn === 1) {
                wrap1.classList.remove('disabled');
                wrap2.classList.add('disabled');
            } else {
                wrap1.classList.add('disabled');
                wrap2.classList.remove('disabled');
            }

            if (mode === 'online') {
                if (myOnlineId === 1 && turn === 2) {
                    wrap1.classList.add('disabled');
                    wrap2.classList.add('disabled');
                } else if (myOnlineId === 2 && turn === 1) {
                    wrap1.classList.add('disabled');
                    wrap2.classList.add('disabled');
                }
            }
        }

        function triggerWin(winnerName) {
            document.getElementById('win-text').innerText = `${winnerName} Won the Match!`;
            document.getElementById('win-overlay').classList.add('active');
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3500);
        }
    </script>
</body>
</html>
