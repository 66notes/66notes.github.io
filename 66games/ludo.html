<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <title>Ludo · 66Games</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root{
            --bg: #f4f7fc; --surface: #ffffff; --border: #eef2f6; --text: #1e2a3e; --navy: #0d2b4e;
            --accent: #123cf3; --accent-light: #eef2ff; 
            --blue:#2aa8ff; --green:#049a48; --yellow:#ffdc1a; --red:#ee1c25;
            --line:#aab2bd;
            --shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden]{display:none!important}
        body { 
            font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); 
            min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        
        /* TOP BAR */
        .top-bar { 
            height: 56px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .logo-small { font-size: 1.15rem; font-weight: 700; color: var(--navy); text-decoration: none; }
        .logo-small span { color: var(--accent); }
        .brand-badge { 
            background: linear-gradient(135deg, #f97316, #ea580c); color: white; 
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; 
        }
        
        /* SCREENS */
        .screen { max-width: 600px; margin: 0 auto; padding: 20px; display: none; flex-direction: column; align-items: center; text-align: center; min-height: calc(100vh - 56px); }
        .screen.active { display: flex; }
        .title { font-size: 1.5rem; font-weight: 700; color: var(--navy); margin-bottom: 20px; }
        
        .btn { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; 
            font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; 
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; 
            justify-content: center; gap: 10px; margin-bottom: 12px; 
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(18,60,243,0.3); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-outline { background: var(--surface); border: 2px solid var(--accent); color: var(--accent); }
        
        .input-roll { 
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--border); 
            font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 10px; 
            outline: none; font-family: 'Poppins', sans-serif; background: var(--surface); 
            color: var(--text); transition: border-color 0.2s;
        }
        .input-roll:focus { border-color: var(--accent); }

        /* GAME: face to face, or side by side (left and right boxes under the board) */
        #game-screen{--b:min(calc(100vw - 16px),calc(100vh - 258px),460px);max-width:none;min-height:100vh;padding:8px;justify-content:center;align-content:center;justify-items:center;gap:8px;overflow:hidden}
        @supports (height:100dvh){#game-screen{--b:min(calc(100vw - 16px),calc(100dvh - 258px),460px);min-height:100dvh}}
        #game-screen.active{display:grid}
        #game-screen.face{grid-template-columns:100%;grid-template-areas:"top" "board" "bottom" "controls"}
        #game-screen.side{--b:min(calc(100vw - 16px),calc(100vh - 252px),460px);grid-template-columns:repeat(2,calc(max(var(--b),304px)/2 - 4px));column-gap:8px;grid-template-areas:"board board" "left right" "controls controls"}
        @supports (height:100dvh){#game-screen.side{--b:min(calc(100vw - 16px),calc(100dvh - 252px),460px)}}
        .board-wrapper{grid-area:board;width:var(--b);min-width:260px;aspect-ratio:1;background:#fff;
          border:2px solid var(--navy);position:relative;box-shadow:var(--shadow);transition:transform .7s cubic-bezier(.45,0,.25,1)}
        .board-wrapper.turning{animation:dip .7s ease-in-out}
        @keyframes dip{50%{scale:.74}}
        .board-wrapper.shake{animation:shake .4s}
        @keyframes shake{25%,75%{translate:-5px 2px}50%{translate:5px -2px}}
        .board{position:absolute;inset:0;display:grid;
          grid-template-columns:repeat(15,minmax(0,1fr));grid-template-rows:repeat(15,minmax(0,1fr));background:#fff}

        /* FIXED BASES */
        .base-blue, .base-green, .base-yellow, .base-red { position: relative; border: 1px solid var(--line); }
        .base-blue  {grid-area:1/1/7/7; background:var(--blue); --base:var(--blue)}
        .base-green {grid-area:1/10/7/16; background:var(--green); --base:var(--green)}
        .base-yellow{grid-area:10/1/16/7; background:var(--yellow); --base:var(--yellow)}
        .base-red   {grid-area:10/10/16/16; background:var(--red); --base:var(--red)}

        .base-inner{position:absolute;inset:14%;background:#fff;border-radius:14%;
          display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
          place-items:center;padding:6%}
        /* two pawn spots in every base, placed diagonally */
        .slot{width:82%;aspect-ratio:1;border-radius:50%;background:var(--base);position:relative;
          display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 5px rgba(0,0,0,.25)}
        .slot:first-child{grid-area:1/1}
        .slot:last-child{grid-area:2/2}

        /* PATH CELLS */
        .cell{background:#fff;position:relative;border:.5px solid var(--line)}
        .cell.safe::after{rotate:var(--unturn,0deg);content:'★';position:absolute;inset:0;display:flex;
          align-items:center;justify-content:center;font-size:.85rem;line-height:1;color:#64748b}
        .cell.safe[class*="start-"]::after{color:#fff}
        .home-path-blue,.start-blue{background:var(--blue)}
        .home-path-green,.start-green{background:var(--green)}
        .home-path-yellow,.start-yellow{background:var(--yellow)}
        .home-path-red,.start-red{background:var(--red)}

        /* CENTER */
        .center-home{grid-area:7/7/10/10;position:relative;background:#fff;border:1px solid var(--line)}
        .center-home .triangle{position:absolute;inset:0;width:100%;height:100%}
        .t-top   {background:var(--green);clip-path:polygon(0 0,100% 0,50% 50%)}
        .t-right {background:var(--red);  clip-path:polygon(100% 0,100% 100%,50% 50%)}
        .t-bottom{background:var(--yellow);clip-path:polygon(0 100%,100% 100%,50% 50%)}
        .t-left  {background:var(--blue); clip-path:polygon(0 0,0 100%,50% 50%)}

        /* PAWNS: a map-pin token with a soft shadow, outlined so it shows on any colour */
        .pawn{position:absolute;inset:0;margin:auto;width:76%;height:76%;z-index:10;background:none;border:none;transition:rotate .7s}
        .pawn.hop{animation:hop .19s ease-out;z-index:30}
        @keyframes hop{50%{scale:1.55}}
        .pawn.ghost{position:fixed;margin:0;inset:auto;z-index:600;pointer-events:none}
        .pawn::before{ /* shadow */
          content:'';position:absolute;left:18%;right:18%;bottom:-4%;height:24%;
          border-radius:50%;background:rgba(0,0,0,.35)}
        .pawn::after{ /* pin */
          content:'';position:absolute;left:9%;top:-8%;width:82%;aspect-ratio:1;
          background:radial-gradient(circle,#fff 0 20%,var(--pawn-color) 24% 100%);
          border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
          box-shadow:0 0 0 1.5px var(--navy)}
        .pawn-p1{--pawn-color:var(--red)}
        .pawn-p2{--pawn-color:var(--blue)}
        
        /* pawns resting in their base */
        .pawn-base{position:relative;inset:auto;margin:0;width:72%;height:72%}

        .pawn-selectable{animation:pulse .8s infinite;cursor:pointer;z-index:20}
        .pawn-selectable::after{box-shadow:0 0 0 2px var(--navy),0 0 7px 5px #fff}
        @keyframes pulse{50%{scale:1.25}}

        /* PLAYER BOXES & DICE */
        .panel{width:max(var(--b),304px);background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:5px 12px;height:84px;
          display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name dice" "track dice" "msg dice";align-items:center;justify-items:start;column-gap:12px;transition:border-color .25s,background-color .25s}
        .side .panel{width:100%;height:auto;grid-template-columns:100%;grid-template-areas:"name" "dice" "track" "msg";justify-items:center;text-align:center;row-gap:3px;padding:4px 6px}
        .panel.turn{border-color:var(--c);background:var(--accent-light);animation:glow 1.2s ease-in-out infinite}
        @keyframes glow{50%{border-color:var(--border)}}
        .panel.rot{transform:rotate(180deg)}
        .p-name{grid-area:name;font-weight:700;font-size:.95rem;color:var(--c);max-width:100%;white-space:nowrap;overflow:hidden;line-height:1.35;padding-top:3px}
        .msg{grid-area:msg;font-size:.66rem;font-weight:600;color:#64748b;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
        .panel.turn .msg{color:var(--c)}

        .dice-container { grid-area: dice; width: 60px; height: 60px; perspective: 600px; cursor: pointer; transition: opacity 0.3s; }
        .panel.ready .dice-container{animation:nudge 1s ease-in-out infinite}
        @keyframes nudge{50%{transform:scale(1.12)}}
        .dice-container.disabled { opacity: 0.3; pointer-events: none; }
        .dice-cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s ease-out; transform: translateZ(-30px); }
        .dice-face {
            position: absolute; width: 60px; height: 60px; background: white; border-radius: 8px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
            border: 2px solid #e2e8f0; box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 6px;
        }
        .dot { background: #1e293b; border-radius: 50%; width: 100%; height: 100%; }
        
        .f1 .dot { grid-area: 2 / 2; }
        .f2 .dot:nth-child(1) { grid-area: 1 / 1; } .f2 .dot:nth-child(2) { grid-area: 3 / 3; }
        .f3 .dot:nth-child(1) { grid-area: 1 / 1; } .f3 .dot:nth-child(2) { grid-area: 2 / 2; } .f3 .dot:nth-child(3) { grid-area: 3 / 3; }
        .f4 .dot:nth-child(1) { grid-area: 1 / 1; } .f4 .dot:nth-child(2) { grid-area: 1 / 3; } .f4 .dot:nth-child(3) { grid-area: 3 / 1; } .f4 .dot:nth-child(4) { grid-area: 3 / 3; }
        .f5 .dot:nth-child(1) { grid-area: 1 / 1; } .f5 .dot:nth-child(2) { grid-area: 1 / 3; } .f5 .dot:nth-child(3) { grid-area: 2 / 2; } .f5 .dot:nth-child(4) { grid-area: 3 / 1; } .f5 .dot:nth-child(5) { grid-area: 3 / 3; }
        .f6 .dot:nth-child(1) { grid-area: 1 / 1; } .f6 .dot:nth-child(2) { grid-area: 1 / 3; } .f6 .dot:nth-child(3) { grid-area: 2 / 1; } .f6 .dot:nth-child(4) { grid-area: 2 / 3; } .f6 .dot:nth-child(5) { grid-area: 3 / 1; } .f6 .dot:nth-child(6) { grid-area: 3 / 3; }

        .f1 { transform: rotateY(0deg) translateZ(30px); }
        .f6 { transform: rotateY(180deg) translateZ(30px); }
        .f3 { transform: rotateY(90deg) translateZ(30px); }
        .f4 { transform: rotateY(-90deg) translateZ(30px); }
        .f5 { transform: rotateX(90deg) translateZ(30px); }
        .f2 { transform: rotateX(-90deg) translateZ(30px); }

        /* TRACKERS */
        .tracker-box{grid-area:track;font-size:.72rem;font-weight:700;display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:2px 10px}
        .tracker-box span:first-child{color:var(--c)}
        .tracker-box span:last-child{color:#b45309}
        .tracker-box b.bump{display:inline-block;animation:bump .45s cubic-bezier(.2,2.2,.4,1)}
        @keyframes bump{40%{transform:scale(1.8)}}

        .controls{grid-area:controls;width:max(var(--b),304px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .ctl{height:44px;border-radius:13px;border:1px solid var(--border);background:var(--surface);color:var(--navy);font-family:'Poppins',sans-serif;font-size:.62rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
        .ctl i{font-style:normal;font-size:1.05rem;line-height:1.1;color:var(--accent)}
        .ctl.pkey{background:var(--accent);border-color:var(--accent);color:#fff}
        .ctl.pkey i{color:#fff;font-weight:700}
        .ctl:active{transform:scale(.95)}
        
        /* WIN OVERLAY */
        .win-overlay {
            position: fixed; inset: 0; background: rgba(13,43,78,0.93); z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; padding: 20px;
        }
        .win-overlay.active { display: flex; }
        .win-overlay.rot { transform: rotate(180deg); }
        .win-overlay .btn { max-width: 280px; }
        .win-crown { font-size: 5rem; line-height: 1.2; animation: bounce 1s infinite alternate; margin-bottom: 14px; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
    </style>
</head>
<body>

        <a href="index.html" class="logo-small">66<span>Notes</span></a>

        <!-- BOARD HTML -->
        <div class="board-wrapper" id="wrap">
            <div class="board" id="board">
              <div class="base-blue"><div class="base-inner" id="base-p2"></div></div>
              <div class="base-green"><div class="base-inner"></div></div>

                 <div class="triangle t-top"></div><div class="triangle t-right"></div>

        </div>

                <div class="panel" id="panel1">

            <div class="dice-container disabled" id="dice-wrap-1" onclick="handleDiceClick(1)">
                <div class="dice-cube" id="dice-cube-1">
<div class="dice-face f1"><div class="dot"></div></div>
<div class="dice-face f2"><div class="dot"></div><div class="dot"></div></div>
<div class="dice-face f3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<div class="dice-face f5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

            <span class="p-name" id="ui-p2"></span>

                <div class="dice-cube" id="dice-cube-2">
<div class="dice-face f1"><div class="dot"></div></div>
<div class="dice-face f2"><div class="dot"></div><div class="dot"></div></div>
<div class="dice-face f3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="dice-face f4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="dice-face f5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="dice-face f6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

        <div class="controls">
            <button class="ctl pkey" id="pBtn" onclick="changeView()"><i>P</i>View</button>
            <button class="ctl" onclick="askRestart()"><i>↻</i>Restart</button>
            <button class="ctl" onclick="askLeave()"><i>✕</i>Exit</button>

    <div class="win-overlay" id="win-overlay">
        <div class="win-crown" id="win-icon">👑</div>
        <h1 style="font-size: 1.8rem; margin-bottom: 18px;" id="win-text"></h1>
        <button class="btn btn-primary" onclick="newGame()">Play again</button>
        <button class="btn" onclick="window.location.href='index.html'" style="background: transparent; color: #cbd5e1;">Back to Hub</button>
    </div>

    <script src="students.js"></script>
    <script src="common.js"></script>
    <script>
        
        const $ = id => document.getElementById(id);
        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('66games_user')); } catch (e) {}
        if (!currentUser) window.location.href = 'index.html';
        const me = currentUser || { roll: '', name: 'Player' };

        const COLORS = { 1: '#e11d48', 2: '#0b78d0' };
        let mode = ''; let p1Name = me.name; let p2Name = '';
        let turn = 1; let isRolling = false; let hasRolled = false; let isSelecting = false;
        let view = 'face-bottom', angle = 0, ready = false, over = false, game = 0;
        let choices = null;               // pawns the player may tap right now
        let notes = { 1: '', 2: '' };
        
        const LOOP = [
            {r:6,c:1},{r:6,c:2},{r:6,c:3},{r:6,c:4},{r:6,c:5},
            {r:5,c:6},{r:4,c:6},{r:3,c:6},{r:2,c:6},{r:1,c:6},{r:0,c:6},
            {r:0,c:7},{r:0,c:8},
            {r:1,c:8},{r:2,c:8},{r:3,c:8},{r:4,c:8},{r:5,c:8},
            {r:6,c:9},{r:6,c:10},{r:6,c:11},{r:6,c:12},{r:6,c:13},{r:6,c:14},
            {r:7,c:14},{r:8,c:14},
            {r:8,c:13},{r:8,c:12},{r:8,c:11},{r:8,c:10},{r:8,c:9},
            {r:9,c:8},{r:10,c:8},{r:11,c:8},{r:12,c:8},{r:13,c:8},{r:14,c:8},
            {r:14,c:7},{r:14,c:6},
            {r:13,c:6},{r:12,c:6},{r:11,c:6},{r:10,c:6},{r:9,c:6},
            {r:8,c:5},{r:8,c:4},{r:8,c:3},{r:8,c:2},{r:8,c:1},{r:8,c:0},
            {r:7,c:0},{r:6,c:0}
        ];

        // each pawn walks 51 shared squares, turns into its own 5-square home lane, then reaches the centre
        const CENTRE = {r:7,c:7};
        const RED_HOME = [{r:7,c:13},{r:7,c:12},{r:7,c:11},{r:7,c:10},{r:7,c:9},CENTRE];
        const BLUE_HOME = [{r:7,c:1},{r:7,c:2},{r:7,c:3},{r:7,c:4},{r:7,c:5},CENTRE];

        const P1_PATH = [...LOOP.slice(26), ...LOOP.slice(0, 26)].slice(0, 51).concat(RED_HOME);
        const P2_PATH = LOOP.slice(0, 51).concat(BLUE_HOME);
        const HOME_INDEX = 56;
        const SAFE_SPOTS = [0, 8, 13, 21, 26, 34, 39, 47];

        let p1Pawns = [-1, -1];
        let p2Pawns = [-1, -1];

        // timers that are forgotten when the game is restarted or left
        const later = (fn, ms) => { const id = game; setTimeout(() => { if (id === game) fn(); }, ms); };
        const nameOf = p => p === 1 ? p1Name : p2Name;
        const isFace = () => G66.VIEWS[view].face;
        const seatOf = p => G66.VIEWS[view].seats[p - 1];
        // is this player's side of the screen upside down?
        const turnedAround = p => isFace() && seatOf(mode === 'ai' ? 1 : p) === 'top';
        // how far the board is turned so that each base is near its owner
        const BOARD_ANGLE = { 'face-bottom': 0, 'face-top': 180, 'side-left': 90, 'side-right': 0 };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
            $('topBar').hidden = id === 'game-screen';
        }

        async function openFriend() {
            const choice = await G66.friend(me);
            if (choice) begin('friend', choice.name, choice.view);
        }
        function startAI() { begin('ai', 'Computer', G66.saved('side-left')); }
        async function begin(kind, opponent, chosen) {
            mode = kind; p2Name = opponent; view = chosen;
            showScreen('game-screen');
            applyView(false);
            newGame(true);
            const id = game;
            await G66.intro([{ name: p1Name, color: COLORS[1] }, { name: p2Name, color: COLORS[2] }], view);
            if (id !== game) return;
            ready = true;
            updateTurnUI();
            G66.banner(`${nameOf(turn)} starts!`, { color: COLORS[turn], flip: turnedAround(turn) });
        }

        function newGame(waitForIntro) {
            game++;
            p1Pawns = [-1, -1]; p2Pawns = [-1, -1];
            turn = 1; hasRolled = false; isRolling = false; isSelecting = false; over = false;
            choices = null; notes = { 1: '', 2: '' };
            ready = waitForIntro !== true;
            document.querySelectorAll('.ghost').forEach(g => g.remove());
            $('win-overlay').classList.remove('active');
            [1, 2].forEach(p => { $('track-p' + p + '-play').textContent = ''; $('track-p' + p + '-home').textContent = ''; delete $('ui-p' + p).dataset.key; });
            buildGrid();
            updateTurnUI();
        }

        const pawnTurn = p => (turnedAround(p) ? 180 : 0) - angle;

        function applyView(animate) {
            const screen = $('game-screen'), wrap = $('wrap');
            screen.classList.toggle('face', isFace());
            screen.classList.toggle('side', !isFace());
            [1, 2].forEach(p => { $('panel' + p).style.gridArea = seatOf(p); $('panel' + p).style.setProperty('--c', COLORS[p]); });
            const change = ((BOARD_ANGLE[view] - angle) % 360 + 540) % 360 - 180;   // shortest way round
            angle += change;
            if (animate && change) { wrap.classList.remove('turning'); void wrap.offsetWidth; wrap.classList.add('turning'); }
            wrap.style.transition = animate ? '' : 'none';
            wrap.style.transform = `rotate(${angle}deg)`;
            $('board').style.setProperty('--unturn', -angle + 'deg');
            document.querySelectorAll('.pawn:not(.ghost)').forEach(el => el.style.rotate = pawnTurn(el.classList.contains('pawn-p1') ? 1 : 2) + 'deg');
        }

        async function changeView() {
            if (!ready) return;
            const chosen = await G66.pickView(p1Name, p2Name, view);
            if (!chosen) return;
            view = chosen;
            applyView(true);
            updateTurnUI();
        }
        G66.onP(() => { if ($('game-screen').classList.contains('active') && !over) changeView(); });

        function askRestart() { if (!ready) return; if (over || confirm('Restart this game?')) newGame(); }
        function askLeave() {
            if (!over && !confirm('Leave this game?')) return;
            game++; ready = false;
            document.querySelectorAll('.ghost').forEach(g => g.remove());
            $('win-overlay').classList.remove('active');
            showScreen('setup-screen');
        }

        function buildGrid() {
            const board = document.getElementById('board');
            document.querySelectorAll('.cell').forEach(c => c.remove());
            
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if (r < 6 && c < 6) continue;
                    if (r < 6 && c > 8) continue;
                    if (r > 8 && c < 6) continue;
                    if (r > 8 && c > 8) continue;
                    if (r >= 6 && r <= 8 && c >= 6 && c <= 8) continue;

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    cell.style.gridArea = `${r+1} / ${c+1}`;

                    // start squares
                    if (r === 6 && c === 1) cell.classList.add('start-blue');
                    if (r === 1 && c === 8) cell.classList.add('start-green');
                    if (r === 8 && c === 13) cell.classList.add('start-red');
                    if (r === 13 && c === 6) cell.classList.add('start-yellow');

                    // home lanes
                    if (r === 7 && c >= 1 && c <= 5) cell.classList.add('home-path-blue');
                    if (r === 7 && c >= 9 && c <= 13) cell.classList.add('home-path-red');
                    if (c === 7 && r >= 1 && r <= 5) cell.classList.add('home-path-green');
                    if (c === 7 && r >= 9 && r <= 13) cell.classList.add('home-path-yellow');

                    // safe squares (match SAFE_SPOTS)
                    if (SAFE_SPOTS.some(i => LOOP[i].r === r && LOOP[i].c === c)) cell.classList.add('safe');
                    board.appendChild(cell);
                }
            }
            renderBoard();
        }

        function setCount(id, value) {
            const el = $(id);
            if (el.textContent === String(value)) return;
            const first = el.textContent === '';
            el.textContent = value;
            if (!first) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
        }

        function renderBoard(hopping) {
            document.querySelectorAll('.pawn:not(.ghost)').forEach(p => p.remove());
            document.querySelectorAll('.base-inner').forEach(b => {
                b.innerHTML = '<div class="slot"></div><div class="slot"></div>';
            });

            const placePawn = (pathIndex, player, pIdx) => {
                const p = document.createElement('div');
                p.className = `pawn pawn-p${player}`;
                p.id = `pawn-p${player}-${pIdx}`;
                p.style.rotate = pawnTurn(player) + 'deg';
                if (hopping === p.id) p.classList.add('hop');
                if (choices && player === turn && choices.list.includes(pIdx)) {
                    p.classList.add('pawn-selectable');
                    p.onclick = () => choose(pIdx);
                }

                if (pathIndex === -1) {
                    p.classList.add('pawn-base');
                    $('base-p' + player).children[pIdx].appendChild(p);
                    return;
                }

                // pawns that reached the centre are no longer drawn
                if (pathIndex >= HOME_INDEX) return;

                const {r, c} = (player === 1 ? P1_PATH : P2_PATH)[pathIndex];
                const cell = $(`cell-${r}-${c}`);
                if (cell) cell.appendChild(p);
            };

            p1Pawns.forEach((pos, idx) => placePawn(pos, 1, idx));
            p2Pawns.forEach((pos, idx) => placePawn(pos, 2, idx));

            // pawns sharing a square sit side by side
            document.querySelectorAll('.cell').forEach(cell => {
                const group = cell.querySelectorAll('.pawn');
                if (group.length < 2) return;
                const spots = group.length === 2 ? [[-28, 0], [28, 0]] : [[-28, -18], [28, -18], [-28, 24], [28, 24]];
                group.forEach((p, i) => { p.style.transform = `translate(${spots[i][0]}%, ${spots[i][1]}%) scale(0.72)`; });
            });

            [[1, p1Pawns], [2, p2Pawns]].forEach(([p, pawns]) => {
                setCount(`track-p${p}-play`, pawns.filter(x => x >= 0 && x < HOME_INDEX).length);
                setCount(`track-p${p}-home`, pawns.filter(x => x === HOME_INDEX).length);
            });
        }

        const spin = { 1: { x: 0, y: 0 }, 2: { x: 0, y: 0 } };
        const faceMap = {
            1: {x: 0, y: 0}, 2: {x: 90, y: 0}, 3: {x: 0, y: -90},
            4: {x: 0, y: 90}, 5: {x: -90, y: 0}, 6: {x: 0, y: 180}
        };

        function handleDiceClick(player, byComputer, forced) {
            if (!ready || over || isRolling || hasRolled || isSelecting) return;
            if (mode === 'ai' && player === 2 && !byComputer) return; // only the computer rolls its dice
            if (turn !== player) return;
            
            isRolling = true;
            const diceValue = forced || Math.floor(Math.random() * 6) + 1;
            spin[player] = { x: spin[player].x + 1440, y: spin[player].y + 1080 + 360 };
            const to = faceMap[diceValue];
            $('dice-cube-' + player).style.transform = `translateZ(-30px) rotateX(${spin[player].x + to.x}deg) rotateY(${spin[player].y + to.y}deg)`;
            notes = { 1: '', 2: '' }; notes[player] = 'Rolling...';
            G66.buzz(20);
            updateTurnUI();

            later(() => {
                isRolling = false;
                hasRolled = true;
                notes[player] = 'Rolled ' + diceValue;
                updateTurnUI();
                G66.pop(diceValue === 6 ? 'SIX!' : '+' + diceValue, $('dice-wrap-' + player), { color: COLORS[player], flip: turnedAround(player) });
                processMove(diceValue);
            }, 850);
        }

        function processMove(dice) {
            const myPawns = turn === 1 ? p1Pawns : p2Pawns;
            let validMoves = [];

            myPawns.forEach((pos, i) => {
                if (pos === -1 && dice === 6) {
                    validMoves.push(i);
                } else if (pos >= 0 && pos < HOME_INDEX) {
                    validMoves.push(i); // a pawn may always move forward, even past the centre
                }
            });

            if (validMoves.length === 0) {
                notes[turn] = `Rolled ${dice} · no move`;
                updateTurnUI();
                later(nextTurn, 900);
            } else if (validMoves.length === 1) {
                later(() => executeMove(validMoves[0], dice), 350);
            } else {
                if (mode === 'ai' && turn === 2) {
                    later(() => executeMove(validMoves[validMoves.length - 1], dice), 450);
                    return;
                }
                isSelecting = true;
                choices = { list: validMoves, dice };
                notes[turn] = 'Tap a glowing pawn!';
                renderBoard();
                updateTurnUI();
            }
        }

        function choose(idx) {
            if (!choices) return;
            const { dice } = choices;
            choices = null;
            isSelecting = false;
            executeMove(idx, dice);
        }

        const centreOf = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

        // a captured pawn flies back to its base
        function flyHome(player, idx, from) {
            const target = $(`pawn-p${player}-${idx}`);
            if (!target || !target.animate) return;
            const to = target.getBoundingClientRect();
            const ghost = document.createElement('div');
            ghost.className = `pawn pawn-p${player} ghost`;
            Object.assign(ghost.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
            document.body.appendChild(ghost);
            target.style.visibility = 'hidden';
            const dx = to.left + to.width / 2 - from.left - from.width / 2, dy = to.top + to.height / 2 - from.top - from.height / 2;
            ghost.animate([
                { transform: 'translate(0,0) rotate(0deg) scale(1)' },
                { transform: `translate(${dx / 2}px,${dy / 2 - 50}px) rotate(360deg) scale(1.8)` },
                { transform: `translate(${dx}px,${dy}px) rotate(720deg) scale(1)` }
            ], { duration: 650, easing: 'ease-in-out' }).onfinish = () => { ghost.remove(); target.style.visibility = ''; };
        }

        function executeMove(pawnIdx, dice) {
            const player = turn;
            const myPawns = player === 1 ? p1Pawns : p2Pawns;
            const oppPawns = player === 1 ? p2Pawns : p1Pawns;
            const myPath = player === 1 ? P1_PATH : P2_PATH;
            const oppPath = player === 1 ? P2_PATH : P1_PATH;

            const start = myPawns[pawnIdx];
            const end = start === -1 ? 0 : Math.min(HOME_INDEX, start + dice);
            const id = `pawn-p${player}-${pawnIdx}`;
            notes[player] = 'Moving...';
            updateTurnUI();

            // hop one square at a time
            let at = start;
            (function step() {
                at++;
                myPawns[pawnIdx] = at;
                renderBoard(id);
                if (at < end) return later(step, 190);
                later(land, 200);
            })();

            function land() {
                const flip = turnedAround(player);
                const victims = [];
                if (end < HOME_INDEX && !SAFE_SPOTS.includes(end)) {
                    const here = myPath[end];
                    oppPawns.forEach((oppPos, i) => {
                        if (oppPos >= 0 && oppPos < HOME_INDEX) {
                            const there = oppPath[oppPos];
                            if (here.r === there.r && here.c === there.c) {
                                const el = $(`pawn-p${3 - player}-${i}`);
                                victims.push({ i, from: el.getBoundingClientRect() });
                                oppPawns[i] = -1;
                            }
                        }
                    });
                }
                renderBoard();

                const hit = victims.length > 0;
                if (hit) {
                    victims.forEach(v => flyHome(3 - player, v.i, v.from));
                    G66.banner('💥 CAPTURED!', { color: COLORS[player], flip });
                    G66.buzz(90);
                    const w = $('wrap'); w.classList.remove('turning', 'shake'); void w.offsetWidth; w.classList.add('shake');
                }
                if (end === HOME_INDEX) {
                    const c = centreOf($('wrap'));
                    G66.banner('👑 HOME!', { color: '#d97706', flip });
                    G66.confetti({ x: c.x, y: c.y, count: 45 });
                    G66.buzz(60);
                }

                if (myPawns[0] === HOME_INDEX && myPawns[1] === HOME_INDEX) return triggerWin(player);

                if (dice === 6 || hit) {
                    hasRolled = false;
                    notes[player] = 'Roll again!';
                    updateTurnUI();
                    if (mode === 'ai' && player === 2) later(() => handleDiceClick(2, true), 900);
                } else {
                    later(nextTurn, hit ? 900 : 500);
                }
            }
        }

        function nextTurn() {
            turn = turn === 1 ? 2 : 1;
            hasRolled = false;
            isSelecting = false;
            choices = null;
            notes = { 1: '', 2: '' };
            updateTurnUI();
            if (mode === 'friend') G66.banner(`${nameOf(turn)}'s turn`, { color: COLORS[turn], flip: turnedAround(turn) });
            if (mode === 'ai' && turn === 2) later(() => handleDiceClick(2, true), 800);
        }

        function updateTurnUI() {
            [1, 2].forEach(p => {
                const active = turn === p && !over;
                const computer = mode === 'ai' && p === 2;
                const free = active && ready && !isRolling && !hasRolled && !isSelecting;
                $('panel' + p).className = 'panel' + (active ? ' turn' : '') + (free && !computer ? ' ready' : '') + (turnedAround(p) ? ' rot' : '');
                const name = $('ui-p' + p), key = nameOf(p) + active;
                if (name.dataset.key !== key) {
                    name.dataset.key = key;
                    if (active) G66.wave(name, nameOf(p)); else name.textContent = nameOf(p);
                }
                $('msg-' + p).textContent = notes[p] || (over ? 'Game over' : !active ? 'Waiting' : computer ? 'Thinking...' : 'Tap the dice');
                $('dice-wrap-' + p).classList.toggle('disabled', !active);
            });
        }

        function triggerWin(winner) {
            over = true;
            notes = { 1: '', 2: '' }; notes[winner] = 'Winner!';
            updateTurnUI();
            later(() => {
                $('win-icon').textContent = mode === 'ai' && winner === 2 ? '🤖' : '👑';
                G66.wave($('win-text'), `${nameOf(winner)} wins!`);
                $('win-overlay').classList.toggle('rot', turnedAround(winner));
                $('win-overlay').classList.add('active');
                if (!(mode === 'ai' && winner === 2)) G66.celebrate();
            }, 900);
        }
    </script>
</body>
</html>
