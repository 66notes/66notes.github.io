<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#ffffff" />
<title>UNO · 66Games</title>
<style>
/* Low-end friendly: system fonts only, no external CSS/fonts/icon packs, no blur, no heavy shadows */
:root{
  --bg:#eef2fb;--surface:#fff;--border:#eef2f6;--border-strong:#d9dfe8;
  --text:#1e2a3e;--text2:#6b7280;--navy:#0d2b4e;--accent:#123cf3;--accent-light:#eef2ff;
  --red:#ef4444;--blue:#3b82f6;--green:#22c55e;--yellow:#eab308;--black:#1e293b;
}
:root[data-theme="dark"]{
  --bg:#0b0e14;--surface:#151a22;--border:#222a35;--border-strong:#313b4c;
  --text:#f0f4f8;--text2:#8b98a5;--navy:#e2e8f0;--accent:#3b6cff;--accent-light:#1e2638;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overscroll-behavior:none;display:flex;flex-direction:column}
button{font-family:inherit}

/* ───────── Setup ───────── */
.top-bar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo-small{font-size:1.1rem;font-weight:700;color:var(--navy);text-decoration:none}
.logo-small span{color:var(--accent)}
.brand-badge{background:var(--accent);color:#fff;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:800;letter-spacing:1px;transform:rotate(-5deg)}
.screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;overflow-y:auto}
.screen.active{display:flex}
.title{font-size:1.7rem;font-weight:800;color:var(--navy);margin-bottom:16px}
.sub{margin-bottom:10px;color:var(--text2);font-size:.9rem}
.btn{width:100%;max-width:300px;padding:13px;border-radius:12px;border:none;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{transform:scale(.97)}
.btn-outline{background:var(--surface);border:2px solid var(--accent);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-danger{background:#fef2f2;color:#dc2626;border:2px solid #fecaca}
.seg{display:flex;gap:6px;width:100%;max-width:300px;margin:6px 0 16px;background:var(--border);padding:4px;border-radius:12px}
.seg button{flex:1;padding:9px 4px;border:none;border-radius:9px;background:transparent;color:var(--text2);font-weight:700;font-size:.82rem;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--accent)}
.form-error{max-width:300px;width:100%;font-size:.8rem;font-weight:600;color:#dc2626;background:#fef2f2;border-radius:8px;padding:8px;margin-bottom:8px}
.intake-row{display:flex;gap:10px;width:100%;max-width:300px;margin-bottom:10px}
.intake-row .btn{margin:0}

/* numeric keypad (replaces the system keyboard) */
.roll-display{display:flex;gap:10px;margin-bottom:10px}
.roll-display b{width:56px;height:66px;border-radius:12px;border:2px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1.9rem;font-weight:800;color:var(--navy)}
.roll-display b.cur{border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:280px;margin-bottom:10px}
.key{height:clamp(44px,7.5vh,56px);border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--navy);font-size:1.3rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--accent-light);transform:scale(.95)}
.key.ok{background:var(--accent);color:#fff;border-color:var(--accent);font-size:1rem}
.key.del{color:#dc2626}
.keypad.busy .key{opacity:.5;pointer-events:none}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ───────── Game ───────── */
#game-screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;background:var(--bg)}
#game-screen.active{display:flex}
.g-top{flex-shrink:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 6px rgba(13,43,78,.08);position:relative;z-index:6}
.ic{display:inline-block;vertical-align:-4px;flex-shrink:0}
.pause-btn,.lay-btn{height:34px;border-radius:17px;border:none;cursor:pointer;color:#fff;font-weight:800;font-size:.78rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pause-btn{padding:0 14px;background:var(--navy);color:var(--surface)}
.lay-btn{width:34px;background:var(--accent-light);color:var(--accent);font-size:1rem}
.pause-btn:active,.lay-btn:active{transform:scale(.93)}
.timer{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;color:var(--navy)}
.timer .ic{width:26px;height:26px}
.timer.low{color:#ef4444}
.timer.low .ic{animation:tick .5s infinite alternate}
@keyframes tick{to{transform:scale(1.2)}}
.timer.low .timer-num{font-size:1.7rem;font-weight:900;color:inherit;min-width:36px;text-align:left;font-variant-numeric:tabular-nums}
.deck-info{font-size:.75rem;font-weight:700;color:var(--text2);min-width:34px;text-align:right}

.board{flex:1;min-height:0;position:relative;display:grid;background:var(--bg);--cw:clamp(52px,min(21vw,9.5vh),88px);--mh:clamp(84px,17vh,150px);--dh:clamp(58px,11vh,100px)}

/* shared card look */
.card{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.5);border-radius:10px;border:3px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.42);font-weight:900;color:#fff;position:relative;overflow:hidden;flex-shrink:0}
.card::before{content:'';position:absolute;width:120%;height:60%;background:#fff;border-radius:50%;transform:rotate(-20deg)}
.card .ct{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.c-red{background:#e5342f;color:#e5342f}.c-blue{background:#2f6fed;color:#2f6fed}
.c-green{background:#1fa65a;color:#1fa65a}.c-yellow{background:#f2b705;color:#f2b705}
.c-wild{background:#111827;color:#111827}
.c-wild .ct{font-size:calc(var(--w)*.2);text-shadow:none;font-weight:900;letter-spacing:.02em;color:#111827}
.c-wild::after{--d:calc(var(--w)*.1);content:'';position:absolute;left:calc(50% - var(--d));bottom:7%;width:var(--d);height:var(--d);background:#ef4444;box-shadow:var(--d) 0 #3b82f6,0 var(--d) #22c55e,var(--d) var(--d) #eab308}
.card-back{background:#123cf3;box-shadow:inset 0 0 0 3px #0b1220,0 3px 6px rgba(0,0,0,.28)}
.card-back::before{width:56%;height:36%;border-radius:50%;transform:none;background:#fff}
.card-back::after{content:'UNO';position:absolute;z-index:2;font-size:calc(var(--w)*.2);font-weight:900;color:#0b1220}

/* main zone */
.main-zone{position:relative;z-index:2;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
.table-card{padding:5px;border-radius:16px;box-shadow:0 0 0 4px var(--cur,transparent)}
.table-card .card{--w:calc(var(--mh)/1.5)}
.turn-plate{display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:18px;color:#fff;background:var(--pc,#123cf3);max-width:92%}
.turn-plate strong{display:flex;align-items:center;gap:6px;font-size:clamp(.9rem,2.8vh,1.2rem);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn-plate em{font-style:normal;font-size:.7rem;font-weight:700;color:#fde68a}
.switch-btn{position:absolute;right:8px;top:50%;margin-top:-26px;width:54px;height:52px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:.6rem;font-weight:800;letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.switch-btn:active{transform:scale(.92)}

/* panels */
.name-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--pc);max-width:100%}
.crown{display:none;color:#fde68a}
.pname{font-size:clamp(.9rem,3vh,1.2rem);font-weight:800;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcount{font-size:.7rem;font-weight:700;color:var(--text2);white-space:nowrap}
.panel.active .name-bar{background:var(--pc)}
.panel.active .pname,.panel.active .pcount{color:#fff}
.p-top{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.draw-pile{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.draw-pile .card{--w:calc(var(--dh)/1.5)}
.draw-pile:active .card{transform:scale(.94)}
.draw-pile span{font-size:.62rem;font-weight:800;color:var(--text2);letter-spacing:.08em}
.draw-pile.off{opacity:.4;pointer-events:none}

.p-hand{position:relative;min-height:0;overflow:hidden;background:var(--surface)}
.p-hand:not(.idle){background:color-mix(in srgb,var(--pc) 7%,var(--surface))}
.p-hand.idle{opacity:.55}
.car{position:absolute;inset:0;perspective:640px;touch-action:pan-y;cursor:grab}
.car .card{position:absolute;left:50%;top:50%;margin-left:calc(var(--w)/-2);margin-top:calc(var(--w)*-0.75);
  --sp:calc(var(--cw)*.5);--s:1;
  transform:translateX(calc(var(--o)*var(--sp))) translateY(calc(var(--a)*var(--a)*5px)) translateZ(calc(var(--a)*-50px)) rotateY(calc(var(--o)*-34deg)) rotateZ(calc(var(--o)*4deg)) scale(var(--s));
  transition:transform .25s ease,opacity .25s,filter .25s;will-change:transform;z-index:var(--z)}
.car .card.front{--s:1.3}
.car .card.far{opacity:0;pointer-events:none}
.car .card.dim{filter:grayscale(.9) brightness(1.15)}
.car .card.front.go{border-color:#fbbf24;box-shadow:0 0 0 3px #fbbf24,0 4px 8px rgba(0,0,0,.3)}
.car .card.shake{animation:shake .3s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.hand-label{display:flex;align-items:center;gap:6px;position:absolute;left:50%;top:10px;transform:translateX(-50%);pointer-events:none;background:rgba(13,43,78,.85);color:#fff;font-size:.7rem;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap;z-index:15}

.hide-btn{position:absolute;bottom:8px;z-index:20;height:44px;min-width:92px;padding:0 14px;border-radius:22px;border:2px solid var(--accent);cursor:pointer;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;font-size:.78rem;font-weight:800;letter-spacing:.04em}
.hide-btn:active{transform:scale(.9)}
.hide-btn:disabled{opacity:.3;pointer-events:none}
.hide-btn.is-hidden{background:var(--accent);color:#fff}
.hide-btn.pulse{animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.hint{position:absolute;bottom:56px;z-index:21;display:none;flex-direction:column;align-items:center;color:var(--accent);font-weight:800;font-size:.68rem;pointer-events:none;animation:bn .6s infinite alternate}
.hint.show{display:flex}
.hint b{font-size:1.5rem;line-height:1}
@keyframes bn{to{transform:translateY(8px)}}

/* ── side by side (user's sketch) ── */
.board.side{grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr}
.board.side::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border-strong);z-index:1}
.board.side .main-zone{grid-column:1/-1;grid-row:1;border-bottom:1px solid var(--border-strong)}
.board.side .panel{display:contents}
.board.side .p-top{grid-row:2;flex-direction:column;padding:8px 6px 6px}
.board.side .p-hand{grid-row:3;border-top:1px solid var(--border-strong)}
.board.side #panel-L .p-top,.board.side #panel-L .p-hand{grid-column:1}
.board.side #panel-R .p-top,.board.side #panel-R .p-hand{grid-column:2}
.board.side #panel-L .hide-btn{left:8px}.board.side #panel-L .hint{left:8px;width:92px}
.board.side #panel-R .hide-btn{right:8px}.board.side #panel-R .hint{right:8px;width:92px}

/* ── top & bottom ── */
.board.tb{grid-template-columns:1fr;grid-template-rows:1fr auto 1fr}
.board.tb #panel-L{grid-row:1;transform:rotate(180deg)}
.board.tb .main-zone{grid-row:2;flex-direction:row;gap:12px;padding-right:70px;border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong)}
.board.tb #panel-R{grid-row:3}
.board.tb .panel{display:flex;flex-direction:column;min-height:0;padding:4px 8px;gap:2px}
.board.tb .p-top{justify-content:space-between;flex-direction:row-reverse;padding:0 4px}
.board.tb .p-hand{flex:1}
.board.tb .draw-pile{flex-direction:row}
.board.tb .hide-btn{right:6px}.board.tb .hint{right:6px;width:92px}
.board.tb{--cw:clamp(46px,min(16vw,8vh),80px);--mh:clamp(70px,13vh,110px);--dh:clamp(46px,8vh,76px)}

/* flash + toast */
.flash{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.flash.go{animation:flashIn 1.2s ease-out}
.flash-in{text-align:center;color:#fff;padding:14px 34px;border-radius:26px;background:var(--c);max-width:90vw}
.flash-in small{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.7rem;font-weight:800;letter-spacing:.2em}
.flash-in b{display:block;font-size:clamp(1.5rem,7vh,2.6rem);font-weight:900;line-height:1.1}
.flash-in em{display:block;font-style:normal;font-weight:700;color:#fde68a;font-size:.85rem}
@keyframes flashIn{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1.05)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:45;background:#0d2b4e;color:#fff;padding:7px 16px;border-radius:20px;font-size:.8rem;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(13,43,78,.94);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;text-align:center;color:#fff}
.overlay.active{display:flex}
.overlay-box{background:var(--surface);color:var(--text);padding:22px 20px;border-radius:22px;width:100%;max-width:340px;max-height:96vh;overflow-y:auto}
.overlay-box.flip{transform:rotate(180deg)}
.overlay-box h2{font-size:1.25rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.overlay-box .vs{font-size:.95rem;font-weight:700;margin-bottom:14px;color:var(--text2)}
.color-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.color-btn{height:56px;border-radius:12px;border:none;cursor:pointer}
.color-btn:active{transform:scale(.95)}
.win-crown{color:#fbbf24;margin-bottom:8px}
.win-name{font-size:clamp(2rem,10vh,3.4rem);font-weight:900;line-height:1.1;color:#fff}
.win-line{font-size:1.15rem;font-weight:700;margin:8px 0 18px;color:#cbd5e1}
.win-line b{color:#fbbf24}
.win-actions{width:100%;max-width:300px}
.fly{position:fixed;margin:0;z-index:70;transform-origin:0 0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
</style>
</head>
<body>

<!-- ═════════ SETUP ═════════ -->
<div class="top-bar" id="main-top">
  <a href="index.html" class="logo-small">66<span>Notes</span></a>
  <div class="brand-badge">UNO</div>
  <div style="width:32px"></div>
</div>

<div id="setup-screen" class="screen active">
  <h1 class="title" style="color:#ef4444">Select UNO mode</h1>
  <button class="btn btn-primary" onclick="startMode('ai')"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 13h.01M15 13h.01M9 17h6"/></svg> Solo vs AI</button>
  <button class="btn btn-outline" onclick="openSplit()"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg> 1v1 Split-screen</button>
  <p class="sub" style="margin-top:8px">Screen layout</p>
  <div class="seg" id="layout-seg">
    <button data-l="side" class="on" onclick="setLayoutPref('side')">Side by side</button>
    <button data-l="tb" onclick="setLayoutPref('tb')">Top &amp; bottom</button>
  </div>
  <button class="btn btn-ghost" onclick="location.href='index.html'"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Back to Hub</button>
</div>

<div id="split-screen" class="screen">
  <h1 class="title" style="margin-bottom:10px">Split-screen setup</h1>
  <div id="split-step1" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <p class="sub">Enter Player 2's roll number</p>
    <div class="roll-display" id="roll-display"><b></b><b></b><b></b></div>
    <div class="form-error" id="split-err" hidden></div>
    <div class="keypad" id="keypad"></div>
  </div>
  <div id="split-step2" hidden style="width:100%;display:flex;flex-direction:column;align-items:center">
    <p class="sub">Roll 138 is shared. Who is Player 2?</p>
    <div class="intake-row">
      <button type="button" class="btn btn-primary" onclick="pickIntake('Aion')">Aion</button>
      <button type="button" class="btn btn-outline" onclick="pickIntake('Maria')">Maria</button>
    </div>
    <div class="form-error" id="split-err2" hidden></div>
  </div>
  <button type="button" class="btn btn-ghost" onclick="showScreen('setup-screen')">Cancel</button>
</div>

<!-- ═════════ GAME ═════════ -->
<div id="game-screen">
  <div class="g-top">
    <button class="pause-btn" onclick="pauseGame()"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14M16 5v14"/></svg> PAUSE</button>
    <div class="timer" id="timer">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="8"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5v3"/></svg>
      <div class="timer-num" id="timer-num">15</div>
    </div>
    <button class="lay-btn" onclick="toggleLayout()" aria-label="Change layout" id="lay-btn"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h18"/></svg></button>
    <div class="deck-info"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="13" height="17" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h9"/></svg> <span id="deck-count">0</span></div>
  </div>

  <div class="board side" id="board">
    <section class="panel" id="panel-L"></section>
    <div class="main-zone">
      <div class="table-card" id="discard"></div>
      <div class="turn-plate" id="turn-plate"><strong id="turn-name">—</strong><em id="turn-note"></em></div>
      <button class="switch-btn" onclick="swapSides()" aria-label="Switch sides"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg><span>SWITCH</span></button>
    </div>
    <section class="panel" id="panel-R"></section>
  </div>

  <div class="flash" id="flash"></div>
  <div class="toast" id="toast"></div>
</div>

<div class="overlay" id="color-overlay">
  <div class="overlay-box" id="color-box">
    <h2 id="color-title">Choose a color</h2>
    <div class="color-picker">
      <button class="color-btn" style="background:var(--red)" onclick="selectColor('red')"></button>
      <button class="color-btn" style="background:var(--blue)" onclick="selectColor('blue')"></button>
      <button class="color-btn" style="background:var(--green)" onclick="selectColor('green')"></button>
      <button class="color-btn" style="background:var(--yellow)" onclick="selectColor('yellow')"></button>
    </div>
  </div>
</div>

<div class="overlay" id="pause-overlay" style="z-index:110">
  <div class="overlay-box">
    <h2>Game paused</h2>
    <div class="vs" id="pause-vs"></div>
    <button class="btn btn-primary" style="max-width:none" onclick="resumeGame()"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg> Resume</button>
    <button class="btn btn-outline" style="max-width:none" onclick="rematch()"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg> Restart</button>

  <div class="win-crown"><svg class="ic" viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg></div>
  <div class="win-name" id="win-name">—</div>
  <div class="win-line" id="win-line"></div>

    <button class="btn btn-primary" style="max-width:none" onclick="rematch()"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg> Play again</button>
    <button class="btn btn-outline" style="max-width:none" onclick="leaveGame()">Back to Hub</button>
  </div>
</div>

<script>
const STUDENTS={'002':'Orin','004':'Saikat','005':'ASHIK','007':'Preonti','009':'Nazmul','010':'Sumaiya Siya','015':'M D Emran','017':'Boishakhi','019':'Aysha','022':'Iftikh','023':'Ryan','024':'Shakib','026':'Fahim','027':'Shajid','028':'Nafi','029':'Polok','030':'Adnan','031':'Sumaiya','032':'Mahde','033':'Foujia','035':'Risal','036':'Tonmoy','039':'Alif','040':'Sohan','041':'Shuvo','052':'Prapti','064':'Rifa','117':'Rafa','125':'Nusrat','129':'ABIR','137':'Mahin','140':'Meghla','145':'Samir','146':'Teetun','147':'Faiyaz','153':'Wafa','161':'Nafis','164':'Sanjana','381':'Moon'};

const TURN_MS=15000, HINT_AFTER_MS=5000;
const HEX={red:'#ef4444',blue:'#3b82f6',green:'#22c55e',yellow:'#eab308'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC=(p,s=18,sw=2)=>`<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const CROWN=IC('<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',16),CARDS=IC('<rect x="7" y="3" width="13" height="17" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h9"/>',14);
const SYM={Skip:'<circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/>',Reverse:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>'};
const symSvg=k=>`<svg viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#000" stroke-width="5.5">${SYM[k]}</g><g stroke="currentColor" stroke-width="3">${SYM[k]}</g></svg>`;
const EYE20=null;
const EYE='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>';

try{if(localStorage.getItem('66games_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}
let currentUser=null;
try{currentUser=JSON.parse(localStorage.getItem('66games_user'))}catch(e){}
if(!currentUser)location.replace('index.html');
const me=currentUser||{roll:'',name:'Player'};

/* ───────── State ───────── */
let mode='',layout='side';
try{layout=localStorage.getItem('66games_uno_layout')||'side'}catch(e){}
if(layout!=='side'&&layout!=='tb')layout='side';
let players=[],seat={L:1,R:0},deck=[],discard=[],currentColor='red';
let turnIdx=0,turnNote='',revealed=false,drewThisTurn=false;
let busy=false,paused=false,over=false,pickerOpen=false,pending=null;
let remaining=TURN_MS,lastTick=performance.now(),gameOn=false,gen=0;
const hi=[0,0];                       // front-card index of each player's carousel
const isAI=i=>mode==='ai'&&i===1;

/* ───────── Layout preference ───────── */
function setLayoutPref(l){
  layout=l;try{localStorage.setItem('66games_uno_layout',l)}catch(e){}
  document.querySelectorAll('#layout-seg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
}
setLayoutPref(layout);
function toggleLayout(){setLayoutPref(layout==='side'?'tb':'side');buildPanels();renderAll()}

/* ───────── Setup flow ───────── */
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}

/* numeric keypad: nothing is checked while typing; lookup runs only on OK / Enter */
let rollVal='',checking=false;
(function buildKeypad(){
  const kp=$('keypad');
  const BKSP='<svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:0"><path d="M21 5H9l-6 7 6 7h12zM13 9l4 6M17 9l-4 6"/></svg>';
  const keys=['1','2','3','4','5','6','7','8','9','del','0','OK'];
  kp.innerHTML=keys.map(k=>`<button type="button" class="key${k==='OK'?' ok':k==='del'?' del':''}" data-k="${k}">${k==='del'?BKSP:k}</button>`).join('');
  kp.addEventListener('click',e=>{const b=e.target.closest('.key');if(b)pressKey(b.dataset.k)});
})();
function drawRoll(){
  const cells=$('roll-display').children;
  for(let i=0;i<3;i++){cells[i].textContent=rollVal[i]||'';cells[i].classList.toggle('cur',i===Math.min(rollVal.length,2))}
}
function pressKey(k){
  if(checking)return;
  $('split-err').hidden=true;
  if(k==='del')rollVal=rollVal.slice(0,-1);
  else if(k==='OK')return submitRoll();
  else if(rollVal.length<3)rollVal+=k;
  drawRoll();
}
document.addEventListener('keydown',e=>{
  if(!$('split-screen').classList.contains('active')||!$('split-step2').hidden)return;
  if(/^[0-9]$/.test(e.key))pressKey(e.key);
  else if(e.key==='Backspace')pressKey('del');
  else if(e.key==='Enter')pressKey('OK');
});
function openSplit(){
  rollVal='';checking=false;drawRoll();
  $('split-step1').hidden=false;$('split-step2').hidden=true;
  $('split-err').hidden=true;$('split-err2').hidden=true;
  $('keypad').classList.remove('busy');$('keypad').lastChild.textContent='OK';
  showScreen('split-screen');
}
function splitError(msg){const el=$('split-step2').hidden?$('split-err'):$('split-err2');el.textContent=msg;el.hidden=false}
function submitRoll(){
  if(!rollVal)return splitError('Enter a roll number');
  checking=true;
  const kp=$('keypad');kp.classList.add('busy');
  const okBtn=kp.lastChild;okBtn.innerHTML='<span class="spin"></span>';
  setTimeout(()=>{                                   // short loading animation, then the single lookup
    checking=false;kp.classList.remove('busy');okBtn.textContent='OK';
    const roll=rollVal.padStart(3,'0');
    if(roll==='138'){$('split-step1').hidden=true;$('split-step2').hidden=false;return}
    const name=STUDENTS[roll];
    if(!name)return splitError('Roll not found!');
    if(roll===me.roll)return splitError("That's you! Pick another player.");
    beginSplit(name);
  },550);
}
function pickIntake(name){
  if(me.roll==='138'&&name===me.name)return splitError("That's you! Pick the other one.");
  beginSplit(name);
}
const dark=()=>document.documentElement.getAttribute('data-theme')==='dark';
const PC=()=>[dark()?'#3b6cff':'#123cf3',dark()?'#94a3b8':'#0b1220'];
function beginSplit(p2){mode='split';players=[mk(me.name,PC()[0]),mk(p2,PC()[1])];initGame()}
function startMode(m){mode=m;players=[mk(me.name,PC()[0]),mk('Computer',PC()[1])];initGame()}
function mk(name,color){return{name,color,hand:[]}}

/* ───────── Deck ───────── */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function createDeck(){
  const d=[];
  for(const color of['red','blue','green','yellow']){
    d.push({color,type:'number',value:'0'});
    for(let i=1;i<=9;i++){d.push({color,type:'number',value:''+i});d.push({color,type:'number',value:''+i})}
    for(const a of['Skip','Reverse','Draw2']){d.push({color,type:'action',value:a});d.push({color,type:'action',value:a})}
  }
  for(let i=0;i<4;i++){d.push({color:'wild',type:'wild',value:'Wild'});d.push({color:'wild',type:'wild',value:'Draw4'})}
  return shuffle(d);
}
function takeCard(){
  if(!deck.length&&discard.length>1){const top=discard.pop();deck=shuffle(discard);discard=[top]}
  return deck.pop()||null;
}
function giveCard(pi,n){
  const got=[];
  for(let i=0;i<n;i++){const c=takeCard();if(c){players[pi].hand.push(c);got.push(c)}}
  if(got.length)hi[pi]=players[pi].hand.length-1;   // newest card comes to the front
  return got;
}

/* ───────── Game start ───────── */
function initGame(){
  gen++;
  deck=createDeck();discard=[];
  players.forEach(p=>p.hand=deck.splice(0,7));
  let first=deck.pop();
  while(first.type!=='number'){deck.unshift(first);first=deck.pop()}
  discard.push(first);currentColor=first.color;
  seat={L:1,R:0};hi[0]=hi[1]=0;
  over=false;paused=false;pickerOpen=false;pending=null;gameOn=true;
  ['win-overlay','pause-overlay','color-overlay'].forEach(id=>$(id).classList.remove('active'));
  $('main-top').style.display='none';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('game-screen').classList.add('active');
  buildPanels();
  startTurn(Math.random()<.5?0:1);
}
function rematch(){if(!players.length)return;initGame()}
function leaveGame(){location.href='index.html'}
function later(fn,ms){
  const g=gen;
  setTimeout(function wait(){
    if(g!==gen)return;
    if(paused||pickerOpen)return setTimeout(wait,300);
    fn();
  },ms);
}

/* ───────── Turns ───────── */
function startTurn(idx,note){
  turnIdx=idx;turnNote=note||'';
  revealed=false;drewThisTurn=false;busy=false;remaining=TURN_MS;
  renderAll();flashTurn();
  if(isAI(idx))later(aiTurn,1500+Math.random()*600);
}
const nextTurn=()=>startTurn(1-turnIdx);
function isPlayable(card){
  if(card.color==='wild')return true;
  const top=discard[discard.length-1];
  if(card.color===currentColor)return true;
  if(card.type==='number'&&top.type==='number'&&card.value===top.value)return true;
  if(card.type==='action'&&top.type==='action'&&card.value===top.value)return true;
  return false;
}
const canAct=pi=>!paused&&!busy&&!over&&!pickerOpen&&turnIdx===pi&&(isAI(pi)||revealed);

function playCard(pi,ci){
  if(!canAct(pi))return;
  const card=players[pi].hand[ci];
  if(!card)return;
  if(!isPlayable(card)){
    const el=carNodes(sideOf(pi))[ci];
    if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
    return;
  }
  flyFrom=rectOf(carNodes(sideOf(pi))[ci]);
  players[pi].hand.splice(ci,1);
  hi[pi]=Math.max(0,Math.min(hi[pi],players[pi].hand.length-1));
  busy=true;
  if(card.color==='wild'){
    if(isAI(pi))return resolveCard(pi,card,aiPickColor(pi));
    pending={pi,card};pickerOpen=true;
    $('color-title').textContent=`${players[pi].name}, choose a color`;
    $('color-box').classList.toggle('flip',layout==='tb'&&sideOf(pi)==='L');
    renderAll();
    $('color-overlay').classList.add('active');
    return;
  }
  resolveCard(pi,card,card.color);
}
function selectColor(color){
  if(!pending)return;
  $('color-overlay').classList.remove('active');
  const{pi,card}=pending;pending=null;pickerOpen=false;
  resolveCard(pi,card,color);
}
function resolveCard(pi,card,color){
  discard.push(card);currentColor=color;
  renderAll();animPlay(card);
  if(!players[pi].hand.length)return win(pi);
  const opp=1-pi,oppName=players[opp].name;
  let again=false,note='';
  if(card.type==='action'){
    again=true;
    if(card.value==='Skip')note=`${oppName} is skipped!`;
    if(card.value==='Reverse')note='Reverse!';
    if(card.value==='Draw2'){giveCard(opp,2);note=`${oppName} draws 2!`}
  }else if(card.value==='Draw4'){giveCard(opp,4);again=true;note=`${oppName} draws 4!`}
  renderAll();
  later(()=>startTurn(again?pi:opp,again?note+' Play again.':''),900);
}
function drawCard(side){
  if(side&&seat[side]!==turnIdx)return;
  if(paused||busy||over||pickerOpen||isAI(turnIdx)||!gameOn)return;
  if(drewThisTurn)return toast('You already drew this turn');
  busy=true;drewThisTurn=true;
  const got=giveCard(turnIdx,1);
  renderAll();if(got.length)animDraw(turnIdx);
  toast(`${players[turnIdx].name} drew a card`);
  if(got[0]&&isPlayable(got[0])){busy=false;remaining=TURN_MS;renderAll()}   // playable draw: keep the turn, fresh 15 s
  else later(nextTurn,900);
}
function autoDraw(){
  busy=true;
  toast(`${players[turnIdx].name} ran out of time — auto draw!`);
  const gotA=drewThisTurn?[]:giveCard(turnIdx,1);
  renderAll();if(gotA.length)animDraw(turnIdx);
  later(nextTurn,1100);
}

/* ───────── AI ───────── */
function aiPickColor(pi){
  const count={red:0,blue:0,green:0,yellow:0};
  players[pi].hand.forEach(c=>{if(count[c.color]!==undefined)count[c.color]++});
  const best=Object.keys(count).sort((a,b)=>count[b]-count[a])[0];
  return count[best]?best:['red','blue','green','yellow'][Math.floor(Math.random()*4)];
}
function aiTurn(){
  if(over||!isAI(turnIdx))return;
  const hand=players[1].hand;
  let idx=hand.findIndex(c=>c.color!=='wild'&&isPlayable(c));
  if(idx<0)idx=hand.findIndex(c=>isPlayable(c));
  if(idx>=0)return playCard(1,idx);
  busy=true;
  const got=giveCard(1,1);
  toast(`${players[1].name} draws a card`);
  renderAll();if(got.length)animDraw(1);
  if(got[0]&&isPlayable(got[0]))later(()=>{busy=false;playCard(1,players[1].hand.length-1)},900);
  else later(nextTurn,900);
}

/* ───────── Slide animations (a flat clone flies; no layout work) ───────── */
const rectOf=el=>el&&el.getBoundingClientRect();
let flyFrom=null;
function fly(fr,to,html,cls,done){
  if(!fr||!to||!fr.width){done&&done();return}
  const f=document.createElement('div');
  f.className='card fly '+cls;f.innerHTML=html;
  f.style.cssText=`--w:${fr.width}px;left:${fr.left}px;top:${fr.top}px`;
  $('game-screen').appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    f.style.transform=`translate(${to.left-fr.left}px,${to.top-fr.top}px) scale(${to.width/fr.width})`;
  }));
  setTimeout(()=>{f.remove();done&&done()},430);
}
function animDraw(pi){                              // draw pile -> player's hand
  const side=sideOf(pi),panel=$('panel-'+side),nodes=panel._nodes||[],node=nodes[nodes.length-1];
  const pile=panel.querySelector('.draw-pile .card');
  if(!node||!pile)return;
  node.style.visibility='hidden';
  fly(rectOf(pile),rectOf(node),'','card-back',()=>{node.style.visibility=''});
}
function animPlay(card){                            // hand -> main card
  const fr=flyFrom;flyFrom=null;
  const tgt=$('discard').querySelector('.card');
  if(!fr||!tgt)return;
  tgt.style.visibility='hidden';
  fly(fr,rectOf(tgt),cardInner(card),'c-'+card.color,()=>{tgt.style.visibility=''});
}

/* ───────── Hide / reveal ───────── */
function toggleReveal(side){
  const pi=seat[side];
  if(pi!==turnIdx||isAI(pi)||paused||over)return;
  revealed=!revealed;
  renderAll();
}

/* ───────── Seats ───────── */
const sideOf=pi=>seat.L===pi?'L':'R';
function swapSides(){[seat.L,seat.R]=[seat.R,seat.L];renderAll()}

/* ───────── Timer (cheap: runs 5×/s and only touches DOM when a value changes) ───────── */
let lastSec=-1,lastLow=null,hintOn=null;
setInterval(()=>{
  const now=performance.now(),dt=now-lastTick;lastTick=now;
  if(!gameOn||paused||over||pickerOpen||busy)return;
  remaining-=dt;
  if(!isAI(turnIdx)&&remaining<=0){remaining=0;renderTimer();autoDraw();return}
  if(remaining<0)remaining=0;
  renderTimer();
  updateHint();
},200);
function renderTimer(){
  const s=Math.ceil(remaining/1000);
    if(s!==lastSec){lastSec=s;$('timer-num').textContent=s}
  const low=remaining<=3000;
  if(low!==lastLow){lastLow=low;$('timer').classList.toggle('low',low)}
}
/* after 5 s with the cards still hidden: bouncing arrow + pulsing eye */
function updateHint(){
  const want=gameOn&&!over&&!paused&&!revealed&&!isAI(turnIdx)&&!busy&&(TURN_MS-remaining)>=HINT_AFTER_MS;
  const side=sideOf(turnIdx),key=want?side:null;
  if(key===hintOn)return;
  hintOn=key;
  ['L','R'].forEach(s=>{
    const on=want&&s===side,p=$('panel-'+s);
    p.querySelector('.hint').classList.toggle('show',on);
    p.querySelector('.hide-btn').classList.toggle('pulse',on);
  });
}

/* ───────── Pause ───────── */
function pauseGame(){
  if(!gameOn||over||paused)return;
  paused=true;
  $('pause-vs').innerHTML=`${esc(players[0].name)} — ${esc(players[1].name)}`;
  $('pause-overlay').classList.add('active');
  renderAll();
}
function resumeGame(){paused=false;lastTick=performance.now();$('pause-overlay').classList.remove('active');renderAll()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});

/* ───────── Win ───────── */
function win(pi){
  over=true;
  const w=players[pi].name,l=players[1-pi].name;
  $('win-name').textContent=w;
  $('win-line').innerHTML=`<b>${esc(w)}</b> — ${esc(l)}`;
  later(()=>$('win-overlay').classList.add('active'),700);
}

/* ───────── Rendering ───────── */
function buildPanels(){
  $('board').className='board '+layout;
  ['L','R'].forEach(side=>{
    const el=$('panel-'+side);
    el.innerHTML=`
      <div class="p-top">
        <div class="draw-pile"><div class="card card-back"></div><span>DRAW</span></div>
        <div class="name-bar"><span class="crown">${CROWN}</span><span class="pname"></span><span class="pcount"></span></div>
      </div>
      <div class="p-hand">
        <div class="car"></div>
        <div class="hand-label" hidden></div>
        <div class="hint"><span>REVEAL</span>${IC('<path d="M12 4v14M6 12l6 7 6-7"/>',26,3)}</div>
        <button class="hide-btn" aria-label="Hide or show cards"></button>
      </div>`;
    el._sig=null;el._nodes=[];
    el.querySelector('.draw-pile').onclick=()=>drawCard(side);
    el.querySelector('.hide-btn').onclick=()=>toggleReveal(side);
    attachSwipe(side);
  });
  hintOn=null;
}

/* ── 3D swipe hand ── */
const carNodes=side=>$('panel-'+side)._nodes||[];
function attachSwipe(side){
  const car=$('panel-'+side).querySelector('.car');
  let sx=0,down=false,moved=false;
  const flip=()=>layout==='tb'&&side==='L'?-1:1;       // top panel is upside down
  const faceUp=()=>{const pi=seat[side];return pi===turnIdx&&revealed&&!isAI(pi)&&!paused};
  car.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;try{car.setPointerCapture(e.pointerId)}catch(_){}});
  car.addEventListener('pointermove',e=>{
    if(!down||!faceUp())return;
    const pi=seat[side],n=players[pi].hand.length;
    const step=parseFloat(getComputedStyle($('board')).getPropertyValue('--cw'))||60;
    const th=Math.max(22,step*.42);
    let dx=(e.clientX-sx)*flip();
    while(Math.abs(dx)>=th){
      const d=dx<0?1:-1;
      hi[pi]=Math.max(0,Math.min(n-1,hi[pi]+d));
      dx-=d*-th;sx=e.clientX;moved=true;
      if(hi[pi]===0||hi[pi]===n-1)break;
    }
    if(moved)layoutHand(side);
  });
  const end=e=>{
    if(!down)return;down=false;
    if(moved||!faceUp())return;
    const pi=seat[side];
    const t=document.elementFromPoint(e.clientX,e.clientY),el=t&&t.closest&&t.closest('.car .card');
    if(!el||!car.contains(el))return;
    const i=+el.dataset.i;
    if(i===hi[pi])playCard(pi,i);                       // only the front card can be played
    else{hi[pi]=i;layoutHand(side)}                    // tap a side card: bring it to the front
  };
  car.addEventListener('pointerup',end);
  car.addEventListener('pointercancel',()=>{down=false});
}

function cardInner(card){
  let v=card.value;
  if(v==='Skip'||v==='Reverse')return `<span class="ct">${symSvg(v)}</span>`;
  if(v==='Draw2')v='+2';else if(v==='Draw4')v='+4';else if(v==='Wild')v='WILD';
  return `<span class="ct">${v}</span>`;
}
function cardEl(card,asColor){
  const el=document.createElement('div');
  const col=card.color==='wild'&&asColor?asColor:card.color;
  el.className=`card c-${col}`;
  el.innerHTML=cardInner(card);
  return el;
}

function syncHand(side){
  const pi=seat[side],p=players[pi],panel=$('panel-'+side),car=panel.querySelector('.car');
  const sig=pi+':'+p.hand.map(c=>c.color+c.value).join(',');
  if(panel._sig!==sig){                                   // rebuild nodes only when the hand really changed
    panel._sig=sig;car.innerHTML='';
    panel._nodes=p.hand.map((c,i)=>{const n=document.createElement('div');n.dataset.i=i;car.appendChild(n);return n});
    panel._face=null;
  }
  const mine=pi===turnIdx,face=mine&&revealed&&!isAI(pi)&&!paused;
  if(panel._face!==face||panel._rev!==currentColor+discard.length){
    panel._face=face;panel._rev=currentColor+discard.length;
    p.hand.forEach((c,i)=>{
      const n=panel._nodes[i];
      if(face){
        n.className='card c-'+c.color;n.innerHTML=cardInner(c);
        n.dataset.ok=isPlayable(c)?'1':'';
      }else{n.className='card card-back';n.innerHTML='';n.dataset.ok=''}
    });
  }
  layoutHand(side);
}
function layoutHand(side){
  const pi=seat[side],panel=$('panel-'+side),nodes=panel._nodes||[];
  const n=nodes.length;
  hi[pi]=Math.max(0,Math.min(hi[pi],Math.max(0,n-1)));
  const face=panel._face;
  nodes.forEach((nd,i)=>{
    const o=i-hi[pi],a=Math.abs(o);
    nd.style.setProperty('--o',o);nd.style.setProperty('--a',a);nd.style.zIndex=20-a;
    const base=nd.className.replace(/\b(front|far|dim|go|shake)\b/g,'').replace(/\s+/g,' ').trim();
    let cls=base;
    if(a>3)cls+=' far';
    if(o===0)cls+=' front';
    if(face){if(!nd.dataset.ok)cls+=' dim';else if(o===0)cls+=' go'}
    if(nd.className!==cls)nd.className=cls;
  });
}

function renderAll(){
  if(!players.length)return;
  const top=discard[discard.length-1];
  const d=$('discard'),dk=top.color+top.value+currentColor+discard.length;
  if(d._k!==dk){d._k=dk;d.innerHTML='';d.appendChild(cardEl(top,currentColor))}
  d.style.setProperty('--cur',HEX[currentColor]);
  $('deck-count').textContent=deck.length;
  const tp=players[turnIdx];
  $('turn-plate').style.setProperty('--pc',tp.color);
  $('turn-name').innerHTML=CROWN+'<span>'+esc(tp.name)+'</span>';
  $('turn-note').textContent=turnNote;
  renderTimer();
  ['L','R'].forEach(renderPanel);
  document.querySelectorAll('.hint.show,.hide-btn.pulse').forEach(e=>e.classList.remove('show','pulse'));
  hintOn=null;updateHint();
}
function renderPanel(side){
  const pi=seat[side],p=players[pi],el=$('panel-'+side);
  const mine=pi===turnIdx,ai=isAI(pi);
  el.style.setProperty('--pc',p.color);
  el.classList.toggle('active',mine);
  el.querySelector('.pname').textContent=p.name;
  el.querySelector('.pcount').innerHTML=p.hand.length+' '+CARDS;
  el.querySelector('.p-hand').classList.toggle('idle',!mine);
  syncHand(side);

  const label=el.querySelector('.hand-label');
  if(mine&&!revealed&&!ai&&!over){label.hidden=false;label.innerHTML=EYE_OFF.replace(/width="24" height="24"/,'width="15" height="15"')+'<span>Hidden — tap the eye</span>'}else label.hidden=true;

  const hb=el.querySelector('.hide-btn');
  hb.disabled=!mine||ai;
  hb.classList.toggle('is-hidden',mine&&!revealed&&!ai);
  const showOff=mine&&revealed;
  if(hb._off!==showOff){hb._off=showOff;hb.innerHTML=(showOff?EYE_OFF:EYE).replace('width="24" height="24"','width="20" height="20"')+'<span>'+(showOff?'HIDE':'SHOW')+'</span>'}
  el.querySelector('.draw-pile').classList.toggle('off',!mine||ai);
}

/* ───────── Messages ───────── */
function flashTurn(){
  const p=players[turnIdx],f=$('flash');
  f.innerHTML=`<div class="flash-in" style="--c:${p.color}"><small>${CROWN} YOUR TURN</small><b>${esc(p.name)}</b>${turnNote?`<em>${esc(turnNote)}</em>`:''}</div>`;
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
}
let toastT;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
