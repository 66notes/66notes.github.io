<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#ffffff" />
<title>Chess · 66Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#eef6fd;--surface:#fff;--border:#dbe7f3;--text:#1e2a3e;--text2:#64748b;--navy:#0d2b4e;
  --accent:#123cf3;--accent-light:#eef2ff;--light:#ffffff;--dark:#aed6f6;--frame:#5fa8e0;
}
:root[data-theme="dark"]{
  --bg:#0b0e14;--surface:#151a22;--border:#2a3442;--text:#f0f4f8;--text2:#8b98a5;--navy:#e2e8f0;
  --accent:#4f7bff;--accent-light:#1c2540;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}

.top-bar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-size:1.15rem;font-weight:800;color:var(--navy);text-decoration:none}
.logo span{color:var(--accent)}
.badge{background:var(--accent);color:#fff;padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:700}

.screen{flex:1;min-height:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:16px}
.screen.active{display:flex}
.card{width:100%;max-width:360px;margin:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px;text-align:center}
.hero{width:86px;height:86px;margin:0 auto 8px;border-radius:22px;background:linear-gradient(135deg,var(--frame),var(--accent));padding:6px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
h1{font-size:1.45rem;font-weight:800;color:var(--navy)}
.sub{font-size:.78rem;color:var(--text2);margin-bottom:8px}
.btn{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--accent);font-size:.92rem;font-weight:700;margin-top:10px;padding:8px}
.btn:active:not(:disabled){transform:scale(.97)}
.primary{background:var(--accent);color:#fff}
.outline{background:var(--surface);color:var(--accent)}
.ghost{background:none;border-color:transparent;color:var(--text2)}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-top:12px}
.seg button{flex:1;border:none;background:none;color:var(--text2);padding:8px;border-radius:9px;font-weight:700;font-size:.8rem}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ── game layout: face to face, or side by side ── */
#game{--size:min(calc(100vw - 20px),calc(100vh - 262px),520px);display:none;justify-content:center;align-content:center;justify-items:center;gap:8px;padding:8px;overflow:hidden}
@supports (height:100dvh){#game{--size:min(calc(100vw - 20px),calc(100dvh - 262px),520px)}}
#game.active{display:grid}
#game.face{grid-template-columns:100%;grid-template-areas:"top" "board" "bottom" "status" "controls"}
#game.side{--size:min(calc(100vw - 20px),calc(100vh - 214px),520px);grid-template-columns:repeat(2,calc(max(var(--size),280px)/2 - 1px));column-gap:6px;grid-template-areas:"board board" "status status" "left right" "controls controls"}
@supports (height:100dvh){#game.side{--size:min(calc(100vw - 20px),calc(100dvh - 214px),520px)}}

.player{width:max(var(--size),280px);height:58px;display:flex;align-items:center;gap:9px;padding:6px 10px;background:var(--surface);border:2px solid var(--border);border-radius:16px;transition:border-color .25s,background-color .25s,transform .45s}
.side .player{width:100%;padding:6px;gap:6px}
.player.turn{border-color:var(--accent);background:var(--accent-light);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{border-color:var(--frame)}}
.player.rot{transform:rotate(180deg)}
.avatar{width:38px;height:38px;flex-shrink:0;border-radius:11px;border:2px solid var(--frame);padding:1px}
.side .avatar{width:30px;height:30px}
.avatar.w{background:#cfe8fb}.avatar.b{background:#fff}
.who{flex:1;min-width:0;text-align:left}
.pname{font-weight:700;font-size:.92rem;color:var(--navy);white-space:nowrap;overflow:hidden;line-height:1.5;padding-top:2px}
.side .pname{font-size:.78rem}
.taken{display:flex;align-items:center;height:18px;overflow:hidden}
.taken svg{width:17px;height:17px;flex-shrink:0;margin-right:-5px}
.taken em{font-style:normal;font-size:.7rem;font-weight:800;margin-left:9px;color:#16a34a}
.tag{font-size:.65rem;font-weight:800;padding:4px 9px;border-radius:20px;background:var(--accent);color:#fff;visibility:hidden}
.player.turn .tag{visibility:visible}
.side .tag{display:none}

.frame{grid-area:board;width:max(var(--size),280px);height:max(var(--size),280px);padding:5px;border-radius:14px;background:linear-gradient(145deg,#7cc0f0,#3f86c4);box-shadow:0 8px 22px rgba(18,90,160,.25)}
.frame.spin{animation:dip .8s ease-in-out}
@keyframes dip{50%{transform:scale(.74)}}
.board{width:100%;height:100%;position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:9px;background:var(--light);transition:transform .8s cubic-bezier(.5,0,.3,1)}
.sq{position:relative;border:none;padding:0;min-width:0;min-height:0;background:var(--light)}
.sq.d{background:var(--dark)}
.sq.last{background-image:linear-gradient(rgba(250,204,21,.45),rgba(250,204,21,.45))}
.sq.sel{background-image:linear-gradient(rgba(18,60,243,.35),rgba(18,60,243,.35))}
.sq.check::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,#ef4444 30%,rgba(239,68,68,0) 72%);animation:alarm .6s ease-in-out infinite alternate}
@keyframes alarm{from{opacity:.45}}
.sq.move::after{content:'';position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(18,60,243,.5);animation:dot .25s cubic-bezier(.2,2,.4,1)}
.sq.take::after{content:'';position:absolute;inset:3%;border-radius:50%;border:4px solid rgba(239,68,68,.85);animation:dot .25s cubic-bezier(.2,2,.4,1)}
@keyframes dot{from{transform:scale(0)}}
.coord{position:absolute;font-size:.55rem;font-weight:700;color:#3c76a8;pointer-events:none;line-height:1;transition:transform .8s}
.coord.rank{top:2px;left:2px}.coord.file{bottom:2px;right:2px}

/* pieces slide; the art inside turns to face its player */
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;pointer-events:none;z-index:2;transition:transform .34s cubic-bezier(.3,1.2,.4,1)}
.pc .turner{width:100%;height:100%;transition:transform .8s cubic-bezier(.5,0,.3,1)}
.pc svg{display:block;width:100%;height:100%;overflow:visible;transition:transform .18s cubic-bezier(.2,2,.4,1);transform-origin:50% 85%}
.pc.sel{z-index:4}.pc.sel svg{transform:translateY(-12%) scale(1.22)}
.pc.moving{z-index:5}.pc.moving svg{animation:hop .34s ease-out}
@keyframes hop{45%{transform:scale(1.3)}75%{transform:scale(.94,.9)}}
.pc.dead{z-index:1;animation:die .42s forwards}
@keyframes die{35%{opacity:1;scale:1.35;rotate:12deg}100%{opacity:0;scale:.1;rotate:-60deg}}
.pc.deal svg{animation:deal .45s backwards cubic-bezier(.2,1.7,.4,1)}
@keyframes deal{from{opacity:0;transform:translateY(-90%) scale(.5)}}
.pc.crown svg{animation:crown .7s cubic-bezier(.2,1.8,.4,1)}
@keyframes crown{0%{transform:scale(.2) rotate(-200deg)}60%{transform:scale(1.5)}}
.spark{position:absolute;width:12.5%;height:12.5%;pointer-events:none;z-index:3;border-radius:50%;border:3px solid #fbbf24;animation:spark .45s ease-out forwards}
@keyframes spark{from{scale:.3}to{scale:1.7;opacity:0}}

.status{grid-area:status;font-weight:700;font-size:.85rem;color:var(--navy);min-height:1.3em;text-align:center;transition:transform .4s}
.status.alert{color:#dc2626}
.status.rot{transform:rotate(180deg)}
.controls{grid-area:controls;width:max(var(--size),280px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ctl{height:48px;border-radius:13px;border:1px solid var(--border);background:var(--surface);color:var(--navy);font-size:.66rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ctl i{font-style:normal;font-size:1.15rem;line-height:1.1;color:var(--accent)}
.ctl.pkey{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl.pkey i{color:#fff;font-weight:800}
.ctl:active:not(:disabled){transform:scale(.94)}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(13,43,78,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .card{margin:0;animation:rise .3s cubic-bezier(.2,1.4,.4,1)}
.overlay.rot{transform:rotate(180deg)}
@keyframes rise{from{opacity:0;scale:.7}}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.promo button{height:68px;border-radius:14px;border:2px solid var(--frame);background:var(--dark);padding:4px}
.promo svg{width:100%;height:100%}
.trophy{font-size:3.8rem;line-height:1.2;animation:float 1.4s ease-in-out infinite}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1"><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#bcd7ee"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b6ea5"/><stop offset=".65" stop-color="#0d2b4e"/><stop offset="1" stop-color="#06182e"/></linearGradient>
  </defs>
</svg>

<header class="top-bar" id="topBar">
  <a href="index.html" class="logo">66<span>Games</span></a>
  <div class="badge">Chess</div>
</header>

<section id="setup" class="screen active">
  <div class="card">
    <div class="hero" id="hero"></div>
    <h1>Chess</h1>
    <p class="sub" id="hello"></p>
    <button class="btn primary" onclick="openFriend()">You vs Friend</button>
    <button class="btn outline" onclick="startAI()">Solo vs Computer</button>
    <div class="seg" id="levelSeg">
      <button data-level="1">Easy</button><button data-level="3" class="on">Normal</button>
    </div>
    <button class="btn ghost" onclick="location.href='index.html'">← Back to Hub</button>
  </div>
</section>

<section id="game" class="screen face">
  <div class="player" id="player-w"></div>
  <div class="frame" id="frame"><div class="board" id="board"></div></div>
  <div class="player" id="player-b"></div>
  <div class="status" id="status"></div>
  <div class="controls">
    <button class="ctl" id="undoBtn" onclick="undo()"><i>↶</i>Undo</button>
    <button class="ctl pkey" id="pBtn" onclick="changeView()"><i>P</i>View</button>
    <button class="ctl" onclick="askRestart()"><i>↻</i>Restart</button>
    <button class="ctl" onclick="askLeave()"><i>✕</i>Exit</button>
  </div>
</section>

<div class="overlay" id="promoOverlay" hidden>
  <div class="card">
    <h1>Promote pawn</h1>
    <div class="promo" id="promo"></div>
    <button class="btn ghost" onclick="cancelPromo()">Cancel</button>
  </div>
</div>

<div class="overlay" id="endOverlay" hidden>
  <div class="card">
    <div class="trophy" id="endIcon"></div>
    <h1 id="endTitle"></h1>
    <p class="sub" id="endReason"></p>
    <button class="btn primary" onclick="newGame()">Play again</button>
    <button class="btn outline" onclick="$('endOverlay').hidden=true">View board</button>
    <button class="btn ghost" onclick="location.href='index.html'">Back to Hub</button>
  </div>
</div>

<script src="students.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);

try { if (localStorage.getItem('66games_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('66games_user')); } catch (e) {}
if (!currentUser) location.replace('index.html');
const me = currentUser || { roll: '', name: 'Player' };
$('hello').textContent = 'Playing as ' + me.name;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  $('topBar').hidden = id === 'game';
}

/* ═════════ Chess rules ═════════
   Squares are 0..63, 0 = a8, 63 = h1. A piece is colour + type, e.g. 'wk'. */
const other = c => c === 'w' ? 'b' : 'w';
const inside = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const KNIGHT = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
const STRAIGHT = [[-1,0],[1,0],[0,-1],[0,1]];
const DIAGONAL = [[-1,-1],[-1,1],[1,-1],[1,1]];
const ALL = STRAIGHT.concat(DIAGONAL);

function startState() {
  const b = Array(64).fill('');
  ['r','n','b','q','k','b','n','r'].forEach((t, c) => {
    b[c] = 'b' + t; b[8 + c] = 'bp'; b[48 + c] = 'wp'; b[56 + c] = 'w' + t;
  });
  return { b, turn: 'w', castle: { wk: true, wq: true, bk: true, bq: true }, ep: -1, half: 0 };
}

function attacked(b, sq, by) {
  const r = sq >> 3, c = sq & 7;
  const is = (rr, cc, types) => {
    if (!inside(rr, cc)) return false;
    const p = b[rr * 8 + cc];
    return p !== '' && p[0] === by && types.includes(p[1]);
  };
  const pawnRow = r + (by === 'w' ? 1 : -1);
  if (is(pawnRow, c - 1, 'p') || is(pawnRow, c + 1, 'p')) return true;
  if (KNIGHT.some(([dr, dc]) => is(r + dr, c + dc, 'n'))) return true;
  if (ALL.some(([dr, dc]) => is(r + dr, c + dc, 'k'))) return true;
  for (const [dirs, types] of [[STRAIGHT, 'rq'], [DIAGONAL, 'bq']]) {
    for (const [dr, dc] of dirs) {
      let rr = r + dr, cc = c + dc;
      while (inside(rr, cc)) {
        if (b[rr * 8 + cc]) { if (is(rr, cc, types)) return true; break; }
        rr += dr; cc += dc;
      }
    }
  }
  return false;
}

const inCheck = (s, color) => attacked(s.b, s.b.indexOf(color + 'k'), other(color));

function pseudoMoves(s) {
  const { b, turn } = s, moves = [];
  const add = (f, t, extra) => moves.push(Object.assign({ f, t }, extra));
  for (let f = 0; f < 64; f++) {
    const p = b[f];
    if (!p || p[0] !== turn) continue;
    const r = f >> 3, c = f & 7, type = p[1];
    if (type === 'p') {
      const dir = turn === 'w' ? -1 : 1, start = turn === 'w' ? 6 : 1, end = turn === 'w' ? 0 : 7;
      const pawnAdd = (t, extra) => {
        if ((t >> 3) === end) for (const promo of 'qrbn') add(f, t, { promo });
        else add(f, t, extra);
      };
      const one = f + dir * 8;
      if (inside(r + dir, c) && !b[one]) {
        pawnAdd(one);
        if (r === start && !b[one + dir * 8]) add(f, one + dir * 8, { double: true });
      }
      for (const dc of [-1, 1]) {
        if (!inside(r + dir, c + dc)) continue;
        const t = one + dc;
        if (b[t] && b[t][0] !== turn) pawnAdd(t);
        else if (t === s.ep) add(f, t, { enPassant: true });
      }
    } else if (type === 'n' || type === 'k') {
      for (const [dr, dc] of type === 'n' ? KNIGHT : ALL) {
        if (!inside(r + dr, c + dc)) continue;
        const t = f + dr * 8 + dc;
        if (!b[t] || b[t][0] !== turn) add(f, t);
      }
      const home = turn === 'w' ? 60 : 4;
      if (type === 'k' && f === home && !attacked(b, home, other(turn))) {
        const safe = sq => !b[sq] && !attacked(b, sq, other(turn));
        if (s.castle[turn + 'k'] && b[home + 3] === turn + 'r' && safe(home + 1) && safe(home + 2)) add(f, home + 2, { rook: [home + 3, home + 1] });
        if (s.castle[turn + 'q'] && b[home - 4] === turn + 'r' && safe(home - 1) && safe(home - 2) && !b[home - 3]) add(f, home - 2, { rook: [home - 4, home - 1] });
      }
    } else {
      for (const [dr, dc] of type === 'r' ? STRAIGHT : type === 'b' ? DIAGONAL : ALL) {
        let rr = r + dr, cc = c + dc;
        while (inside(rr, cc)) {
          const t = rr * 8 + cc;
          if (!b[t]) add(f, t);
          else { if (b[t][0] !== turn) add(f, t); break; }
          rr += dr; cc += dc;
        }
      }
    }
  }
  return moves;
}

function apply(s, m) {
  const b = s.b.slice(), p = b[m.f];
  let captured = b[m.t];
  b[m.t] = m.promo ? p[0] + m.promo : p;
  b[m.f] = '';
  if (m.enPassant) { const sq = m.t + (p[0] === 'w' ? 8 : -8); captured = b[sq]; b[sq] = ''; }
  if (m.rook) { b[m.rook[1]] = b[m.rook[0]]; b[m.rook[0]] = ''; }
  const castle = Object.assign({}, s.castle);
  if (p[1] === 'k') castle[p[0] + 'k'] = castle[p[0] + 'q'] = false;
  for (const [sq, key] of [[63, 'wk'], [56, 'wq'], [7, 'bk'], [0, 'bq']]) if (m.f === sq || m.t === sq) castle[key] = false;
  return {
    b, castle, captured, turn: other(s.turn),
    ep: m.double ? (m.f + m.t) / 2 : -1,
    half: p[1] === 'p' || captured ? 0 : s.half + 1
  };
}

// a move is legal only if it does not leave your own king in check
const legalMoves = s => pseudoMoves(s).filter(m => !inCheck(apply(s, m), s.turn));

/* ═════════ Computer player ═════════ */
const VALUE = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };

function evaluate(s) {
  let score = 0;
  for (let i = 0; i < 64; i++) {
    const p = s.b[i];
    if (!p) continue;
    const r = i >> 3, c = i & 7, centre = 7 - Math.abs(3.5 - r) - Math.abs(3.5 - c);
    let v = VALUE[p[1]];
    if (p[1] === 'n' || p[1] === 'b') v += centre * 6;
    if (p[1] === 'p') v += (p[0] === 'w' ? 6 - r : r - 1) * 6 + centre * 2;
    score += p[0] === s.turn ? v : -v;
  }
  return score;
}

const ordered = (s, moves) => moves.sort((x, y) => (VALUE[(s.b[y.t] || ' ')[1]] || 0) - (VALUE[(s.b[x.t] || ' ')[1]] || 0));

function search(s, depth, alpha, beta, extra) {
  const moves = legalMoves(s);
  if (!moves.length) return inCheck(s, s.turn) ? -100000 - depth : 0;
  let list = moves;
  if (depth <= 0) {                       // keep looking at captures so it doesn't give pieces away
    const now = evaluate(s);
    if (now >= beta || extra <= 0) return now;
    alpha = Math.max(alpha, now);
    list = moves.filter(m => s.b[m.t]);
  }
  for (const m of ordered(s, list)) {
    const score = -search(apply(s, m), depth - 1, -beta, -alpha, depth <= 0 ? extra - 1 : extra);
    if (score >= beta) return score;
    alpha = Math.max(alpha, score);
  }
  return alpha;
}

function bestMove(s, level) {
  const moves = ordered(s, legalMoves(s));
  if (level === 1 && Math.random() < 0.4) return moves[Math.floor(Math.random() * moves.length)];
  let best = moves[0], bestScore = -Infinity;
  for (const m of moves) {
    const next = apply(s, m);
    let score = -search(next, level - 1, -Infinity, -bestScore + 12, level === 1 ? 0 : 3);
    score += Math.random() * 10;
    if (score > bestScore) { best = m; bestScore = score; }
  }
  return best;
}

/* ═════════ Piece artwork ═════════ */
const BASE = '<rect x="22" y="77" width="56" height="14" rx="6"/>';
const SHAPES = {
  p: '<path d="M37 47Q50 40 63 47L58 53Q60 68 71 79H29Q40 68 42 53Z"/><circle cx="50" cy="31" r="15"/>',
  r: '<path d="M28 18h11v9h6v-9h10v9h6v-9h11v22l-8 7v22l8 10H28l8-10V47l-8-7Z"/><path class="line" d="M36 47h28M36 68h28"/>',
  n: '<path d="M31 79C31 63 40 57 47 49C40 50 35 57 27 55C20 52 19 45 25 39L43 23L45 10L55 20C71 25 77 43 74 60C73 68 71 73 71 79Z"/><path class="line" d="M56 27C65 34 67 47 63 58"/><circle class="eye" cx="44" cy="32" r="3.8"/>',
  b: '<path d="M40 62h20c1 7 7 11 11 17H29c4-6 10-10 11-17Z"/><path d="M50 21C68 33 70 51 59 62H41C30 51 32 33 50 21Z"/><circle cx="50" cy="15" r="7"/><path class="line" d="M55 31L45 49"/>',
  q: '<path d="M33 65h34l5 14H28Z"/><path d="M22 31L36 51L36 22L46 48L50 17L54 48L64 22L64 51L78 31L68 67H32Z"/><circle cx="22" cy="29" r="6"/><circle cx="36" cy="20" r="6"/><circle cx="50" cy="13" r="6"/><circle cx="64" cy="20" r="6"/><circle cx="78" cy="29" r="6"/>',
  k: '<path d="M35 64h30l7 15H28Z"/><path d="M50 36C58 24 81 30 77 48C74 57 67 59 65 66H35C33 59 26 57 23 48C19 30 42 24 50 36Z"/><path d="M45 5h10v8h8v10h-8v12H45V23h-8V13h8Z"/><path class="line" d="M35 58Q50 52 65 58"/>'
};
function art(piece) {
  const white = piece[0] === 'w', fill = white ? 'url(#gw)' : 'url(#gb)', edge = white ? '#0d2b4e' : '#e8f4ff';
  const body = (SHAPES[piece[1]] + BASE)
    .replace(/class="line"/g, `style="fill:none;stroke:${white ? '#3f86c4' : '#aed6f6'}"`)
    .replace(/class="eye"/g, `style="fill:${edge};stroke:none"`);
  return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="92" rx="33" ry="6" fill="#0d2b4e" opacity=".22"/>
    <g fill="${fill}" stroke="${edge}" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">${body}</g></svg>`;
}
$('hero').innerHTML = art('wn');

/* ═════════ Game flow ═════════ */
const COLORS = { w: '#e11d48', b: '#123cf3' };
let mode = 'ai', level = 3, view = 'face-bottom', names = { w: me.name, b: 'Computer' };
let state, history = [], selected = -1, targets = [], over = false, thinking = false, ready = false;
let pending = null, timers = [], boardAngle = 0, pieces = [];

const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const stopTimers = () => { timers.forEach(clearTimeout); timers = []; };

$('levelSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  level = Number(btn.dataset.level);
  [...$('levelSeg').children].forEach(x => x.classList.toggle('on', x === btn));
});

async function openFriend() {
  const choice = await G66.friend(me);
  if (choice) begin('friend', choice.name, choice.view);
}
function startAI() { begin('ai', 'Computer', G66.saved('face-bottom')); }
async function begin(kind, opponent, chosen) {
  mode = kind; view = chosen; names = { w: me.name, b: opponent };
  show('game');
  newGame(true);
  ready = false;
  await G66.intro([{ name: names.w, color: COLORS.w }, { name: names.b, color: COLORS.b }], view);
  ready = true;
  deal();
}

function newGame(waitForIntro) {
  stopTimers();
  state = startState(); history = []; selected = -1; targets = [];
  over = false; thinking = false; pending = null; ready = true;
  $('endOverlay').hidden = true; $('promoOverlay').hidden = true;
  buildBoard();
  syncPieces();
  render();
  if (waitForIntro !== true) deal();
}
// pieces drop onto the board one after another
function deal() {
  pieces.forEach((el, sq) => {
    if (!el) return;
    el.classList.add('deal');
    el.querySelector('svg').style.animationDelay = ((sq & 7) * 35 + (sq >> 3) * 12) + 'ms';
  });
  later(() => pieces.forEach(el => { if (el) { el.classList.remove('deal'); el.querySelector('svg').style.animationDelay = ''; } }), 900);
}

/* ── who sits where ── */
const seatOf = color => G66.VIEWS[view].seats[color === 'w' ? 0 : 1];
const isFace = () => G66.VIEWS[view].face;
// is this player's side of the screen upside down?
const turnedAround = color => isFace() && seatOf(mode === 'ai' ? 'w' : color) === 'top';
// which way the board should be turned right now (0 = white at the bottom)
function wantedAngle() {
  if (isFace()) return seatOf('w') === 'bottom' ? 0 : 180;
  if (mode === 'ai') return 0;
  return state.turn === 'w' ? 0 : 180;      // side by side: the mover's army comes to the bottom
}

function turnBoard() {
  const want = wantedAngle();
  if (((boardAngle - want) % 360 + 360) % 360 === 0) return false;
  boardAngle += 180;
  const frame = $('frame');
  frame.classList.remove('spin'); void frame.offsetWidth; frame.classList.add('spin');
  return true;
}
function orient() {
  $('board').style.transform = `rotate(${boardAngle}deg)`;
  pieces.forEach(el => { if (el) face(el); });
  document.querySelectorAll('.coord').forEach(c => { c.style.transform = `rotate(${-boardAngle}deg)`; });
}
function face(el) {
  const facing = turnedAround(el.dataset.p[0]) ? 180 : 0;
  el.firstChild.style.transform = `rotate(${facing - boardAngle}deg)`;
}

/* ── board and pieces ── */
function buildBoard() {
  const board = $('board');
  board.innerHTML = ''; pieces = Array(64).fill(null);
  boardAngle = wantedAngle();
  for (let sq = 0; sq < 64; sq++) {
    const r = sq >> 3, c = sq & 7;
    const el = document.createElement('button');
    el.className = 'sq' + ((r + c) % 2 ? ' d' : '');
    el.dataset.sq = sq;
    el.setAttribute('aria-label', 'abcdefgh'[c] + (8 - r));
    if (c === 0) el.insertAdjacentHTML('beforeend', `<span class="coord rank">${8 - r}</span>`);
    if (r === 7) el.insertAdjacentHTML('beforeend', `<span class="coord file">${'abcdefgh'[c]}</span>`);
    el.onclick = () => tap(sq);
    board.appendChild(el);
  }
}
const spot = sq => `translate(${(sq & 7) * 100}%,${(sq >> 3) * 100}%)`;
function makePiece(p, sq) {
  const el = document.createElement('div');
  el.className = 'pc'; el.dataset.p = p;
  el.style.transform = spot(sq);
  el.innerHTML = `<div class="turner">${art(p)}</div>`;
  $('board').appendChild(el);
  face(el);
  return el;
}
function syncPieces() {
  pieces.forEach(el => el && el.remove());
  pieces = state.b.map((p, sq) => p ? makePiece(p, sq) : null);
  orient();
}
function slide(from, to) {
  const el = pieces[from];
  pieces[to] = el; pieces[from] = null;
  el.classList.remove('sel'); el.classList.add('moving');
  el.style.transform = spot(to);
  later(() => el.classList.remove('moving'), 360);
  return el;
}
function remove(sq) {
  const el = pieces[sq];
  if (!el) return;
  pieces[sq] = null;
  el.classList.add('dead');
  const spark = document.createElement('div');
  spark.className = 'spark';
  spark.style.transform = spot(sq);
  $('board').appendChild(spark);
  setTimeout(() => { el.remove(); spark.remove(); }, 460);
}

function positionKey(s) { return s.b.join(',') + s.turn + JSON.stringify(s.castle) + s.ep; }

function result() {
  if (!legalMoves(state).length) {
    return inCheck(state, state.turn)
      ? { winner: other(state.turn), reason: 'Checkmate' }
      : { winner: null, reason: 'Stalemate' };
  }
  const rest = state.b.filter(p => p && p[1] !== 'k');
  if (!rest.length || (rest.length === 1 && 'nb'.includes(rest[0][1]))) return { winner: null, reason: 'Not enough pieces to checkmate' };
  if (state.half >= 100) return { winner: null, reason: '50 moves without a capture or pawn move' };
  const key = positionKey(state);
  if (history.filter(h => positionKey(h.state) === key).length >= 2) return { winner: null, reason: 'Same position three times' };
  return null;
}

function tap(sq) {
  if (!ready || over || thinking || pending || (mode === 'ai' && state.turn === 'b')) return;
  const options = targets.filter(m => m.t === sq);
  if (options.length) {
    if (options[0].promo) return askPromo(options);
    return play(options[0]);
  }
  const p = state.b[sq];
  if (p && p[0] === state.turn && sq !== selected) {
    selected = sq;
    targets = legalMoves(state).filter(m => m.f === sq);
    G66.buzz(8);
  } else { selected = -1; targets = []; }
  render();
}

function askPromo(options) {
  pending = options;
  const color = state.turn;
  $('promo').innerHTML = '';
  options.forEach(m => {
    const btn = document.createElement('button');
    btn.dataset.piece = m.promo;
    btn.innerHTML = art(color + m.promo);
    btn.onclick = () => { pending = null; $('promoOverlay').hidden = true; play(m); };
    $('promo').appendChild(btn);
  });
  $('promoOverlay').classList.toggle('rot', turnedAround(color));
  $('promoOverlay').hidden = false;
}
function cancelPromo() { pending = null; $('promoOverlay').hidden = true; }

const CHEERS = { p: '+1', n: 'Nice! +3', b: 'Nice! +3', r: 'Great! +5', q: 'WOW! +9' };

function play(move) {
  const mover = state.turn;
  history.push({ state, move });
  state = apply(state, move);
  selected = -1; targets = []; thinking = false;

  // animate what changed
  const victim = move.enPassant ? move.t + (mover === 'w' ? 8 : -8) : move.t;
  if (state.captured) {
    remove(victim);
    G66.pop(CHEERS[state.captured[1]], $('board').children[move.t], { color: COLORS[mover], flip: turnedAround(mover) });
    G66.buzz(35);
  } else G66.buzz(12);
  const moved = slide(move.f, move.t);
  if (move.rook) slide(move.rook[0], move.rook[1]);
  if (move.promo) later(() => { moved.dataset.p = mover + move.promo; moved.innerHTML = `<div class="turner">${art(moved.dataset.p)}</div>`; moved.classList.add('crown'); face(moved); }, 300);

  const end = result();
  over = !!end;
  render();
  if (end) return finish(end);
  const check = inCheck(state, state.turn);
  if (check) later(() => G66.banner('CHECK!', { color: '#dc2626', flip: turnedAround(state.turn) }), 250);

  if (mode === 'ai') {
    if (state.turn === 'b') {
      thinking = true;
      render();
      later(() => play(bestMove(state, level)), 650);
    }
  } else if (!isFace()) {
    // side by side: swing the board round to the next player
    later(() => {
      if (turnBoard()) orient();
      if (!check) G66.banner(`${names[state.turn]}'s turn`, { color: COLORS[state.turn] });
    }, 520);
  }
}

function finish(end) {
  const lost = mode === 'ai' && end.winner === 'b';
  $('endIcon').textContent = !end.winner ? '🤝' : lost ? '🤖' : '🏆';
  if (end.winner) G66.wave($('endTitle'), `${names[end.winner]} wins!`);
  else $('endTitle').textContent = 'Draw';
  $('endReason').textContent = end.reason;
  if (end.reason === 'Checkmate') later(() => G66.banner('CHECKMATE!', { color: COLORS[end.winner], flip: turnedAround(end.winner) }), 350);
  later(() => {
    $('endOverlay').classList.toggle('rot', turnedAround(end.winner || state.turn));
    $('endOverlay').hidden = false;
    if (end.winner && !lost) G66.celebrate();
  }, 1500);
}

function undo() {
  if (!history.length || thinking) return;
  stopTimers();
  let last = history.pop();
  // against the computer, go back to your own turn
  if (mode === 'ai' && last.state.turn === 'b' && history.length) last = history.pop();
  state = last.state;
  selected = -1; targets = []; over = false; pending = null;
  $('endOverlay').hidden = true;
  turnBoard();
  syncPieces();
  render();
}

async function changeView() {
  if (!ready || pending) return;
  const chosen = await G66.pickView(names.w, names.b, view);
  if (!chosen) return;
  view = chosen;
  turnBoard();
  orient();
  render();
}
G66.onP(() => { if ($('game').classList.contains('active') && $('endOverlay').hidden && $('promoOverlay').hidden) changeView(); });

function askRestart() { if (!history.length || over || confirm('Restart this game?')) newGame(); }
function askLeave() {
  if (history.length && !over && !confirm('Leave this game?')) return;
  stopTimers(); thinking = false;
  $('endOverlay').hidden = true;
  show('setup');
}

function playerCard(color) {
  const el = $('player-' + color);
  const taken = [];
  history.forEach((h, i) => {
    const after = i + 1 < history.length ? history[i + 1].state : state;
    if (h.state.turn === color && after.captured) taken.push(after.captured);
  });
  const total = c => state.b.reduce((n, p) => n + (p && p[0] === c ? VALUE[p[1]] : 0), 0);
  const lead = Math.round((total(color) - total(other(color))) / 100);
  if (!el.firstChild) el.innerHTML = `<div class="avatar ${color}">${art(color + 'k')}</div>
    <div class="who"><div class="pname"></div><div class="taken"></div></div><span class="tag">TURN</span>`;
  const active = state.turn === color && !over;
  el.className = 'player' + (active ? ' turn' : '') + (turnedAround(color) ? ' rot' : '');
  el.style.gridArea = seatOf(color);
  // the name of whoever is playing does a little wave
  const name = el.querySelector('.pname'), key = names[color] + active;
  if (name.dataset.key !== key) {
    name.dataset.key = key;
    if (active) G66.wave(name, names[color]); else name.textContent = names[color];
  }
  el.querySelector('.taken').innerHTML = taken.sort((a, b) => VALUE[b[1]] - VALUE[a[1]]).map(art).join('') + (lead > 0 ? `<em>+${lead}</em>` : '');
}

function render() {
  const squares = $('board').children;
  const last = history.length ? history[history.length - 1].move : null;
  const checked = inCheck(state, state.turn) ? state.b.indexOf(state.turn + 'k') : -1;
  for (let sq = 0; sq < 64; sq++) {
    const el = squares[sq], target = targets.find(m => m.t === sq);
    el.classList.toggle('last', !!last && (sq === last.f || sq === last.t));
    el.classList.toggle('sel', sq === selected);
    el.classList.toggle('check', sq === checked);
    el.classList.toggle('move', !!target && !state.b[sq] && !target.enPassant);
    el.classList.toggle('take', !!target && (!!state.b[sq] || !!target.enPassant));
    if (pieces[sq]) pieces[sq].classList.toggle('sel', sq === selected);
  }
  $('game').classList.toggle('face', isFace());
  $('game').classList.toggle('side', !isFace());
  playerCard('w');
  playerCard('b');
  const status = $('status');
  status.classList.toggle('alert', checked >= 0);
  status.classList.toggle('rot', turnedAround(state.turn) && !over);
  status.textContent = over ? 'Game over'
    : thinking ? 'Computer is thinking...'
    : (checked >= 0 ? 'Check! ' : '') + `${names[state.turn]}'s turn (${state.turn === 'w' ? 'White' : 'Black'})`;
  $('undoBtn').disabled = !history.length || thinking;
}
</script>
</body>
</html>
