<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>UniEscape · 66Games</title>
  <style>
    :root {
      --bg-outer: #0d1b2e;
      --surface: #ffffff;
      --glass: rgba(255, 255, 255, 0.92);
      --border: #d5e2f2;
      --border-strong: #b9cde6;
      --navy: #0f2547;
      --blue: #123cf3;
      --blue-dark: #1d4ed8;
      --gold: #d97706;
      --crimson: #dc2626;
      --emerald: #059669;
      --text: #111827;
      --muted: #5b6b82;
      --shadow-lg: 0 16px 36px rgba(15, 37, 71, 0.16);
      --shadow-sm: 0 3px 10px rgba(15, 37, 71, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #162c4d 0%, var(--bg-outer) 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    button, a {
      font: inherit;
      border: none;
      background: none;
      cursor: pointer;
      touch-action: manipulation;
      text-decoration: none;
    }

    .ic {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #f5f9ff 0%, #e7f0fb 100%);
            overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.42);
    }

    @media (min-width: 520px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .app {
        height: min(94dvh, 850px);
        border-radius: 26px;
        border: 1px solid rgba(255, 255, 255, 0.22);
      }
    }

    [hidden] { display: none !important; }
    .canvas-wrap { position: relative; flex: 1; min-height: 0; width: 100%; overflow: hidden; background: #bae6fd; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }

    /* ══════════ TOP BAR (start screen): 66Notes | UniEscape | sound ══════════ */
    .header {
      position: absolute; z-index: 9; left: 10px; right: 10px; top: max(10px, env(safe-area-inset-top));
      height: 50px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-sm);
    }
    .brand-left { font-size: 0.98rem; font-weight: 800; color: var(--navy); justify-self: start; padding: 8px 4px; }
    .brand-left span { color: var(--blue); }
    .brand-center { font-size: 1.3rem; font-weight: 900; letter-spacing: -0.4px; }
    .brand-center .uni { color: #0b1220; }
    .brand-center .escape { color: var(--blue); }
    .icon-btn { width: 36px; height: 36px; justify-self: end; border-radius: 10px; background: #f1f5f9; border: 1px solid var(--border); color: var(--navy); display: grid; place-items: center; }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.muted { color: var(--muted); opacity: 0.7; }

    /* ══════════ IN-GAME HUD: progress, hearts, score, semester ══════════ */
    .hud { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
    .hud-top { position: absolute; left: 10px; right: 10px; top: max(10px, env(safe-area-inset-top)); }
    .progress-box { background: var(--glass); border: 1px solid var(--border); border-radius: 13px; padding: 10px 12px; box-shadow: var(--shadow-sm); }
    .progress-track { height: 8px; border-radius: 99px; background: #dce8f8; overflow: hidden; position: relative; }
    .progress-track::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 12 - 2px), #fff calc(100% / 12 - 2px) calc(100% / 12)); }
    .progress-fill { height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #2563eb, #f59e0b); transition: transform 0.25s ease; }
    .hud-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .hearts { display: flex; gap: 5px; margin-right: auto; flex-wrap: wrap; }
    .hearts svg { width: 30px; height: 27px; fill: #e11d2a; stroke: #5c0a10; stroke-width: 0.55; shape-rendering: crispEdges; }
    .hearts.many { gap: 3px; }
    .hearts.many svg { width: clamp(19px, 5.6vw, 22px); height: auto; aspect-ratio: 10 / 9; }
    .hearts svg.lost { fill: rgba(255, 255, 255, 0.55); }
    .score-pill { min-width: 108px; height: 40px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--glass); border: 2px solid var(--border-strong); border-radius: 12px; font-size: 0.9rem; font-weight: 800; color: var(--navy); }
    .score-pill b { font-size: 1.2rem; color: var(--blue); }
    .pause-btn { pointer-events: auto; width: 40px; height: 40px; border-radius: 12px; background: var(--glass); border: 2px solid var(--border-strong); color: var(--navy); display: grid; place-items: center; }
    .pause-btn:active { transform: scale(0.92); }
    .sem-label { position: absolute; left: 14px; right: 14px; bottom: max(8px, env(safe-area-inset-bottom)); height: 38px; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 2px solid var(--border-strong); border-radius: 12px; font-size: 1rem; font-weight: 900; color: var(--navy); box-shadow: var(--shadow-sm); }

    /* ══════════ START SCREEN ══════════ */
    .start-ui { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 9px; padding: 10px 10px max(10px, env(safe-area-inset-bottom)); pointer-events: none; }
    .picker { pointer-events: auto; background: rgba(255,255,255,0.92); border: 1px solid var(--border-strong); border-radius: 16px; padding: 6px 8px 8px; text-align: center; max-width: 100%; }
    .picker small { display: block; font-size: 0.68rem; font-weight: 800; color: var(--navy); margin-bottom: 5px; }
    .swatches { display: flex; justify-content: center; gap: clamp(4px, 1.6vw, 8px); }
    .swatch { width: clamp(28px, 8.2vw, 33px); aspect-ratio: 1; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--border-strong); transition: transform 0.15s; }
    .swatch.on { transform: scale(1.18); box-shadow: 0 0 0 3px var(--navy); }
    .tap-btn { pointer-events: auto; background: var(--navy); color: #fff; border: 2px solid #60a5fa; padding: 11px 34px; border-radius: 999px; font-size: 1rem; font-weight: 900; letter-spacing: 0.6px; box-shadow: 0 8px 20px rgba(15,37,71,0.35); animation: pulseTap 1.3s ease-in-out infinite; }
    @keyframes pulseTap { 50% { transform: scale(1.06); } }

    .lb-card { width: 100%; background: rgba(255,255,255,0.95); border: 1px solid var(--border-strong); border-radius: 18px; padding: 9px 11px 11px; box-shadow: var(--shadow-lg); pointer-events: auto; }
    .lb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .lb-head h3 { font-size: 0.76rem; font-weight: 900; color: var(--navy); text-transform: uppercase; letter-spacing: 0.5px; }
    .lb-status { font-size: 0.64rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .lb-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .lb-row { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 3px 10px; border-radius: 9px; background: #f1f5f9; border: 1.5px solid transparent; font-size: 0.8rem; font-weight: 800; color: var(--navy); }
    .lb-row.top { background: #fef3c7; color: #92400e; }
    .lb-row.me { border-color: var(--blue); }
    .lb-name { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-weight: 900; color: var(--blue); }
    .lb-gem { width: 15px; height: 15px; flex-shrink: 0; fill: #fbbf24; stroke: #92400e; stroke-width: 1.6; }
    .lb-note { justify-content: center; color: var(--muted); font-weight: 700; }
    @media (max-height: 640px) {
      .lb-row { min-height: 23px; padding: 1px 10px; font-size: 0.72rem; }
      .lb-list { gap: 3px; }
      .tap-btn { padding: 8px 28px; font-size: 0.9rem; }
      .start-ui { gap: 6px; }
    }

    .save-note { font-size: 0.72rem; font-weight: 800; color: var(--muted); margin-bottom: 4px; }

    /* ══════════ MODALS (PAUSE / END) ══════════ */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 22, 40, 0.78);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay[hidden] { display: none; }

    .modal-card {
      width: 100%;
      max-width: 360px;
      max-height: 92%;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 22px;
      padding: 20px 18px 18px;
      text-align: center;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38);
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .modal-sub {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .modal-detail {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .score-box {
      background: #f4f8fe;
      border: 1px solid #dce8f8;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .acad-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .acad-cell {
      background: #ffffff;
      border: 1px solid #e2ebf7;
      border-radius: 10px;
      padding: 7px 4px;
    }
    .acad-cell small {
      display: block;
      font-size: 0.54rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
    }
    .acad-cell b {
      display: block;
      font-size: 1rem;
      font-weight: 900;
      color: var(--navy);
      margin-top: 2px;
    }

    .btn {
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--blue); color: #ffffff; }
    .btn-gold { background: var(--gold); color: #ffffff; }
    .btn-secondary { background: #ffffff; color: var(--navy); border: 2px solid var(--border); }
  </style>
</head>
<body>
<div class="app">
  <div class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>

    <!-- TOP BAR (start screen) -->
    <header class="header" id="header">
      <a href="index.html" class="brand-left">66<span>Notes</span></a>
      <div class="brand-center"><span class="uni">Uni</span><span class="escape">Escape</span></div>
      <button class="icon-btn" id="soundBtn" aria-label="Toggle sound"></button>
    </header>

    <!-- IN-GAME HUD -->
    <div class="hud" id="hud" hidden>
      <div class="hud-top">
        <div class="progress-box"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
        <div class="hud-row">
          <div class="hearts" id="hearts"></div>
          <button class="pause-btn" id="pauseBtn" aria-label="Pause game"><svg class="ic" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg></button>
          <div class="score-pill">Score: <b id="scoreVal">0</b></div>
        </div>
      </div>
      <div class="sem-label" id="semLabel">1st Year - 1st Semester</div>
    </div>

    <!-- START SCREEN -->
    <div class="start-ui" id="startUI">
      <div class="picker">
        <small id="playerTag">Pick your bird</small>
        <div class="swatches" id="swatches"></div>
      </div>
      <button class="tap-btn" id="tapBtn">TAP TO START</button>
      <div class="lb-card">
        <div class="lb-head">
          <h3>Leaderboard</h3>
          <span class="lb-status" id="lbStatus">Loading...</span>
        </div>
        <ol class="lb-list" id="lbList"></ol>
      </div>
    </div>
  </div>

  <!-- PAUSE OVERLAY -->
  <div class="overlay" id="pauseOverlay" hidden>
    <div class="modal-card">
      <h2 class="modal-title">Game Paused</h2>
      <p class="modal-sub">Take a quick breather before the next exam.</p>
      <button class="btn btn-primary" id="resumeBtn">Resume</button>
      <button class="btn btn-secondary" id="pauseSound">Sound: On</button>
      <button class="btn btn-secondary" id="restartBtn">Restart</button>
      <a href="index.html" class="btn btn-secondary">Back to Hub</a>
    </div>
  </div>

  <!-- END / VICTORY OVERLAY -->
  <div class="overlay" id="endOverlay" hidden>
    <div class="modal-card">
      <h2 class="modal-title" id="endTitle">Game Over</h2>
      <p class="modal-sub" id="endSub"></p>
      <p class="modal-detail" id="endDetail"></p>

      <div class="score-box">
        <div class="acad-grid">
          <div class="acad-cell"><small>Score</small><b id="endScore" style="color:var(--blue)">0</b></div>
          <div class="acad-cell"><small>Your best</small><b id="endBest" style="color:var(--emerald)">0</b></div>
        </div>
      </div>
      <p class="save-note" id="saveNote"></p>

      <button class="btn btn-primary" id="againBtn">Play Again</button>
      <a href="index.html" class="btn btn-secondary">Back to Hub</a>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     LEADERBOARD ADDRESS
     GitHub Pages is https, and browsers block https pages from calling
     an http server. Paste your https link (the Cloudflare Worker) here:
     ========================================================= */
  const SERVER_HTTPS = '';   // e.g. 'https://uniescape.yourname.workers.dev'
  const SERVER_HTTP = 'http://66notes-game.enzonic.dev:26496';
  const API_URL = SERVER_HTTPS.replace(/\/+$/, '') || (location.protocol === 'https:' ? '' : SERVER_HTTP);

  /* =========================================================
     PLAYER (the 66Games login)
     ========================================================= */
  let user = null;
  try { user = JSON.parse(localStorage.getItem('66games_user')); } catch {}
  if (!user || !user.name) { location.replace('index.html'); user = { roll: '', name: 'Player' }; }
  const playerName = user.name;
  const playerId = String(user.roll || '');

  const WHO = `${playerId}_${playerName}`;
  const STORAGE_BEST = 'uniescape_best_v5_' + WHO;
  const STORAGE_PENDING = 'uniescape_unsent_v5_' + WHO;
  const STORAGE_BIRD = 'uniescape_bird_v1';
  const STORAGE_MUTE = 'uniescape_muted_v4';

  const $ = id => document.getElementById(id);
  const canvas = $('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  // older phones do not have roundRect
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  $('playerTag').textContent = `${playerName}, pick your bird`;

  function loadNum(key, fallback = 0) {
    try { return parseInt(localStorage.getItem(key), 10) || fallback; } catch { return fallback; }
  }
  function saveVal(key, val) {
    try { localStorage.setItem(key, String(val)); } catch {}
  }

  /* =========================================================
     BIRD COLOURS
     ========================================================= */
  const BIRDS = {
    blue:   { body: '#2563eb', line: '#0f172a', belly: '#bfdbfe' },
    red:    { body: '#ef4444', line: '#7f1d1d', belly: '#fecaca' },
    green:  { body: '#22c55e', line: '#14532d', belly: '#bbf7d0' },
    yellow: { body: '#facc15', line: '#713f12', belly: '#fef9c3' },
    pink:   { body: '#ec4899', line: '#831843', belly: '#fbcfe8' },
    purple: { body: '#8b5cf6', line: '#4c1d95', belly: '#ddd6fe' },
    cyan:   { body: '#06b6d4', line: '#164e63', belly: '#cffafe' },
    black:  { body: '#334155', line: '#020617', belly: '#94a3b8' }
  };
  let birdName = 'blue';
  try { const b = localStorage.getItem(STORAGE_BIRD); if (BIRDS[b]) birdName = b; } catch {}

  /* =========================================================
     LEADERBOARD (top 5)
     ========================================================= */
  function boardNote(text) {
    const li = document.createElement('li');
    li.className = 'lb-row lb-note';
    li.textContent = text;
    $('lbList').replaceChildren(li);
  }

  function boardStatus(text) {
    $('lbStatus').textContent = `Your best: ${loadNum(STORAGE_BEST, 0)} · ${text}`;
  }

  function renderLeaderboard(scores) {
    if (!Array.isArray(scores) || !scores.length) return boardNote('No scores yet. Be the first!');
    const rows = scores.slice(0, 5).map((entry, idx) => {
      const li = document.createElement('li');
      const mine = String(entry.name).toLowerCase() === playerName.toLowerCase() && (!entry.id || entry.id === playerId);
      li.className = 'lb-row' + (idx === 0 ? ' top' : '') + (mine ? ' me' : '');
      const name = document.createElement('span');
      name.className = 'lb-name';
      name.textContent = entry.name || 'Player';
      const points = document.createElement('span');
      points.className = 'lb-score';
      points.textContent = entry.score;
      li.append(name, points);
      if (idx === 0) li.insertAdjacentHTML('beforeend', '<svg class="lb-gem" viewBox="0 0 24 24"><path d="M12 2l10 10-10 10L2 12z"/></svg>');
      return li;
    });
    $('lbList').replaceChildren(...rows);
  }

  async function api(path, options) {
    const stop = new AbortController();
    const timer = setTimeout(() => stop.abort(), 8000);
    try {
      const res = await fetch(API_URL + path, Object.assign({ signal: stop.signal, cache: 'no-store' }, options));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  }

  async function fetchLeaderboard() {
    if (!API_URL) {
      boardStatus('Not set up');
      return boardNote('Leaderboard needs the https server link');
    }
    boardStatus('Syncing...');
    try {
      await sendPending().catch(() => {});
      renderLeaderboard(await api('/top5'));
      boardStatus('Live');
    } catch {
      boardStatus('Offline');
      boardNote('Cannot reach the leaderboard server');
    }
  }

  // a score that could not be sent is kept and sent next time
  async function sendPending() {
    const score = loadNum(STORAGE_PENDING, 0);
    if (!score || !API_URL) return null;
    const data = await api('/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: playerId, name: playerName, score })
    });
    if (loadNum(STORAGE_PENDING, 0) === score) { try { localStorage.removeItem(STORAGE_PENDING); } catch {} }
    return data;
  }

  async function submitScore(finalScore) {
    const note = $('saveNote');
    if (finalScore <= 0) { note.textContent = ''; return; }
    saveVal(STORAGE_PENDING, Math.max(finalScore, loadNum(STORAGE_PENDING, 0)));
    if (!API_URL) { note.textContent = 'Saved on this phone (leaderboard not set up)'; return; }
    note.textContent = 'Saving to leaderboard...';
    try {
      const data = await sendPending();
      if (data && data.top5) renderLeaderboard(data.top5);
      note.textContent = '✓ Saved to leaderboard';
    } catch {
      note.textContent = 'Offline. Your score will be sent next time';
    }
  }

  /* =========================================================
     WEB AUDIO SOUND EFFECTS
     ========================================================= */
  const Sound = (() => {
    let ac = null, noise = null;
    let muted = loadNum(STORAGE_MUTE, 0) === 1;

    function ctxA() {
      if (muted) return null;
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
        return ac;
      } catch { return null; }
    }

    function tone(f1, f2, dur, type = 'sine', vol = 0.09, delay = 0) {
      const a = ctxA();
      if (!a) return;
      const t = a.currentTime + delay;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, t);
      if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }

    function makeNoise(a) {
      const len = Math.floor(a.sampleRate * 0.24);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.42));
      return buf;
    }

    function crash() {
      const a = ctxA();
      if (!a) return;
      if (!noise) noise = makeNoise(a);
      const src = a.createBufferSource(); src.buffer = noise;
      const flt = a.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 1350;
      const g = a.createGain(); g.gain.setValueAtTime(0.18, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.24);
      src.connect(flt); flt.connect(g); g.connect(a.destination);
      src.start();
    }

      isMuted: () => muted,
      warmUp() { const a = ctxA(); if (a && !noise) noise = makeNoise(a); },

    if (state === 'start') {
      startRunFromTap();
      return;

    player.vy = -410;
    player.rot = -0.4;

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';

  function resumeGame() {
    if (state !== 'paused') return;
    $('pauseOverlay').hidden = true;
    state = 'playing';

    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);

  function openEndModal(won) {
    state = won ? 'won' : 'over';

    if (score > best) {
      best = score;
      saveVal(STORAGE_BEST, best);
    }
    updateHud();

    $('endScore').textContent = score;
    $('endBest').textContent = best;

  /* =========================================================

     ========================================================= */
  function spawnNextObstacle() {
    if (spawnSemester >= TOTAL_SEMESTERS) return;
    const type = SEMESTER_SEQUENCE[spawnStep];
    const year = Math.floor(spawnSemester / 3);
    const moving = type === 'MID';

    let gap = 194 - year * 6;
    if (type === 'MID') gap -= 7;
    if (type === 'FINAL') gap -= 8;
    gap = Math.max(162, gap);

    const minCenter = 136 + gap * 0.5;
    const maxCenter = H - GROUND_H - 92 - gap * 0.5;
    const gapY = rand(minCenter, maxCenter);

    obstacles.push({
      x: W + 42,
      w: WIDTHS[type],
      gapY, baseY: gapY, gap, type,
      semIndex: spawnSemester, stepIndex: spawnStep,
      moving, phase: rand(0, Math.PI * 2),
      amp: moving ? (year === 3 ? rand(44, 60) : rand(32, 48)) : 0,
      passed: false, topBroken: false, bottomBroken: false,
      topBreakAnim: 0, bottomBreakAnim: 0
    });

    spawnStep++;
    if (spawnStep >= OBSTACLES_PER_SEM) {
      spawnStep = 0;
      spawnSemester++;
    }
  }

  function handleSemesterComplete(completedSem) {
    const completedYear = Math.floor(completedSem / 3) + 1;
    const isEndOfYear = (completedSem + 1) % 3 === 0;
    const isLastSem = completedSem >= TOTAL_SEMESTERS - 1;
    const bonus = isEndOfYear ? YEAR_BONUS[completedYear - 1] : 0;
    score = Math.min(100, score + SEMESTER_MARKS + bonus);

    addPopup(`+${SEMESTER_MARKS} SEMESTER PASSED`, W / 2, H * 0.3, '#fef08a', '#b45309', true);
    if (bonus) addPopup(`+${bonus} YEAR BONUS`, W / 2, H * 0.37, '#ffffff', '#047857', true);

    if (isLastSem) {
      // Graduation! Trigger victory overtaking animation in Sem 12 sunset
      currentSemester = TOTAL_SEMESTERS - 1;
      clearedInSem = OBSTACLES_PER_SEM;
      obstacles = [];
      state = 'victory_anim';
      cutsceneTimer = 3.2;
      spawnVictoryBirds();
      spawnConfetti(80, H * 0.35);
      Sound.victory();
      pushBanner('YEAR 4 SURVIVED · GRADUATED!', 'OVERTAKING THE FLOCK!', '#d97706');
      updateHud();
      return;
    }

    currentSemester = completedSem + 1;
    clearedInSem = 0;
    Sound.semClear();
    spawnConfetti(26, H * 0.2);

    if (isEndOfYear) {
      // Survived a full Year: +1 Extra Life + top popup + speed increase!
      lives = Math.min(maxLivesCap, lives + 1);
      Sound.lifeUp();
      addPopup('+1 ♥ EXTRA LIFE', W / 2, H * 0.46, '#ffffff', '#dc2626', true);
      pushBanner(
        `YEAR ${completedYear} SURVIVED!`,
        `+1 ♥ LIFE · YEAR ${completedYear + 1} SPEED UP!`,
        '#059669'
      );
      updateHud(true);
    } else {
      pushBanner(
        `YEAR ${Math.floor(currentSemester / 3) + 1} · SEMESTER ${currentSemester + 1}`,
        `${SEM_THEMES[currentSemester].name.toUpperCase()} · CHECKPOINT SAVED`,
        '#123cf3'
      );
      updateHud();
    }
  }

  function applyDamage(dmg, sourceType, obstacle = null, hitTop = false) {
    if (invulnerable > 0) return;

    lives = Math.max(0, lives - dmg);
    invulnerable = 2.6;
    stunTimer = 0.38;
    shakeTimer = 0.3;
    flashAlpha = 0.38;
    Sound.hit();

    addPopup(`-${dmg} ♥`, player.x, player.y - 30, '#ffffff', '#dc2626', false);

    if (obstacle) {
      if (hitTop) obstacle.topBroken = true;
      else obstacle.bottomBroken = true;
      spawnTowerBreakDebris(obstacle, hitTop);
      player.vy = hitTop ? 135 : -235;
    } else {
      player.vy = -260;
    }

    updateHud(true);

    if (lives <= 0) {
      // Clear nearby walls so the 4 birds in the sky animation is unobstructed!
      obstacles = [];
      state = 'dying';
      cutsceneTimer = 2.1;
      spawnDeathSkyBirds();
      Sound.gameOver();
    }
  }

  /* =========================================================
     UPDATE LOOP
     ========================================================= */
  function update(dt) {
    elapsed += dt;

    // Smoothly transition sky theme to current semester
    themePos += (currentSemester - themePos) * Math.min(1, dt * 1.4);

    // Rain update
    const curRain = SEM_THEMES[clamp(Math.round(themePos), 0, 11)].rain;
    if (curRain > 0.05) {
      for (const r of raindrops) {
        r.y += r.spd * dt * curRain;
        r.x -= 95 * dt;
        if (r.y > H) { r.y = -20; r.x = Math.random() * (W + 120); }
        if (r.x < -20) r.x = W + 40;
      }
    }

    // Confetti, particles, debris, popups, banners
    for (const c of confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 240 * dt; c.rot += c.vrot * dt; c.life -= dt; }
    confetti = confetti.filter(c => c.life > 0);

    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);

    for (const d of debris) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 540 * dt; d.rot += d.vrot * dt; d.life -= dt; }
    debris = debris.filter(d => d.life > 0);

    for (const pop of popups) { pop.y += pop.vy * dt; pop.life -= dt; }
    popups = popups.filter(pop => pop.life > 0);

    if (banners.length > 0) {
      banners[0].life -= dt;
      if (banners[0].life <= 0) banners.shift();
    }

    if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 1.25);

    // START SCREEN: live flying bird + 3 rival birds cruising
    if (state === 'start') {
      worldScroll += 85 * dt;
      player.x = Math.round(W * 0.27);
      player.y = H * 0.3 + Math.sin(elapsed * 4.5) * 10;
      player.rot = Math.sin(elapsed * 4.5) * 0.08;
      player.wingPhase += dt * 11;
      for (const b of skyBirds) {
        b.wing += dt * 11;
        b.y += Math.sin(elapsed * 3.5 + b.wing) * 0.45;
      }
      return;
    }

    // DEATH CUTSCENE: nearby walls gone, 4 birds fly across the sky
    if (state === 'dying') {
      worldScroll += 65 * dt;
      player.vy += 900 * dt;
      player.y = Math.min(H - GROUND_H - 12, player.y + player.vy * dt);
      player.rot = Math.min(1.4, player.rot + dt * 4);
      for (const b of skyBirds) {
        b.x += b.vx * dt;
        b.wing += dt * 13;
        b.y += Math.sin(elapsed * 5 + b.wing) * 0.6;
      }
      cutsceneTimer -= dt;
      if (cutsceneTimer <= 0) openEndModal(false);
      return;
    }

    // VICTORY CUTSCENE: Sem 12 Sunset, Blue player bird overtakes Cyan, Pink, Black birds
    if (state === 'victory_anim') {
      worldScroll += 210 * dt;
      player.y += (H * 0.40 - player.y) * Math.min(1, dt * 3);
      player.x = Math.min(W * 0.78, player.x + 115 * dt);
      player.rot = -0.08 + Math.sin(elapsed * 6) * 0.05;
      player.wingPhase += dt * 16;
      for (const b of skyBirds) {
        b.x += b.vx * dt; // Falls behind as blue bird overtakes them
        b.wing += dt * 12;
        b.y += Math.sin(elapsed * 4 + b.wing) * 0.5;
      }
      cutsceneTimer -= dt;
      if (cutsceneTimer <= 0) openEndModal(true);
      return;
    }

    if (state !== 'playing') return;

    // Intro rival birds fly away ahead when game starts
    for (const b of skyBirds) {
      b.x += b.vx * dt;
      b.wing += dt * 14;
    }
    skyBirds = skyBirds.filter(b => b.x < W + 80);

    const speed = getCurrentSpeed();
    worldScroll += speed * dt;

    if (invulnerable > 0) {
      invulnerable = Math.max(0, invulnerable - dt);
      player.dizzyAngle += dt * 9;
    }

    if (stunTimer > 0) {
      stunTimer = Math.max(0, stunTimer - dt);
      player.vy += 760 * dt;
      player.y += player.vy * dt;
      player.rot = Math.sin(elapsed * 26) * 0.45;
    } else {
      player.vy += 1240 * dt;
      player.vy = Math.min(player.vy, 590);
      player.y += player.vy * dt;
      const targetRot = clamp(player.vy / 460, -0.45, 0.92);
      player.rot += (targetRot - player.rot) * Math.min(1, dt * 10);
      player.wingPhase += dt * (player.vy < 0 ? 18 : 9);
    }

    if (player.y < CEILING) { player.y = CEILING; player.vy = Math.max(0, player.vy); }
    const floorY = H - GROUND_H - 15;
    if (player.y >= floorY) {
      player.y = floorY;
      if (invulnerable <= 0) {
        applyDamage(1, 'FLOOR');
        if (state !== 'playing') return;
      } else {
        player.vy = -240;
      }
    }

    if (spawnSemester < TOTAL_SEMESTERS) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnNextObstacle();
        const justFinishedSem = spawnStep === 0 && spawnSemester > 0;
        const interval = 335 / speed;
        spawnTimer = justFinishedSem ? interval + 0.36 : interval;
      }
    }

    const hitR = 13.5;
    for (const o of obstacles) {
      o.x -= speed * dt;
      if (o.moving) {
        const freq = currentSemester >= 9 ? 2.65 : 2.15;
        o.phase += dt * freq;
        o.gapY = clamp(o.baseY + Math.sin(o.phase) * o.amp, 126 + o.gap * 0.5, H - GROUND_H - 86 - o.gap * 0.5);
      }

      if (o.topBroken) o.topBreakAnim = Math.min(1, o.topBreakAnim + dt * 4.5);
      if (o.bottomBroken) o.bottomBreakAnim = Math.min(1, o.bottomBreakAnim + dt * 4.5);

      if (!o.passed && o.x + o.w < player.x - 10) {
        o.passed = true;
        clearedInSem = Math.min(OBSTACLES_PER_SEM, o.stepIndex + 1);
        Sound.pass();
        addPopup(`✓ ${o.type === 'MID' ? 'MID' : o.type === 'FINAL' ? 'FINAL' : TITLES[o.type]}`, player.x + 18, player.y - 24, '#ffffff', o.type === 'MID' ? '#be123c' : '#123cf3', false);
        spawnPassSparkles(o.x + o.w, o.gapY, o.type === 'FINAL' ? '#f59e0b' : '#60a5fa', o.type === 'FINAL' ? 12 : 5);
        updateHud();

        if (o.type === 'FINAL') {
          handleSemesterComplete(o.semIndex);
          if (state !== 'playing') return;
        }
      }

      if (player.x + hitR > o.x + 3 && player.x - hitR < o.x + o.w - 3) {
        const topBottom = o.gapY - o.gap / 2;
        const bottomTop = o.gapY + o.gap / 2;
        // FINAL = -2 lives, MID = -1 life, others = -1 life
        const dmg = o.type === 'FINAL' ? 2 : 1;

        if (!o.topBroken && player.y - hitR < topBottom) {
          applyDamage(dmg, o.type, o, true);
          if (state !== 'playing') return;
        } else if (!o.bottomBroken && player.y + hitR > bottomTop) {
          applyDamage(dmg, o.type, o, false);
          if (state !== 'playing') return;
        }
      }
    }

    obstacles = obstacles.filter(o => o.x + o.w > -40);
  }

  /* =========================================================
     RENDERING: 12-SEMESTER SKY, RAIN, CAMPUS, TOWERS & BIRDS
     ========================================================= */
  function drawBackground() {
    const idxA = Math.floor(clamp(themePos, 0, 11));
    const idxB = Math.min(11, idxA + 1);
    const t = clamp(themePos - idxA, 0, 1);
    const A = SEM_THEMES[idxA], B = SEM_THEMES[idxB];

    const sky = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
    sky.addColorStop(0, rgbLerp(A.top, B.top, t));
    sky.addColorStop(0.55, rgbLerp(A.mid, B.mid, t));
    sky.addColorStop(1, rgbLerp(A.bot, B.bot, t));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Stars
    const starAlpha = lerp(A.star, B.star, t);
    if (starAlpha > 0.02) {
      for (const s of stars) {
        const tw = 0.45 + 0.55 * Math.sin(elapsed * 3 + s.phase);
        ctx.fillStyle = `rgba(255,255,255,${starAlpha * tw})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Sun or Moon (Grand Sunset glow on Sem 12!)
    const sunR = lerp(A.sunR, B.sunR, t);
    if (sunR > 2) {
      const sunY = lerp(A.sunY, B.sunY, t);
      const sunX = W * 0.76;
      const sunCol = rgbLerp(A.sunCol, B.sunCol, t);
      if (themePos > 10.6) {
        const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.4, sunX, sunY, sunR * 2.5);
        glow.addColorStop(0, 'rgba(254, 215, 102, 0.55)');
        glow.addColorStop(1, 'rgba(254, 215, 102, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = sunCol;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
      ctx.fill();
      if (A.moon && t < 0.5 || B.moon && t >= 0.5) {
        ctx.fillStyle = rgbLerp(A.top, B.top, t);
        ctx.beginPath();
        ctx.arc(sunX + 7, sunY - 4, sunR * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Clouds
    const cloudAlpha = lerp(A.cloud, B.cloud, t);
    const cloudCount = Math.round(lerp(A.clouds, B.clouds, t));
    ctx.fillStyle = `rgba(255,255,255,${cloudAlpha})`;
    const span = W + 200;
    for (let i = 0; i < cloudCount; i++) {
      const cx = (((i * 96 - worldScroll * 0.11) % span) + span) % span - 90;
      const cy = 68 + (i % 3) * 58;
      ctx.beginPath();
      ctx.arc(cx, cy, 19, 0, Math.PI * 2);
      ctx.arc(cx + 21, cy - 7, 24, 0, Math.PI * 2);
      ctx.arc(cx + 44, cy, 17, 0, Math.PI * 2);
      ctx.fill();
    }

    // Hills
    ctx.fillStyle = rgbLerp(A.hill, B.hill, t);
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_H);
    for (let x = 0; x <= W + 20; x += 20) {
      ctx.lineTo(x, H - GROUND_H - 94 - Math.sin((x + worldScroll * 0.16) * 0.012) * 16);
    }
    ctx.lineTo(W, H - GROUND_H);
    ctx.closePath();
    ctx.fill();

    // Campus buildings
    const bldgColor = rgbLerp(A.bldg, B.bldg, t);
    const winAlpha = lerp(A.win, B.win, t);
    const tileW = 300;
    const baseY = H - GROUND_H;
    const offset = ((worldScroll * 0.28) % tileW + tileW) % tileW;

    for (let sx = -offset - tileW; sx < W + tileW; sx += tileW) {
      ctx.fillStyle = bldgColor;
      ctx.fillRect(sx + 12, baseY - 80, 76, 80);
      ctx.beginPath();
      ctx.moveTo(sx + 6, baseY - 80); ctx.lineTo(sx + 50, baseY - 100); ctx.lineTo(sx + 94, baseY - 80);
      ctx.closePath(); ctx.fill();

      ctx.fillRect(sx + 108, baseY - 134, 36, 134);
      ctx.beginPath();
      ctx.moveTo(sx + 104, baseY - 134); ctx.lineTo(sx + 126, baseY - 166); ctx.lineTo(sx + 148, baseY - 134);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = winAlpha > 0.3 ? '#fef08a' : 'rgba(255,255,255,0.65)';
      ctx.beginPath(); ctx.arc(sx + 126, baseY - 114, 7.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = bldgColor;
      ctx.fillRect(sx + 168, baseY - 70, 92, 70);
      ctx.beginPath(); ctx.arc(sx + 214, baseY - 70, 30, Math.PI, 0); ctx.fill();

      if (winAlpha > 0.05) {
        ctx.fillStyle = `rgba(253,224,71,${winAlpha * 0.85})`;
        for (let r = 0; r < 3; r++)
          for (let c = 0; c < 4; c++)
            ctx.fillRect(sx + 22 + c * 15, baseY - 66 + r * 18, 7, 10);
      }
    }

    // Rain overlay (Sem 6 & Sem 9)
    const rainAmt = lerp(A.rain, B.rain, t);
    if (rainAmt > 0.05) {
      ctx.save();
      ctx.strokeStyle = `rgba(203, 213, 225, ${Math.min(0.65, rainAmt * 0.55)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (const r of raindrops) {
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - 4, r.y + r.len);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawGround() {
    const y = H - GROUND_H;
    ctx.fillStyle = '#16a34a';
    ctx.fillRect(0, y, W, 12);
    ctx.fillStyle = '#22c55e';
    const sw = 28;
    const off = ((worldScroll) % (sw * 2) + sw * 2) % (sw * 2);
    for (let x = -off - sw * 2; x < W + sw * 2; x += sw * 2) ctx.fillRect(x, y, sw, 12);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(0, y + 12, W, GROUND_H - 12);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(0, y + 12, W, 3);
  }

  function drawPaperBlock(g, x, y, w, h, fill, border, rule, fold = true) {
    if (h <= 2 || w <= 2) return;
    g.fillStyle = fill;
    g.strokeStyle = border;
    g.lineWidth = 1.6;
    g.beginPath();
    g.roundRect(x, y, w, h, 3);
    g.fill();
    g.stroke();
    if (rule && h > 12) {
      g.strokeStyle = rule;
      g.lineWidth = 1.1;
      g.beginPath();
      for (let ry = y + 7; ry < y + h - 4; ry += 7) { g.moveTo(x + 5, ry); g.lineTo(x + w - 6, ry); }
      g.stroke();
    }
    if (fold && w > 14 && h > 14) {
      g.fillStyle = '#e2e8f0';
      g.beginPath(); g.moveTo(x + w - 9, y); g.lineTo(x + w, y); g.lineTo(x + w, y + 9); g.closePath();
      g.fill(); g.stroke();
    }
  }

  const PAD = 3;
  let sprites = {};
  function sprite(key, w, h, paint) {
    if (sprites[key]) return sprites[key];
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * scale);
    c.height = Math.ceil(h * scale);
    const g = c.getContext('2d');
    g.scale(scale, scale);
    paint(g);
    return (sprites[key] = { c, w: c.width / scale, h: c.height / scale });
  }

  function towerSprite(type, isTop) {
    const w = WIDTHS[type];
    return sprite(`tower-${type}-${isTop}`, w + PAD * 2, H, g => {
      const step = 14;
      for (let i = 0; i < Math.ceil(H / step); i++) {
        const st = i % 2 === 0 ? 0 : 2;
        const sy = isTop ? (H - (i + 1) * step) : (i * step);
        const sh = Math.min(step - 1, isTop ? (sy + step) : (H - sy));
        if (sh <= 1) continue;
        const x = PAD + st, bw = w - st;
        if (type === 'ASSIGN') drawPaperBlock(g, x, sy, bw, sh, '#ffffff', '#64748b', '#93c5fd', i === 0);
        else if (type === 'CT') drawPaperBlock(g, x, sy, bw, sh, '#f8fafc', '#475569', '#fca5a5', i === 0);
        else if (type === 'PPTX') drawPaperBlock(g, x, sy, bw, sh, i % 2 === 0 ? '#fff7ed' : '#ffedd5', '#c2410c', '#fdba74', false);
        else if (type === 'ATTEND') drawPaperBlock(g, x, sy, bw, sh, '#ecfdf5', '#047857', '#6ee7b7', i === 0);
        else if (type === 'MID') drawPaperBlock(g, x, sy, bw, sh, i % 2 === 0 ? '#fff1f2' : '#ffe4e6', '#be123c', '#fda4af', i === 0);
        else drawPaperBlock(g, x, sy, bw, sh, i % 2 === 0 ? '#fefce8' : '#fef9c3', '#b45309', '#fcd34d', i === 0);
      }
    });
  }

  const TAG_FONT = '900 13px system-ui, sans-serif';
  const TAG_H = 24;
  function tagSprite(type) {
    ctx.save(); ctx.font = TAG_FONT;
    const pw = Math.max(WIDTHS[type] - 2, ctx.measureText(TITLES[type]).width + 18);
    ctx.restore();
    return sprite('tag-' + type, pw + 4, TAG_H + 4, g => {
      g.fillStyle = type === 'FINAL' ? '#b45309' : type === 'MID' ? '#be123c' : '#0f2547';
      g.strokeStyle = '#ffffff'; g.lineWidth = 1.5;
      g.beginPath(); g.roundRect(2, 2, pw, TAG_H, 11); g.fill(); g.stroke();
      g.fillStyle = '#ffffff'; g.font = TAG_FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(TITLES[type], 2 + pw / 2, 2 + TAG_H / 2 + 0.5);
    });
  }

  function paperPiece(fill, line) {
    return sprite(`piece-${fill}-${line}`, 28, 22, g => drawPaperBlock(g, 2, 2, 24, 18, fill, '#475569', line, false));
  }

  // paint everything before it is needed, so the first hit does not stutter
  function buildSprites() {
    sprites = {};
    for (const type of Object.keys(TITLES)) {
      towerSprite(type, true); towerSprite(type, false); tagSprite(type);
    }
    for (const [fill, line] of [['#ffffff', '#93c5fd'], ['#f8fafc', '#f87171'], ['#f97316', '#9a3412'], ['#ffedd5', '#9a3412'],
      ['#ecfdf5', '#10b981'], ['#ffe4e6', '#be123c'], ['#fecdd3', '#be123c'], ['#fef3c7', '#b45309'], ['#e2e8f0', '#b45309']]) paperPiece(fill, line);
  }

  function drawTower(o, x, y, w, h, isTop) {
    if (h <= 2) return;
    const ba = isTop ? o.topBreakAnim : o.bottomBreakAnim;
    if (ba > 0) {
      const retract = ba * 56;
      if (isTop) h = Math.max(0, h - retract);
      else { y += retract; h = Math.max(0, h - retract); }
      if (h <= 4) return;
      ctx.globalAlpha = Math.max(0.22, 1 - ba * 0.7);
    }
    const s = towerSprite(o.type, isTop);
    const from = isTop ? Math.max(0, H - h) : 0;
    const part = Math.min(h, H);
    ctx.drawImage(s.c, 0, from * scale, s.c.width, part * scale, x - PAD, y, s.w, part);
    ctx.globalAlpha = 1;
  }

  function drawObstacle(o) {
    if (o.x > W + 60) return;
    const topH = Math.max(0, o.gapY - o.gap / 2);
    const botY = o.gapY + o.gap / 2;
    const botH = Math.max(0, H - GROUND_H - botY);

    if (o.moving) {
      ctx.save();
      ctx.strokeStyle = 'rgba(190, 24, 93, 0.45)';
      ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(o.x + o.w + 7, o.baseY - o.amp); ctx.lineTo(o.x + o.w + 7, o.baseY + o.amp); ctx.stroke();
      ctx.restore();
    }

    drawTower(o, o.x, 0, o.w, topH, true);
    drawTower(o, o.x, botY, o.w, botH, false);

    const tag = tagSprite(o.type);
    const tagY = topH > 48 ? topH - 33 : botY + 6;
    ctx.drawImage(tag.c, o.x + o.w / 2 - tag.w / 2, tagY, tag.w, tag.h);
  }

  // Upgraded bird model with crisp outline, graduation cap, NO shield
  function drawBirdModel(x, y, rot, wingPhase, bodyCol, outlineCol, bellyCol, isPlayer = false) {
    ctx.save();
    ctx.translate(x, y);
    if (isPlayer && invulnerable > 0 && Math.floor(invulnerable * 12) % 2 === 0) {
      ctx.globalAlpha = 0.55;
    }
    ctx.rotate(rot);

    // Tail feathers
    ctx.fillStyle = bodyCol;
    ctx.strokeStyle = outlineCol;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-15, -3); ctx.lineTo(-26, -8); ctx.lineTo(-22, 0); ctx.lineTo(-26, 6); ctx.lineTo(-14, 4);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Main body with strong clean outline
    ctx.fillStyle = bodyCol;
    ctx.strokeStyle = outlineCol;
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 14.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // Belly highlight
    ctx.fillStyle = bellyCol;
    ctx.beginPath();
    ctx.ellipse(1, 4.5, 11, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Flapping wing with outline
    const flapAng = Math.sin(wingPhase) * 0.6;
    ctx.save();
    ctx.translate(-5, 2);
    ctx.rotate(-0.2 + flapAng);
    ctx.fillStyle = bodyCol;
    ctx.strokeStyle = outlineCol;
    ctx.lineWidth = 2.3;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // Beak
    ctx.fillStyle = '#f97316';
    ctx.strokeStyle = '#7c2d12';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(15, -3.5); ctx.lineTo(27.5, 1); ctx.lineTo(15, 5.5); ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Eye
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(8, -5, 5.8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    if (isPlayer && invulnerable > 0) {
      ctx.save();
      ctx.translate(8, -5);
      ctx.rotate(player.dizzyAngle);
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 3.5; a += 0.35) {
        const r = a * 0.4;
        if (a === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(10, -5, 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(10.8, -6, 0.9, 0, Math.PI * 2); ctx.fill();
    }

    // Graduation Cap
    ctx.save();
    ctx.translate(1, -15.5);
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = '#020617';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-13, 0); ctx.lineTo(0, -6); ctx.lineTo(13, 0); ctx.lineTo(0, 5); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(14.5, 7); ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function drawEffects() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    for (const d of debris) {
      ctx.save();
      ctx.globalAlpha = clamp(d.life / d.maxLife, 0, 1);
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      if (d.isPencil) {
        ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#854d0e'; ctx.lineWidth = 1.3;
        ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h); ctx.strokeRect(-d.w / 2, -d.h / 2, d.w, d.h);
      } else {
        const piece = paperPiece(d.sheetFill, d.lineCol);
        ctx.drawImage(piece.c, -d.w * 7 / 12, -d.h * 11 / 18, d.w * 7 / 6, d.h * 11 / 9);
      }
      ctx.restore();
    }

    for (const c of confetti) {
      ctx.save();
      ctx.globalAlpha = clamp(c.life / c.maxLife, 0, 1);
      ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }

    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(220, 38, 38, ${flashAlpha * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }

    // Floating +1, +CHECKPOINT, +1 ♥ popups
    for (const pop of popups) {
      ctx.save();
      ctx.globalAlpha = clamp(pop.life / pop.maxLife, 0, 1);
      ctx.font = pop.big ? '900 13px system-ui' : '900 11px system-ui';
      const tw = pop.width || (pop.width = ctx.measureText(pop.text).width + 16);
      const th = pop.big ? 26 : 21;
      ctx.fillStyle = pop.bg;
      ctx.beginPath(); ctx.roundRect(pop.x - tw / 2, pop.y - th / 2, tw, th, th / 2); ctx.fill();
      ctx.fillStyle = pop.color;
      ctx.textAlign = 'center';
      ctx.fillText(pop.text, pop.x, pop.y + (pop.big ? 4.5 : 4));
      ctx.restore();
    }

    // Slide-in Semester / Year Banner
    if (banners.length > 0) {
      const b = banners[0];
      const prog = 1 - b.life / b.maxLife;
      let slideY = 128, alpha = 1;
      if (prog < 0.14) { const k = prog / 0.14; slideY = lerp(72, 128, 1 - Math.pow(1 - k, 3)); alpha = k; }
      else if (prog > 0.82) { const k = (prog - 0.82) / 0.18; slideY = lerp(128, 92, k); alpha = 1 - k; }

      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1);
      const bw = Math.min(W - 28, 326), bh = b.subtitle ? 52 : 38, bx = (W - bw) / 2;
      ctx.fillStyle = '#0f2547'; ctx.strokeStyle = b.accent; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.roundRect(bx, slideY, bw, bh, 14); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.font = '900 13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(b.title, W / 2, slideY + (b.subtitle ? 22 : 24));
      if (b.subtitle) {
        ctx.fillStyle = '#fde68a'; ctx.font = '800 10px system-ui';
        ctx.fillText(b.subtitle, W / 2, slideY + 40);
      }
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let sx = 0, sy = 0;
    if (shakeTimer > 0) { sx = rand(-shakeTimer * 16, shakeTimer * 16); sy = rand(-shakeTimer * 16, shakeTimer * 16); }

    ctx.scale(scale, scale);
    ctx.translate(sx, sy);

    drawBackground();
    obstacles.forEach(drawObstacle);
    drawGround();

    // Rival / Sky Birds
    for (const b of skyBirds) {
      drawBirdModel(b.x, b.y, 0, b.wing, b.color, b.stroke, 'rgba(255,255,255,0.35)', false);
    }

    // Player bird in the chosen colour
    const bird = BIRDS[birdName];
    drawBirdModel(player.x, player.y, player.rot, player.wingPhase, bird.body, bird.line, bird.belly, true);

    drawEffects();
  }

  function loop(now) {
    const dt = Math.min(0.035, (now - lastTime) / 1000 || 0);
    lastTime = now;
    if (state !== 'paused' && state !== 'over' && state !== 'won') {
      update(dt);
      render();
      rafId = requestAnimationFrame(loop);
    }
  }

  /* =========================================================
     CONTROLS
     ========================================================= */
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    flap();
  });

  $('pauseBtn').addEventListener('click', pauseGame);
  $('resumeBtn').addEventListener('click', resumeGame);
  $('restartBtn').addEventListener('click', () => {
    resetToStart();
    lastTime = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  });
  $('againBtn').addEventListener('click', () => {
    resetToStart();
    lastTime = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  });
  const toggleSound = () => { Sound.toggle(); syncSoundIcon(); };
  $('soundBtn').addEventListener('click', toggleSound);
  $('pauseSound').addEventListener('click', toggleSound);
  $('tapBtn').addEventListener('click', e => { e.currentTarget.blur(); if (state === 'start') startRunFromTap(); });

  Object.entries(BIRDS).forEach(([name, c]) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (name === birdName ? ' on' : '');
    b.style.background = c.body;
    b.dataset.bird = name;
    b.setAttribute('aria-label', name + ' bird');
    b.onclick = () => {
      b.blur();
      birdName = name;
      saveVal(STORAGE_BIRD, name);
      [...$('swatches').children].forEach(x => x.classList.toggle('on', x === b));
      if (state === 'start') spawnIntroBirds();
    };
    $('swatches').appendChild(b);
  });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (state === 'start' || state === 'playing') { e.preventDefault(); flap(); }
    } else if (e.code === 'Escape' || e.code === 'KeyP') {
      if (state === 'playing') pauseGame();
      else if (state === 'paused') resumeGame();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') pauseGame();
  });

  window.addEventListener('resize', () => { resizeCanvas(); render(); });

  window.addEventListener('load', () => {
    syncSoundIcon();
    resizeCanvas();
    resetToStart();
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
