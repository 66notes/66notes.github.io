name: Update BUBT Notices

on:
  schedule:
    # Runs at minute 0 of every hour (UTC). Adjust as you like.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        run: python scripts/scrape_notices.py

      - name: Commit updated notices.json
        run: |
          git config user.name "notices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notices.json
          if git diff —cached —quiet; then
            echo "No changes to notices.json"
          else
            git commit -m "chore: update notices.json [skip ci]"
            git push
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            debug_page.html
            debug_screenshot.png
          if-no-files-found: ignore
